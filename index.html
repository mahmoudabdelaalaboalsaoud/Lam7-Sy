<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>LAM7 Publishing System</title>
<meta name="description" content="نظام إدارة نشر إعلانات السيارات - لمح كارز" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0d0d'/%3E%3Cpath d='M18 44V20h6v18h14v6H18z' fill='%23E8192C'/%3E%3Ccircle cx='46' cy='18' r='4' fill='%23F5A623'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink-950:#0a0a0c; --ink-900:#0d0d0d; --ink-850:#141417; --ink-800:#1a1a1f;
    --ink-700:#232329; --ink-600:#2e2e36; --ink-500:#3f3f49;
    --text-1:#f2f1ef; --text-2:#c9c9ce; --text-3:#a9a9b0; --text-4:#8a8a92; --text-5:#6c6c74;
    --red:#E8192C; --red-dark:#B01121; --gold:#F5A623;
    --green:#34d399; --sky:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink-900); color:var(--text-1);
    font-family:'Cairo',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px;}
  a{color:inherit}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-600); border-radius:999px;}

  /* topbar */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(13,13,13,.88); backdrop-filter:blur(14px); border-bottom:1px solid var(--ink-700);}
  .topbar-inner{max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; display:flex; align-items:center; gap:12px;}
  .logo{width:36px; height:36px; border-radius:11px; background:var(--red); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45);}
  .logo span{color:#fff; font-weight:900; font-size:13px;}
  .topbar h1{font-size:17px; font-weight:800; margin:0; line-height:1.2; color:#fff;}
  .topbar p{font-size:12.5px; color:var(--text-4); margin:2px 0 0;}

  .content{padding:16px;}

  /* bottom nav */
  .bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(13,13,13,.92); backdrop-filter:blur(14px); border-top:1px solid var(--ink-700); padding-bottom:env(safe-area-inset-bottom);}
  .bottomnav-inner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr);}
  .navbtn{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:9px 0 7px; color:var(--text-5); transition:transform .1s;}
  .navbtn:active{transform:scale(.93);}
  .navbtn.active{color:var(--red);}
  .navbtn .bar{position:absolute; top:0; width:32px; height:2px; border-radius:2px; background:var(--red);}
  .navbtn svg{width:19px; height:19px;}
  .navbtn span{font-size:9.5px; font-weight:700;}

  /* cards */
  .card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6); overflow:hidden;}
  .slot{margin-bottom:12px; animation:rise .28s ease-out;}
  .slot-bar{height:4px; width:100%;}
  .slot-body{padding:16px;}
  .slot-head{display:flex; align-items:center; gap:10px;}
  .platform-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .slot-label{font-size:13px; font-weight:700; color:var(--text-2); flex:1; min-width:0;}
  .prio-badge{font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; border:1px solid; flex-shrink:0; white-space:nowrap;}
  .car-name{font-size:19px; font-weight:800; color:#fff; margin:12px 0 0; line-height:1.35;}
  .car-notes{display:flex; gap:6px; align-items:flex-start; font-size:13px; color:var(--text-3); margin-top:5px; line-height:1.4;}
  .fresh-pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:800; margin-top:12px;}
  .fresh-dot{width:6px; height:6px; border-radius:999px;}
  .slot-actions{display:flex; gap:8px; margin-top:16px;}
  .btn-link{display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 15px; font-size:13px; font-weight:700; color:var(--text-2); flex-shrink:0; transition:transform .1s;}
  .btn-link:active{transform:scale(.95);}
  .btn-publish{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--red); padding:13px 16px; font-size:15px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .btn-publish:active{transform:scale(.95);}
  .empty-slot{border:1.5px dashed var(--ink-600); border-radius:16px; padding:22px; text-align:center; background:rgba(20,20,23,.4); margin-bottom:12px;}
  .empty-slot .platform-icon{margin:0 auto;}
  .empty-slot p{margin:8px 0 0;}
  .empty-slot .t1{font-size:14px; font-weight:800; color:#fff;}
  .empty-slot .t2{font-size:12.5px; color:var(--text-4); margin-top:3px;}

  /* daily plan progress */
  .progress-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .progress-card.all-done{border-color:rgba(52,211,153,.4); background:linear-gradient(135deg, rgba(52,211,153,.08), var(--ink-850));}
  .progress-head{display:flex; align-items:center; justify-content:space-between;}
  .progress-title{font-size:15px; font-weight:800; color:#fff;}
  .progress-count{font-size:13px; font-weight:800; color:var(--red);}
  .all-done .progress-count{color:#34d399;}
  .progress-track{height:8px; border-radius:999px; background:var(--ink-700); margin-top:10px; overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--red), var(--gold)); transition:width .4s ease;}
  .all-done .progress-fill{background:#34d399;}
  .progress-sub{font-size:12.5px; color:var(--text-4); font-weight:600; margin-top:8px;}

  /* alerts panel */
  .alerts-panel{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:14px 16px; margin-bottom:14px;}
  .alerts-head{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:800; color:#fff; margin-bottom:8px;}
  .alerts-toggle{font-size:11.5px; font-weight:800; color:var(--red); background:none; padding:2px 4px;}
  .alert-item{display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-top:1px solid var(--ink-700);}
  .alert-item:first-of-type{border-top:none;}
  .alert-dot{width:6px; height:6px; border-radius:999px; margin-top:6px; flex-shrink:0;}
  .alert-text{font-size:12.5px; color:var(--text-2); line-height:1.6;}

  /* mini progress (car completion) */
  .mini-progress-wrap{margin-top:10px;}
  .mini-progress-label{display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--text-4); margin-bottom:4px;}
  .mini-progress-track{height:5px; border-radius:999px; background:var(--ink-700); overflow:hidden;}
  .mini-progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--gold), #34d399); transition:width .4s ease;}

  .done-badge{display:flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; background:rgba(52,211,153,.15); color:#34d399; flex-shrink:0; white-space:nowrap;}
  .slot.slot-done{opacity:.72;}
  .slot.slot-done:hover{opacity:1;}
  .btn-publish-done{background:var(--ink-700); box-shadow:none; color:var(--text-2);}

  /* compact today list (simplified, replaces big slot cards) */
  .today-list{ margin-top:2px; }
  .today-row{ position:relative; display:flex; align-items:center; gap:10px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:14px; padding:10px 12px; margin-bottom:8px; overflow:hidden; animation:rise .22s ease-out; }
  .today-row-bar{ position:absolute; top:0; bottom:0; right:0; width:3px; }
  html[dir="rtl"] .today-row-bar{ right:0; left:auto; }
  .today-row.today-row-done{ opacity:.68; }
  .today-row.today-row-done:hover{ opacity:1; }
  .today-row-empty{ border-style:dashed; opacity:.7; }
  .today-icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .today-mid{ flex:1; min-width:0; }
  .today-plat{ font-size:11px; font-weight:800; color:var(--text-4); display:flex; align-items:center; gap:6px; }
  .today-slot-tag{ font-size:9.5px; font-weight:800; background:var(--ink-700); color:var(--text-3); padding:1px 5px; border-radius:6px; }
  .today-done-check{ font-size:10.5px; font-weight:800; color:#34d399; }
  .today-car{ font-size:14.5px; font-weight:800; color:#fff; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .today-empty-txt{ font-size:12px; color:var(--text-4); margin-top:2px; }
  .today-time{ font-size:11px; font-weight:700; margin-top:2px; }
  .today-right{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .today-link-btn{ width:30px; height:30px; border-radius:9px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-3); }
  .today-btn{ width:34px; height:34px; border-radius:10px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -6px rgba(232,25,44,.5); transition:transform .1s; }
  .today-btn:active{ transform:scale(.9); }
  .today-btn.today-btn-done{ background:var(--ink-700); box-shadow:none; color:var(--text-3); }

  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(.97);} 100%{transform:scale(1);}}
  .pop{animation:pop .25s ease-out;}

  /* republish list */
  .rq-item{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .rq-rank{width:28px; height:28px; border-radius:999px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text-4); flex-shrink:0;}
  .rq-mid{flex:1; min-width:0;}
  .rq-name-row{display:flex; align-items:center; gap:8px;}
  .rq-name{font-size:15px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rq-days-box{flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; padding:6px 10px;}
  .rq-days-num{font-size:18px; font-weight:900; line-height:1;}
  .rq-days-lbl{font-size:9px; font-weight:800; margin-top:2px;}
  .rq-del{flex-shrink:0; width:32px; height:32px; border-radius:10px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-5); transition:transform .1s;}
  .rq-del:active{transform:scale(.9);}
  .rq-del.confirm{width:auto; padding:0 10px; background:var(--red); color:#fff; font-size:11px; font-weight:800; white-space:nowrap;}

  /* empty state */
  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:70px 20px;}
  .empty-state .box{width:56px; height:56px; border-radius:16px; background:var(--ink-850); border:1px solid var(--ink-700); display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .empty-state .t1{font-size:15px; font-weight:800; color:#fff;}
  .empty-state .t2{font-size:13px; color:var(--text-4); margin-top:4px;}

  /* form */
  .field{display:block; margin-bottom:16px;}
  .field label{display:block; margin-bottom:6px; font-size:13px; font-weight:700; color:var(--text-3);}
  .input{width:100%; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 14px; font-size:15px; font-weight:600; color:#fff; outline:none; transition:border-color .15s;}
  .input::placeholder{color:#5c5c64;}
  .input:focus{border-color:var(--red);}
  textarea.input{resize:none;}
  .prio-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .prio-opt{border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 0; font-size:13px; font-weight:800; color:var(--text-4); text-align:center; transition:all .15s;}
  .prio-opt.active{transform:scale(1.03); border-color:transparent;}
  .prio-opt.active.high{background:rgba(232,25,44,.15); color:var(--red);}
  .prio-opt.active.medium{background:rgba(245,166,35,.15); color:var(--gold);}
  .prio-opt.active.low{background:rgba(63,63,73,.4); color:#b7b7be;}
  .submit-btn{width:100%; border-radius:12px; background:var(--red); padding:15px 0; font-size:16px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .submit-btn:disabled{opacity:.3; box-shadow:none;}
  .submit-btn:active:not(:disabled){transform:scale(.97);}

  /* toast */
  .toast-wrap{position:fixed; bottom:96px; left:0; right:0; z-index:40; display:flex; justify-content:center; padding:0 16px; pointer-events:none;}
  .toast{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:999px; padding:11px 18px; box-shadow:0 8px 24px -12px rgba(0,0,0,.6); font-size:13px; font-weight:700; color:#fff; animation:rise .25s ease-out;}

  /* offline / sync status banner */
  .status-banner{text-align:center; font-size:12px; font-weight:800; padding:9px 12px;}
  .status-banner.offline{background:var(--red); color:#fff;}
  .status-banner.online{background:#34d399; color:#062b1e;}
  .offline-dot{display:inline-block; width:7px; height:7px; border-radius:999px; background:#fff; margin-left:4px; animation:pop 1.4s ease-in-out infinite;}

  /* login screen */
  .login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; max-width:420px; margin:0 auto;}
  .login-logo{width:64px; height:64px; border-radius:18px; margin-bottom:20px;}
  .login-logo span{font-size:22px;}
  .login-title{font-size:20px; font-weight:900; color:#fff; margin:0 0 8px;}
  .login-sub{font-size:13.5px; color:var(--text-4); line-height:1.7; margin:0 0 28px;}
  .google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:#fff; color:#1f1f1f; border-radius:12px; padding:14px 20px; font-size:15px; font-weight:800; box-shadow:0 8px 24px -12px rgba(0,0,0,.5); transition:transform .1s;}
  .google-btn:active{transform:scale(.97);}
  .login-error{margin-top:16px; font-size:12.5px; color:var(--red); line-height:1.7; background:rgba(232,25,44,.1); border:1px solid rgba(232,25,44,.3); border-radius:10px; padding:12px;}

  /* account chip + menu */
  .account-chip-wrap{position:relative; flex-shrink:0;}
  .account-chip{width:34px; height:34px; border-radius:999px; overflow:hidden; background:var(--red); display:flex; align-items:center; justify-content:center; border:2px solid var(--ink-700);}
  .account-chip img{width:100%; height:100%; object-fit:cover;}
  .account-chip span{color:#fff; font-weight:900; font-size:13px;}
  .account-menu{position:absolute; top:42px; left:0; z-index:40; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:14px; padding:14px; width:200px; box-shadow:0 12px 30px -10px rgba(0,0,0,.7); animation:rise .2s ease-out;}
  .account-menu-name{font-size:13.5px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-email{font-size:11.5px; color:var(--text-4); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-signout{width:100%; margin-top:12px; border-radius:10px; background:var(--ink-700); padding:9px 0; font-size:12.5px; font-weight:800; color:#fff;}

  /* migration banner */
  .migration-banner{background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.3); border-radius:14px; padding:14px; margin:12px 16px 0;}
  .migration-text{font-size:13px; font-weight:700; color:var(--gold); line-height:1.6;}
  .migration-actions{display:flex; gap:8px; margin-top:10px;}

  /* stats */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .stat-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .stat-icon{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-size:16px;}
  .stat-val{font-size:26px; font-weight:900; line-height:1;}
  .stat-lbl{font-size:12.5px; font-weight:700; color:var(--text-4); margin-top:6px;}
  .hl-card{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .hl-icon{width:44px; height:44px; border-radius:12px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .hl-title{font-size:12px; font-weight:700; color:var(--text-4);}
  .hl-name{font-size:15px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hl-detail{font-size:12.5px; font-weight:600; color:var(--text-3); margin-top:2px;}

  /* management screen */
  .mgmt-toolbar{margin-bottom:14px;}
  .mgmt-search-box{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:12px; padding:11px 14px;}
  .mgmt-search-input{flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:14px; font-weight:600;}
  .mgmt-search-input::placeholder{color:#5c5c64;}
  .mgmt-filters{display:flex; gap:8px; margin-top:10px;}
  .chip{border-radius:999px; border:1px solid var(--ink-600); background:var(--ink-800); padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--text-4); transition:all .15s;}
  .chip.active{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-item{margin-bottom:12px; animation:rise .25s ease-out;}
  .mgmt-item-body{padding:16px;}
  .mgmt-item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .mgmt-name{font-size:17px; font-weight:800; color:#fff; line-height:1.3; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mgmt-badges{display:flex; gap:6px; flex-shrink:0;}
  .status-badge{font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .status-badge.active{background:rgba(52,211,153,.15); color:#34d399;}
  .status-badge.inactive{background:rgba(139,139,147,.18); color:#8b8b93;}
  .mgmt-meta-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:var(--text-3); font-weight:600;}
  .mgmt-meta-row b{color:#fff; font-weight:800;}
  .mgmt-plat-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .mgmt-plat-chip{font-size:11px; font-weight:700; background:var(--ink-800); border:1px solid var(--ink-700); border-radius:8px; padding:4px 7px; color:var(--text-3); white-space:nowrap;}
  .mgmt-count-chip{color:var(--gold); border-color:rgba(245,166,35,.25);}
  .mgmt-section-label{font-size:10.5px; font-weight:800; color:var(--text-5); margin:10px 0 0; text-transform:uppercase; letter-spacing:.02em;}

  /* team dashboard */

  .admin-link-input::placeholder{color:#5c5c64;}
  .admin-link-btn{flex-shrink:0; border-radius:9px; background:var(--ink-700); border:1px solid var(--ink-600); padding:0 12px; font-size:11px; font-weight:800; color:#fff;}

  .chan-freq-val{font-size:13px; font-weight:900; color:#fff; min-width:14px; text-align:center;}

    .navbtn .bar{ top:14%; left:0; right:auto; width:3px; height:72%; border-radius:3px; }
    .navbtn svg{ width:20px; height:20px; }

    .topbar-inner{ max-width:900px; margin:0 auto; padding-top:26px; }

    .today-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:10px; align-items:start; }

    .mgmt-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:14px; align-items:start; }

    .chan-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:10px; align-items:start; }
    .chan-list .chan-item{ margin-bottom:0; }

    .rq-list{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .rq-item{ margin-bottom:0; }

    .stat-grid{ grid-template-columns:repeat(4,1fr); }

    .add-form-wrap{ max-width:520px; }

    .btn-publish:hover, .btn-link:hover, .submit-btn:hover, .mgmt-btn:hover, .chip:hover{ filter:brightness(1.1); }
    .rq-del:hover{ background:var(--ink-700); }
  }</style>

<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc, getDocs, increment, arrayUnion
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

/* =========================================================
   إعدادات Firebase — عدّل القيم دي ببيانات مشروعك من Firebase Console
   Project Settings → General → Your apps → SDK setup and configuration
   ========================================================= */
var firebaseConfig = {
  apiKey: "AIzaSyDPZ0rG55-wMScPoPm1XDqGu0AzzWzLdY0",
  authDomain: "lam7-sy.mahmoudabdelaalaboalsaoud.workers.dev",
  projectId: "flosy-rahet-fen",
  storageBucket: "flosy-rahet-fen.firebasestorage.app",
  messagingSenderId: "822676232858",
  appId: "1:822676232858:web:8efdb44bdd9d6bf4199d23"
};
/* ========================================================= */

(function(){
  "use strict";

  var CONFIG_MISSING = firebaseConfig.apiKey === "YOUR_API_KEY" || !firebaseConfig.apiKey;

  if (CONFIG_MISSING) {
    document.getElementById("app").innerHTML =
      '<div style="padding:60px 24px;text-align:center;max-width:420px;margin:0 auto">' +
      '<div class="logo" style="margin:0 auto 18px"><span>L7</span></div>' +
      '<h2 style="color:#fff;font-size:19px;margin:0 0 10px">إعداد Firebase مطلوب</h2>' +
      '<p style="color:#a9a9b0;font-size:14px;line-height:1.7;margin:0 0 16px">' +
      'افتح ملف الصفحة، ادور على <code style="background:#1a1a1f;padding:2px 6px;border-radius:6px">firebaseConfig</code> ' +
      'في أول السكريبت، واستبدل القيم ببيانات مشروعك من Firebase Console.</p>' +
      '<p style="color:#6c6c74;font-size:12.5px">Project Settings → General → Your apps → SDK setup and configuration</p>' +
      '</div>';
    return;
  }

  var app = initializeApp(firebaseConfig);
  var db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
  var auth = getAuth(app);
  var googleProvider = new GoogleAuthProvider();

  var carsCol, logCol, platformsCol;
  var currentUser = null;
  var unsubCars = null, unsubPlatforms = null, unsubLog = null, unsubAccount = null, unsubAllAccounts = null;

  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  var DEFAULT_PLATFORMS = [
    { id:"fb1", label:"فيسبوك — منشور 1", emoji:"📘", bg:"rgba(24,119,242,.15)", order:0, frequency:1 },
    { id:"fb2", label:"فيسبوك — منشور 2", emoji:"📘", bg:"rgba(24,119,242,.15)", order:1, frequency:1 },
    { id:"whatsapp", label:"واتساب", emoji:"💬", bg:"rgba(37,211,102,.15)", order:2, frequency:1 },
    { id:"telegram", label:"تيليجرام", emoji:"✈️", bg:"rgba(41,182,246,.15)", order:3, frequency:1 },
    { id:"tiktok", label:"تيك توك", emoji:"🎵", bg:"rgba(255,255,255,.10)", order:4, frequency:1 },
    { id:"youtube", label:"يوتيوب شورتس", emoji:"▶️", bg:"rgba(255,0,51,.15)", order:5, frequency:1 }
  ];
  var PRIORITY_META = {
    high:   { label:"عالية",  weight:3, urgencyWeight:1.5,  chip:"background:rgba(232,25,44,.15);color:#E8192C;border-color:rgba(232,25,44,.3)" },
    medium: { label:"متوسطة", weight:2, urgencyWeight:1,    chip:"background:rgba(245,166,35,.15);color:#F5A623;border-color:rgba(245,166,35,.3)" },
    low:    { label:"منخفضة", weight:1, urgencyWeight:0.65, chip:"background:rgba(63,63,73,.4);color:#b7b7be;border-color:rgba(63,63,73,.5)" }
  };

  /* ---------------- state (synced live from Firestore) ---------------- */
  var state = {
    cars: [],
    log: [],
    platforms: [],
    carsLoaded: false,
    platformsLoaded: false,
    loading: true,
    authResolved: false,
    showAccountMenu: false,
    migrationAvailable: false,
    accountLoaded: false,
    accountStatus: null,
    accountExpiresAt: null,
    allAccounts: [],
    allAccountsLoaded: false,
    accountTeam: [],
    teamStats: {},
    teamStatsLoaded: {},
    authError: null,
    showAllAlerts: false,
    migrating: false,
    tab: "today",
    toast: null,
    confirmDeleteId: null,
    justPublished: null,
    online: navigator.onLine,
    syncFlash: false
  };

  window.addEventListener("online", function(){
    state.online = true;
    state.syncFlash = true;
    render();
    setTimeout(function(){ state.syncFlash = false; render(); }, 2500);
  });
  window.addEventListener("offline", function(){
    state.online = false;
    render();
  });

  var platformsSeedAttempted = false;

  var unsubTeamMembers = {};

  function startTeamMemberListeners(memberUid){
    if(unsubTeamMembers[memberUid]) return; // already listening
    var memberCars = [], memberLog = [];

    function recompute(){
      var activeCount = memberCars.filter(function(c){ return c.active !== false; }).length;
      var now = new Date();
      var startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      var daysSinceSat = (now.getDay() + 1) % 7;
      var startOfWeek = startOfDay - daysSinceSat * 86400000;
      var postsToday = memberLog.filter(function(l){ return l.timestamp >= startOfDay; }).length;
      var postsThisWeek = memberLog.filter(function(l){ return l.timestamp >= startOfWeek; }).length;
      state.teamStats[memberUid] = { activeCount: activeCount, totalCars: memberCars.length, postsToday: postsToday, postsThisWeek: postsThisWeek };
      state.teamStatsLoaded[memberUid] = true;
      render();
    }

    var unsubC = onSnapshot(collection(db, "accounts", memberUid, "cars"), function(snap){
      memberCars = snap.docs.map(function(d){ var data = d.data(); return { active: data.active !== false }; });
      recompute();
    }, function(err){ console.error("team member cars read error:", err); });

    var unsubL = onSnapshot(collection(db, "accounts", memberUid, "publishLog"), function(snap){
      memberLog = snap.docs.map(function(d){ var data = d.data(); return { timestamp: data.timestamp || 0 }; });
      recompute();
    }, function(err){ console.error("team member log read error:", err); });

    unsubTeamMembers[memberUid] = [unsubC, unsubL];
  }

  function stopTeamMemberListeners(){
    Object.keys(unsubTeamMembers).forEach(function(uid){
      unsubTeamMembers[uid].forEach(function(fn){ fn(); });
    });
    unsubTeamMembers = {};
  }

  function startListening(userId){
    carsCol = collection(db, "accounts", userId, "cars");
    logCol = collection(db, "accounts", userId, "publishLog");
    platformsCol = collection(db, "accounts", userId, "platforms");

    state.cars = []; state.platforms = []; state.log = [];
    state.carsLoaded = false; state.platformsLoaded = false; state.loading = true;
    platformsSeedAttempted = false;

    unsubCars = onSnapshot(carsCol, function(snap){
      state.cars = snap.docs.map(function(d){
        var data = d.data();
        return {
          id: d.id,
          name: data.name || "",
          adLink: data.adLink || "",
          notes: data.notes || "",
          priority: data.priority || "medium",
          createdAt: data.createdAt || 0,
          active: data.active !== false,
          lastPublished: data.lastPublished || {},
          totalPublishes: data.totalPublishes || 0,
          messages: data.messages || 0
        };
      });
      state.carsLoaded = true;
      state.loading = !(state.carsLoaded && state.platformsLoaded);
      render();
    }, function(err){
      console.error("Firestore cars sync error:", err);
      showConnectionError();
    });

    unsubPlatforms = onSnapshot(platformsCol, function(snap){
      if(snap.empty && !platformsSeedAttempted){
        platformsSeedAttempted = true;
        DEFAULT_PLATFORMS.forEach(function(p){
          setDoc(doc(db, "accounts", userId, "platforms", p.id), {
            label: p.label, emoji: p.emoji, bg: p.bg, order: p.order, active: true, createdAt: Date.now(), frequency: p.frequency || 1
          }).catch(function(err){ console.error("seed platform error:", err); });
        });
        return; // the setDoc calls will re-trigger this listener
      }
      state.platforms = snap.docs.map(function(d){
        var data = d.data();
        return {
          id: d.id,
          label: data.label || "",
          emoji: data.emoji || "📣",
          bg: data.bg || "rgba(232,25,44,.14)",
          order: typeof data.order === "number" ? data.order : 999,
          active: data.active !== false,
          frequency: (typeof data.frequency === "number" && data.frequency >= 1) ? Math.round(data.frequency) : 1
        };
      }).sort(function(a,b){ return a.order - b.order; });
      state.platformsLoaded = true;
      state.loading = !(state.carsLoaded && state.platformsLoaded);
      render();
    }, function(err){
      console.error("Firestore platforms sync error:", err);
      showConnectionError();
    });

    unsubLog = onSnapshot(logCol, function(snap){
      state.log = snap.docs.map(function(d){
        var data = d.data();
        return { id: d.id, carId: data.carId, carName: data.carName, platform: data.platform, timestamp: data.timestamp || 0 };
      }).sort(function(a,b){ return b.timestamp - a.timestamp; });
      render();
    }, function(err){
      console.error("Firestore log sync error:", err);
    });

    unsubAccount = onSnapshot(doc(db, "accounts", userId), function(snap){
      if(snap.exists()){
        var data = snap.data();
        state.accountStatus = data.subscriptionStatus || "pending";
        state.accountExpiresAt = data.subscriptionExpiresAt || null;
        var team = Array.isArray(data.team) ? data.team : [];
        state.accountTeam = team;
        team.forEach(function(member){ startTeamMemberListeners(member.uid); });
      }
      state.accountLoaded = true;
      render();
    }, function(err){
      console.error("Firestore account sync error:", err);
      state.accountLoaded = true;
      render();
    });

    if(isAdmin()){
      unsubAllAccounts = onSnapshot(collection(db, "accounts"), function(snap){
        state.allAccounts = snap.docs.map(function(d){
          var data = d.data();
          return {
            id: d.id,
            displayName: data.displayName || "",
            email: data.email || "",
            createdAt: data.createdAt || 0,
            subscriptionStatus: data.subscriptionStatus || "pending",
            subscriptionExpiresAt: data.subscriptionExpiresAt || null,
            orgOwnerId: data.orgOwnerId || null
          };
        }).sort(function(a,b){ return b.createdAt - a.createdAt; });
        state.allAccountsLoaded = true;
        render();
      }, function(err){
        console.error("Firestore all-accounts sync error:", err);
      });
    }
  }

  function stopListening(){
    if(unsubCars) unsubCars();
    if(unsubPlatforms) unsubPlatforms();
    if(unsubLog) unsubLog();
    if(unsubAccount) unsubAccount();
    if(unsubAllAccounts) unsubAllAccounts();
    stopTeamMemberListeners();
    unsubCars = unsubPlatforms = unsubLog = unsubAccount = unsubAllAccounts = null;
    state.accountLoaded = false; state.accountStatus = null; state.accountExpiresAt = null;
    state.allAccounts = []; state.allAccountsLoaded = false;
    state.accountTeam = []; state.teamStats = {}; state.teamStatsLoaded = {};
  }

  function showConnectionError(){
    var el = document.getElementById("app");
    if(el) el.innerHTML =
      '<div style="padding:60px 24px;text-align:center;max-width:420px;margin:0 auto">' +
      '<div class="logo" style="margin:0 auto 18px;background:#E8192C"><span>!</span></div>' +
      '<h2 style="color:#fff;font-size:18px;margin:0 0 10px">تعذّر الاتصال بقاعدة البيانات</h2>' +
      '<p style="color:#a9a9b0;font-size:13.5px;line-height:1.7">تأكد من صحة بيانات firebaseConfig ومن قواعد الأمان (Rules) في Firestore، ثم أعد تحميل الصفحة.</p>' +
      '</div>';
  }

  /* ---------------- account bootstrap + one-time legacy data import ---------------- */
  var ADMIN_EMAIL = "mahmoudabdelaalaboalsaoud@gmail.com";
  function isAdmin(){ return !!(currentUser && currentUser.email === ADMIN_EMAIL); }

  function ensureAccount(user){
    var accountRef = doc(db, "accounts", user.uid);
    getDoc(accountRef).then(function(snap){
      if(!snap.exists()){
        setDoc(accountRef, {
          displayName: user.displayName || "",
          email: user.email || "",
          photoURL: user.photoURL || "",
          createdAt: Date.now(),
          subscriptionStatus: user.email === ADMIN_EMAIL ? "active" : "pending",
          subscriptionExpiresAt: null
        });
        checkLegacyData(user.uid);
      } else {
        updateDoc(accountRef, {
          displayName: user.displayName || "",
          email: user.email || "",
          photoURL: user.photoURL || ""
        }).catch(function(){});
      }
    }).catch(function(err){ console.error("ensureAccount error:", err); });
  }

  function checkLegacyData(userId){
    getDocs(collection(db, "lam7_cars")).then(function(snap){
      if(!snap.empty){
        state.migrationAvailable = true;
        state.migrationUid = userId;
        render();
      }
    }).catch(function(){ /* old collection may not be readable — fine, just skip */ });
  }

  function runMigration(){
    if(!state.migrationUid || state.migrating) return;
    var userId = state.migrationUid;
    state.migrating = true;
    render();
    Promise.all([
      getDocs(collection(db, "lam7_cars")),
      getDocs(collection(db, "lam7_platforms")),
      getDocs(collection(db, "lam7_publish_log"))
    ]).then(function(results){
      var writes = [];
      results[0].docs.forEach(function(d){ writes.push(setDoc(doc(db,"accounts",userId,"cars",d.id), d.data())); });
      results[1].docs.forEach(function(d){ writes.push(setDoc(doc(db,"accounts",userId,"platforms",d.id), d.data())); });
      results[2].docs.forEach(function(d){ writes.push(setDoc(doc(db,"accounts",userId,"publishLog",d.id), d.data())); });
      return Promise.all(writes);
    }).then(function(){
      state.migrating = false;
      state.migrationAvailable = false;
      showToast("تم استيراد بياناتك القديمة بنجاح");
      render();
    }).catch(function(err){
      console.error("migration error:", err);
      state.migrating = false;
      showToast("فشل الاستيراد — تحقق من الاتصال");
      render();
    });
  }

  /* ---------------- auth state ---------------- */
  getRedirectResult(auth).catch(function(err){
    console.error("redirect signin error:", err);
    if(err && err.code === "auth/unauthorized-domain"){
      state.authError = "الدومين ده مش مسموح بيه في إعدادات Firebase. لازم تضيفه في Authentication → Settings → Authorized domains.";
    } else if(err && err.code) {
      state.authError = "حصل خطأ أثناء تسجيل الدخول (" + err.code + "). حاول تاني.";
    }
  });

  onAuthStateChanged(auth, function(user){
    state.authResolved = true;
    if(user){
      currentUser = user;
      ensureAccount(user);
      startListening(user.uid);
    } else {
      currentUser = null;
      stopListening();
      state.cars = []; state.platforms = []; state.log = [];
      state.loading = true;
    }
    render();
  });

  /* ---------------- helpers ---------------- */
  function globalLast(car){
    var vals = Object.keys(car.lastPublished).map(function(k){return car.lastPublished[k];}).filter(function(v){return v!==null && v!==undefined;});
    if(vals.length===0) return null;
    return Math.max.apply(null, vals);
  }
  function daysSince(ts){ if(ts===null||ts===undefined) return null; return Math.floor((Date.now()-ts)/86400000); }
  function isToday(ts){
    if(ts===null||ts===undefined) return false;
    var d = new Date(ts), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function formatRelative(ts){
    if(ts===null||ts===undefined) return "لم يُنشر بعد";
    var d = daysSince(ts);
    if(d===0){ var hrs = Math.floor((Date.now()-ts)/3600000); if(hrs<1) return "منذ لحظات"; return "منذ " + hrs + " " + (hrs===1?"ساعة":"ساعات"); }
    if(d===1) return "منذ يوم واحد";
    if(d===2) return "منذ يومين";
    if(d<11) return "منذ " + d + " أيام";
    return "منذ " + d + " يومًا";
  }
  function formatDateTime(ts){
    if(ts===null||ts===undefined) return "—";
    var d = new Date(ts);
    return d.toLocaleDateString("ar-EG", { day:"numeric", month:"short", year:"numeric" }) + " " + d.toLocaleTimeString("ar-EG", { hour:"2-digit", minute:"2-digit" });
  }
  function urgencyTier(days){
    if(days===null||days===undefined) return "urgent";
    if(days<=2) return "fresh";
    if(days<=5) return "ok";
    if(days<=9) return "warn";
    return "urgent";
  }
  var URGENCY = {
    fresh: { text:"#34d399", bg:"rgba(52,211,153,.12)" },
    ok:    { text:"#38bdf8", bg:"rgba(56,189,248,.12)" },
    warn:  { text:"#F5A623", bg:"rgba(245,166,35,.12)" },
    urgent:{ text:"#E8192C", bg:"rgba(232,25,44,.12)" }
  };
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- queue logic ---------------- */
  function activeCars(){ return state.cars.filter(function(c){ return c.active; }); }

  /**
   * Urgency = days waited * priority weight.
   * This is the fix for "same car keeps repeating": priority used to be an
   * absolute override, so a high-priority car could block others forever.
   * Now priority just accelerates how fast a car becomes urgent — every
   * active car eventually surfaces, guaranteed, while important cars still
   * come up more often on average.
   */
  function urgencyScore(car, platform){
    var ts = platform === "global" ? globalLast(car) : (car.lastPublished[platform] !== undefined ? car.lastPublished[platform] : null);
    var days = (ts === null || ts === undefined) ? 30 : (Date.now() - ts) / 86400000;
    var weight = (PRIORITY_META[car.priority] && PRIORITY_META[car.priority].urgencyWeight) || 1;
    return days * weight;
  }

  function cmpForPlatform(a, b, platform){
    var diff = urgencyScore(b, platform) - urgencyScore(a, platform);
    if(diff !== 0) return diff;
    return a.createdAt - b.createdAt;
  }

  function suggestionFor(platform){
    var list = activeCars().slice().sort(function(a,b){ return cmpForPlatform(a,b,platform); });
    return list.length ? list[0] : null;
  }

  /** top-N distinct cars for a platform, most urgent first — used when a channel publishes more than once a day */
  function suggestionsFor(platform, count){
    var n = Math.max(1, count || 1);
    var list = activeCars().slice().sort(function(a,b){ return cmpForPlatform(a,b,platform); });
    return list.slice(0, n);
  }

  function republishQueue(){
    return activeCars().slice().sort(function(a,b){ return cmpForPlatform(a,b,"global"); });
  }

  function computeStats(){
    var now = new Date();
    var startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var daysSinceSat = (now.getDay() + 1) % 7;
    var startOfWeek = startOfDay - daysSinceSat * 86400000;

    var postsToday = state.log.filter(function(l){ return l.timestamp >= startOfDay; }).length;
    var postsThisWeek = state.log.filter(function(l){ return l.timestamp >= startOfWeek; }).length;

    var mostPublished = null;
    state.cars.forEach(function(c){
      if(!mostPublished || c.totalPublishes > mostPublished.totalPublishes) mostPublished = c;
    });
    if(mostPublished && mostPublished.totalPublishes === 0) mostPublished = null;

    var staleCar = null, staleDays = -1;
    activeCars().forEach(function(c){
      var last = globalLast(c);
      var d = last===null ? Infinity : Math.floor((Date.now()-last)/86400000);
      if(d > staleDays){ staleDays = d; staleCar = c; }
    });

    return {
      activeCount: activeCars().length,
      postsToday: postsToday,
      postsThisWeek: postsThisWeek,
      mostPublished: mostPublished,
      staleCar: staleCar,
      staleDays: staleDays===Infinity ? null : staleDays
    };
  }

  function markPublished(carId, platform){
    var now = Date.now();
    var car = state.cars.find(function(c){ return c.id === carId; });
    if(!car) return;

    /* optimistic local update — reflect instantly, don't wait on the network */
    car.lastPublished = Object.assign({}, car.lastPublished);
    car.lastPublished[platform] = now;
    car.totalPublishes += 1;
    state.justPublished = platform + ":" + carId;
    render();
    setTimeout(function(){ state.justPublished = null; }, 500);

    var update = {};
    update["lastPublished." + platform] = now;
    update.totalPublishes = increment(1);

    updateDoc(doc(db, "accounts", currentUser.uid, "cars", carId), update).catch(function(err){
      console.error("markPublished error:", err);
      showToast("⚠️ لم يُحفظ على السيرفر — تحقق من الاتصال");
    });

    addDoc(logCol, { carId: carId, carName: car.name, platform: platform, timestamp: now }).catch(function(err){
      console.error("log write error:", err);
    });
  }

    var initial = currentUser && currentUser.displayName ? currentUser.displayName.trim().charAt(0) : (currentUser && currentUser.email ? currentUser.email.charAt(0) : "؟");

  function slotRow(platform, car, slotIndex, slotTotal){
    var meta = state.platforms.filter(function(p){return p.id===platform;})[0];
    if(!meta) return "";
    var slotTag = slotTotal > 1 ? ' <span class="today-slot-tag">' + slotIndex + '/' + slotTotal + '</span>' : '';

    if(!car){
      return '<div class="today-row today-row-empty">' +
        '<div class="today-icon" style="background:' + meta.bg + '">' + meta.emoji + '</div>' +
        '<div class="today-mid"><p class="today-plat">' + esc(meta.label) + slotTag + '</p><p class="today-empty-txt">لا توجد سيارات نشطة</p></div>' +
      '</div>';
    }

    var ts = car.lastPublished[platform];
    var days = daysSince(ts);
    var tier = urgencyTier(days);
    var u = URGENCY[tier];
    var justPub = state.justPublished === (platform + ":" + car.id);
    var doneToday = isToday(ts);

    return '<div class="today-row' + (justPub?' pop':'') + (doneToday?' today-row-done':'') + '">' +
      '<span class="today-row-bar" style="background:' + (doneToday ? '#34d399' : u.text) + '"></span>' +
      '<div class="today-icon" style="background:' + meta.bg + '">' + meta.emoji + '</div>' +
      '<div class="today-mid">' +
        '<p class="today-plat">' + esc(meta.label) + slotTag + (doneToday ? ' <span class="today-done-check">✓ تم اليوم</span>' : '') + '</p>' +
        '<p class="today-car">🚗 ' + esc(car.name) + '</p>' +
        '<p class="today-time" style="color:' + u.text + '">' + formatRelative(ts) + '</p>' +
      '</div>' +
      '<div class="today-right">' +
        (car.adLink ? '<a class="today-link-btn" href="' + esc(car.adLink) + '" target="_blank" rel="noreferrer">' + ICONS.link.replace('viewBox','style="width:14px;height:14px" viewBox') + '</a>' : '') +
        '<button class="today-btn' + (doneToday?' today-btn-done':'') + '" data-action="publish" data-car="' + car.id + '" data-platform="' + platform + '">' + ICONS.check.replace('viewBox','style="width:16px;height:16px" viewBox') + '</button>' +
      '</div>' +
    '</div>';
  }

  function screenToday(){
    var activePlatforms = state.platforms.filter(function(p){ return p.active; });
    var body;
    if(activePlatforms.length === 0){
      body = '<div class="empty-state"><div class="box">' + ICONS.send.replace('viewBox','style="width:24px;height:24px;color:#6c6c74" viewBox') + '</div>' +
        '<p class="t1">لا توجد قنوات نشر مفعّلة</p><p class="t2">أضف قناة من تبويب "القنوات"</p></div>';
    } else {
      var tasks = [];
      activePlatforms.forEach(function(p){
        var freq = p.frequency || 1;
        var cars = suggestionsFor(p.id, freq);
        if(cars.length === 0){
          tasks.push({ platform:p.id, car:null, slotIndex:1, slotTotal:freq, doneToday:false, urgency:-1 });
        } else {
          cars.forEach(function(car, i){
            var doneToday = isToday(car.lastPublished[p.id]);
            tasks.push({ platform:p.id, car:car, slotIndex:i+1, slotTotal:freq, doneToday:doneToday, urgency:urgencyScore(car, p.id) });
          });
        }
      });

      var doneCount = tasks.filter(function(t){ return t.doneToday; }).length;
      var total = tasks.length;
      var pct = total ? Math.round((doneCount/total)*100) : 0;
      var allDone = total > 0 && doneCount === total;

      /* pending tasks first (most urgent first among them), completed ones after */
      var ordered = tasks.slice().sort(function(a,b){
        if(a.doneToday !== b.doneToday) return a.doneToday ? 1 : -1;
        return b.urgency - a.urgency;
      });

      var progressCard =
        '<div class="progress-card' + (allDone?' all-done':'') + '">' +
          '<div class="progress-head">' +
            '<p class="progress-title">' + (allDone ? '🎉 خلّصت خطة اليوم بالكامل' : 'خطة اليوم') + '</p>' +
            '<span class="progress-count">' + doneCount + ' / ' + total + '</span>' +
          '</div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<p class="progress-sub">' + (allDone ? 'كل القنوات اتنشرت اليوم — تقدر تنشر تاني أي وقت' : (total - doneCount) + ' مهمة نشر متبقية النهارده' ) + '</p>' +
        '</div>';

      body = progressCard + alertsPanel() + '<div class="today-list">' + ordered.map(function(t){ return slotRow(t.platform, t.car, t.slotIndex, t.slotTotal); }).join("") + '</div>';
    }
    return topbar("مهام اليوم", "خطة نشر اليوم لكل قناة") + '<div class="content">' + body + '</div>';
  }

  /* ---------------- alerts ---------------- */
  var ALERT_OVERDUE_DAYS = 7;

  function computeAlerts(){
    var alerts = [];
    var cars = activeCars();
    var plats = state.platforms.filter(function(p){ return p.active; });
    cars.forEach(function(car){
      plats.forEach(function(p){
        var ts = car.lastPublished[p.id];
        if(ts === undefined || ts === null){
          alerts.push({ level:"warn", text: 'لسه ما نشرتش "' + car.name + '" في ' + p.label, sortDays: 9999 });
        } else {
          var days = daysSince(ts);
          if(days !== null && days >= ALERT_OVERDUE_DAYS){
            alerts.push({ level:"urgent", text: 'لم تُنشر "' + car.name + '" في ' + p.label + ' منذ ' + days + ' يوم', sortDays: days });
          }
        }
      });
    });
    alerts.sort(function(a,b){
      if(a.level !== b.level) return a.level === "urgent" ? -1 : 1;
      return b.sortDays - a.sortDays;
    });
    return alerts;
  }

  function alertsPanel(){
    var alerts = computeAlerts();
    if(alerts.length === 0) return "";
    var showAll = state.showAllAlerts;
    var visible = showAll ? alerts : alerts.slice(0, 3);
    var items = visible.map(function(a){
      var dotColor = a.level === "urgent" ? "#E8192C" : "#F5A623";
      return '<div class="alert-item"><span class="alert-dot" style="background:' + dotColor + '"></span><span class="alert-text">' + esc(a.text) + '</span></div>';
    }).join("");
    var toggle = alerts.length > 3 ?
      '<button class="alerts-toggle" data-action="toggle-alerts">' + (showAll ? "إخفاء" : "عرض الكل (" + alerts.length + ")") + '</button>' : "";
    return '<div class="alerts-panel">' +
      '<div class="alerts-head"><span>🔔 تنبيهات</span>' + toggle + '</div>' +
      items +
    '</div>';
  }

  /* ---------------- management screen ---------------- */

  state.mgmtSearchFocused = false;
  state.editingId = null;
  var editDraft = { name:"", adLink:"", notes:"", priority:"medium" };

  function filteredMgmtCars(){
    var q = state.mgmtSearch.trim().toLowerCase();
    return state.cars.filter(function(c){
      if(state.mgmtFilter === "active" && !c.active) return false;
      if(state.mgmtFilter === "inactive" && c.active) return false;
      if(q && c.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function(a,b){
      if(a.active !== b.active) return a.active ? -1 : 1;
      var pw = PRIORITY_META[b.priority].weight - PRIORITY_META[a.priority].weight;
      if(pw !== 0) return pw;
      return a.name.localeCompare(b.name, "ar");
    });
  }

  function mgmtChip(value, label){
    var active = state.mgmtFilter === value;
    return '<button class="chip' + (active?' active':'') + '" data-action="mgmt-filter" data-value="' + value + '">' + label + '</button>';
  }

  function completionPct(car){
    var activePlats = state.platforms.filter(function(p){ return p.active; });
    if(activePlats.length === 0) return 0;
    var published = activePlats.filter(function(p){
      var v = car.lastPublished[p.id];
      return v !== undefined && v !== null;
    }).length;
    return Math.round((published / activePlats.length) * 100);
  }

  function publishCountsForCar(carId){
    var counts = {};
    state.log.forEach(function(l){
      if(l.carId === carId) counts[l.platform] = (counts[l.platform] || 0) + 1;
    });
    return counts;
  }

  function mgmtItem(car){
    if(state.editingId === car.id) return mgmtEditForm(car);

    var prio = PRIORITY_META[car.priority];
    var last = globalLast(car);
    var isConfirm = state.confirmDeleteId === car.id;
    var pct = completionPct(car);
    var counts = publishCountsForCar(car.id);
    var msgCount = car.messages || 0;

    var platChips = state.platforms.map(function(p){
      var d = daysSince(car.lastPublished[p.id]);
      var label = d === null ? "—" : (d + "ي");
      return '<span class="mgmt-plat-chip">' + p.emoji + ' ' + label + '</span>';
    }).join("");

    var countChips = state.platforms.map(function(p){
      var c = counts[p.id] || 0;
      return '<span class="mgmt-plat-chip mgmt-count-chip">' + p.emoji + ' ×' + c + '</span>';
    }).join("");

    return '<div class="card mgmt-item">' +
      '<div class="mgmt-item-body">' +
        '<div class="mgmt-item-head">' +
          '<p class="mgmt-name">🚗 ' + esc(car.name) + '</p>' +
          '<div class="mgmt-badges">' +
            '<span class="prio-badge" style="' + prio.chip + '">' + prio.label + '</span>' +
            (car.active ? '<span class="status-badge active">نشطة</span>' : '<span class="status-badge inactive">موقوفة</span>') +
          '</div>' +
        '</div>' +
        (car.notes ? '<p class="car-notes">' + ICONS.note.replace('viewBox','style="width:14px;height:14px;flex-shrink:0;margin-top:2px;color:#6c6c74" viewBox') + '<span>' + esc(car.notes) + '</span></p>' : '') +
        '<div class="mini-progress-wrap">' +
          '<div class="mini-progress-label"><span>نسبة إنجاز الحملة</span><span>' + pct + '%</span></div>' +
          '<div class="mini-progress-track"><div class="mini-progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>' +
        '<div class="mgmt-meta-row">' +
          '<span>إجمالي النشر: <b>' + car.totalPublishes + '</b></span>' +
          '<span>آخر نشر: ' + formatRelative(last) + '</span>' +
        '</div>' +
        '<p class="mgmt-section-label">آخر نشر لكل قناة</p>' +
        '<div class="mgmt-plat-row">' + platChips + '</div>' +
        '<p class="mgmt-section-label">عدد مرات النشر لكل قناة</p>' +
        '<div class="mgmt-plat-row">' + countChips + '</div>' +
        '<div class="mgmt-msg-row">' +
          '<span class="mgmt-msg-label">📩 عدد الرسائل/المكالمات</span>' +
          '<div class="chan-freq">' +
            '<button class="chan-freq-btn" data-action="dec-messages" data-car="' + car.id + '"' + (msgCount<=0?' disabled':'') + '>−</button>' +
            '<span class="chan-freq-val">' + msgCount + '</span>' +
            '<button class="chan-freq-btn" data-action="inc-messages" data-car="' + car.id + '">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="mgmt-actions">' +
          '<button class="mgmt-btn" data-action="edit-car" data-car="' + car.id + '">' + ICONS.edit + ' تعديل</button>' +
          '<button class="mgmt-btn" data-action="toggle-active" data-car="' + car.id + '">' + (car.active ? ICONS.pause + ' إيقاف' : ICONS.play + ' تفعيل') + '</button>' +
          (isConfirm ?
            '<button class="mgmt-btn danger-confirm" data-action="mgmt-confirm-delete" data-car="' + car.id + '">تأكيد الحذف</button>' :
            '<button class="mgmt-btn danger" data-action="mgmt-ask-delete" data-car="' + car.id + '">' + ICONS.trash + ' حذف</button>'
          ) +
        '</div>' +
      '</div>' +
    '</div>';
  }

    var body;
    if(state.cars.length === 0){
      body = '<div class="empty-state"><div class="box">' + ICONS.cars.replace('viewBox','style="width:24px;height:24px;color:#6c6c74" viewBox') + '</div>' +

  }

        '<div class="field"><label>رابط الإعلان</label><input class="input" id="f-link" dir="ltr" style="text-align:left" placeholder="https://..." value="' + esc(formDraft.adLink) + '" /></div>' +
        '<div class="field"><label>ملاحظات</label><textarea class="input" id="f-notes" rows="3" placeholder="أي تفاصيل تساعد عند النشر...">' + esc(formDraft.notes) + '</textarea></div>' +
        '<div class="field"><label>الأولوية</label><div class="prio-grid">' + prioOpts + '</div></div>' +

  function screenStats(){
    var s = computeStats();
    var grid =
      '<div class="stat-grid">' +
        statCard(ICONS.layers, "#38bdf8", "rgba(56,189,248,.1)", s.activeCount, "سيارات نشطة") +
        statCard(ICONS.send, "#34d399", "rgba(52,211,153,.1)", s.postsToday, "منشورات اليوم") +
        statCard(ICONS.calendar, "#F5A623", "rgba(245,166,35,.1)", s.postsThisWeek, "منشورات الأسبوع") +
        statCard(ICONS.trophy, "#E8192C", "rgba(232,25,44,.1)", s.mostPublished ? s.mostPublished.totalPublishes : "—", "الأكثر نشرًا") +
      '</div>';

      highlights += hlCard(ICONS.trophy, "#F5A623", "أكثر سيارة تم نشرها", s.mostPublished.name, "نُشرت " + s.mostPublished.totalPublishes + " " + (s.mostPublished.totalPublishes===1?"مرة":"مرات"));

  function statCard(icon, color, bg, value, label){

      '<p class="hl-detail">' + esc(detail) + '</p></div>' +
    '</div>';

  /* ---------------- admin panel (super-admin only) ---------------- */
  function accountStatusMeta(acc){
    var isExpired = acc.subscriptionStatus === "active" && acc.subscriptionExpiresAt && Date.now() >= acc.subscriptionExpiresAt;
    if(isExpired) return { label:"منتهي", color:"#F5A623", bg:"rgba(245,166,35,.15)" };
    if(acc.subscriptionStatus === "active") return { label:"نشط", color:"#34d399", bg:"rgba(52,211,153,.15)" };
    if(acc.subscriptionStatus === "pending") return { label:"قيد المراجعة", color:"#F5A623", bg:"rgba(245,166,35,.15)" };
    return { label:"موقوف", color:"#E8192C", bg:"rgba(232,25,44,.15)" };
  }

  function adminAccountItem(acc){
    var meta = accountStatusMeta(acc);
    var expiryTxt = acc.subscriptionExpiresAt ? formatDateTime(acc.subscriptionExpiresAt) : "—";
    var ownerAcc = acc.orgOwnerId ? state.allAccounts.find(function(a){ return a.id === acc.orgOwnerId; }) : null;
    var ownerTxt = ownerAcc ? (ownerAcc.displayName || ownerAcc.email) : (acc.orgOwnerId ? "معرض غير معروف" : "بدون معرض");
    return '<div class="chan-item admin-acc-item">' +
      '<div class="chan-emoji" style="background:' + meta.bg + ';color:' + meta.color + '">👤</div>' +
      '<div class="chan-mid">' +
        '<p class="chan-name">' + esc(acc.displayName || acc.email || "بدون اسم") + '</p>' +
        '<p class="chan-sub" style="color:' + meta.color + '">' + meta.label + ' · ' + esc(acc.email) + '</p>' +
        '<p class="admin-acc-expiry">تاريخ الانتهاء: ' + expiryTxt + '</p>' +
        '<p class="admin-acc-expiry">صاحب المعرض: ' + esc(ownerTxt) + '</p>' +
        '<div class="admin-link-row">' +

        '</div>' +
      '</div>' +
      '<div class="chan-actions admin-acc-actions">' +

      { id:"manage", label:"السيارات", icon:ICONS.cars },
      { id:"channels", label:"القنوات", icon:ICONS.broadcast },
      { id:"republish", label:"إعادة النشر", icon:ICONS.republish },
      { id:"add", label:"إضافة", icon:ICONS.add },
      { id:"stats", label:"الإحصائيات", icon:ICONS.stats }
    ];
    if(state.accountTeam && state.accountTeam.length > 0) tabs.push({ id:"team", label:"الفريق", icon:ICONS.team });
    if(isAdmin()) tabs.push({ id:"admin", label:"الإدارة", icon:ICONS.admin });
    return tabs;
  }

  function bottomNav(){
    var tabs = getTabs();
    return '<div class="bottomnav"><div class="bottomnav-inner" style="grid-template-columns:repeat(' + tabs.length + ',1fr)">' +
      tabs.map(function(t){
        var active = state.tab === t.id;
        return '<button class="navbtn' + (active?' active':'') + '" data-action="switch-tab" data-value="' + t.id + '">' +
          (active ? '<span class="bar"></span>' : '') + t.icon + '<span>' + t.label + '</span></button>';
      }).join("") +
    '</div></div>';
  }

  function toast(){
    if(!state.toast) return '';
    return '<div class="toast-wrap"><div class="toast">' + ICONS.check.replace('viewBox','style="width:16px;height:16px;color:#34d399" viewBox') + '<span>' + esc(state.toast) + '</span></div></div>';
  }

  function statusBanner(){
    if(state.syncFlash){
      return '<div class="status-banner online">' + ICONS.check.replace('viewBox','style="width:13px;height:13px" viewBox') + ' تم الاتصال — جارٍ مزامنة أي تغييرات محفوظة</div>';
    }
    if(!state.online){
      return '<div class="status-banner offline"><span class="offline-dot"></span> غير متصل — التعديلات هتتحفظ محليًا وتتزامن أول ما النت يرجع</div>';
    }
    return '';
  }

  function renderLoginScreen(){
    return '<div class="login-wrap">' +
      '<div class="logo login-logo"><span>L7</span></div>' +
      '<h1 class="login-title">LAM7 Publishing System</h1>' +
      '<p class="login-sub">نظام تنظيم نشر إعلانات السيارات — سجّل دخولك عشان تبدأ تستخدم حسابك الخاص.</p>' +
      '<button class="google-btn" data-action="google-signin">' +
        '<svg viewBox="0 0 48 48" width="19" height="19"><path fill="#FFC107" d="M43.6 20.5H42V20.4H24v7.2h11.3c-1.6 4.6-6 7.9-11.3 7.9-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.1-5.1C33.6 6.1 29 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 5.9 4.3C13.8 15.6 18.5 12.4 24 12.4c3.1 0 5.9 1.2 8 3.1l5.1-5.1C33.6 6.1 29 4 24 4 16 4 9.1 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5 0 9.5-1.9 12.9-5.1l-6-5c-1.9 1.3-4.4 2.1-6.9 2.1-5.2 0-9.6-3.3-11.3-7.9l-5.9 4.6C9 39.4 15.9 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20.4H24v7.2h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6 5C40.5 35 44 30 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>' +
        'تسجيل الدخول بحساب جوجل' +
      '</button>' +
      (state.authError ? '<p class="login-error">' + esc(state.authError) + '</p>' : '') +
    '</div>';
  }

  function renderAccessGateScreen(){
    var status = state.accountStatus;
    var isExpired = status === "active" && state.accountExpiresAt && Date.now() >= state.accountExpiresAt;
    var title, msg, iconBg, iconTxt;
    if(status === "pending"){
      title = "حسابك قيد المراجعة";
      msg = "لسه محتاج تفعيل من الإدارة عشان تقدر تستخدم النظام. تواصل مع فريق لمح لتفعيل اشتراكك.";
      iconBg = "var(--gold)"; iconTxt = "⏳";
    } else if(isExpired){
      title = "انتهى اشتراكك";
      msg = "اشتراكك الشهري خلص. تواصل مع الإدارة لتجديده والاستمرار في استخدام النظام.";
      iconBg = "var(--red)"; iconTxt = "🔒";
    } else {
      title = "الحساب موقوف";
      msg = "تم إيقاف الوصول لحسابك. تواصل مع الإدارة لمزيد من التفاصيل.";
      iconBg = "var(--red)"; iconTxt = "🔒";
    }
    return '<div class="login-wrap">' +
      '<div class="logo login-logo" style="background:' + iconBg + '"><span>' + iconTxt + '</span></div>' +
      '<h1 class="login-title">' + title + '</h1>' +
      '<p class="login-sub">' + msg + '</p>' +
      '<button class="mgmt-btn" data-action="sign-out" style="margin-top:6px;flex:none;padding:12px 24px">تسجيل الخروج</button>' +
    '</div>';
  }

  function migrationBanner(){
    if(!state.migrationAvailable) return '';
    return '<div class="migration-banner">' +
      '<p class="migration-text">' + (state.migrating ? 'جارٍ استيراد بياناتك القديمة...' : 'لقينا بيانات قديمة من قبل تسجيل الدخول — تحب تستوردها لحسابك؟') + '</p>' +
      (state.migrating ? '' :
        '<div class="migration-actions">' +
          '<button class="mgmt-btn" data-action="dismiss-migration">تجاهل</button>' +
          '<button class="mgmt-btn primary" data-action="run-migration">استيراد الآن</button>' +
        '</div>'
      ) +
    '</div>';
  }

  /* ---------------- render ---------------- */
  function render(){
    if(!state.authResolved){
      document.getElementById("app").innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh">' +
        '<div class="logo" style="animation:pop 1s ease-in-out infinite"><span>L7</span></div>' +
        '</div>';
      return;
    }
    if(!currentUser){
      document.getElementById("app").innerHTML = renderLoginScreen();
      return;
    }
    if(!state.accountLoaded){
      document.getElementById("app").innerHTML =
        '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh">' +
        '<div class="logo" style="animation:pop 1s ease-in-out infinite"><span>L7</span></div>' +
        '</div>';
      return;
    }
    if(!isAdmin()){
      var isActiveAccount = state.accountStatus === "active" && (!state.accountExpiresAt || Date.now() < state.accountExpiresAt);
      if(!isActiveAccount){
        document.getElementById("app").innerHTML = renderAccessGateScreen();
        return;
      }
    }
    if(state.loading){
      var loadingMsg = state.online
        ? "جارٍ الاتصال بقاعدة البيانات..."
        : "غير متصل بالإنترنت، وما فيش بيانات محفوظة على الجهاز ده بعد. لازم اتصال بالنت مرة واحدة على الأقل لتحميل بياناتك.";
      document.getElementById("app").innerHTML =
        '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;padding:0 24px;text-align:center">' +
        '<div class="logo" style="animation:pop 1s ease-in-out infinite"><span>L7</span></div>' +
        '<p style="color:#8a8a92;font-size:13px;font-weight:700;line-height:1.7">' + loadingMsg + '</p>' +
        '</div>';
      return;
    }
    var html = statusBanner() + migrationBanner();
    if(state.tab === "today") html += screenToday();
    else if(state.tab === "manage") html += screenManage();
    else if(state.tab === "channels") html += screenChannels();
    else if(state.tab === "republish") html += screenRepublish();
    else if(state.tab === "add") html += screenAdd();
    else if(state.tab === "stats") html += screenStats();
    else if(state.tab === "team") html += screenTeam();
    else if(state.tab === "admin") html += (isAdmin() ? screenAdmin() : screenToday());
    html += bottomNav() + toast();
    document.getElementById("app").innerHTML = html;

    if(state.tab === "add"){
      var nameEl = document.getElementById("f-name");
      var linkEl = document.getElementById("f-link");
      var notesEl = document.getElementById("f-notes");
      if(nameEl) nameEl.oninput = function(e){ formDraft.name = e.target.value; syncSubmitState(); };
      if(linkEl) linkEl.oninput = function(e){ formDraft.adLink = e.target.value; };
      if(notesEl) notesEl.oninput = function(e){ formDraft.notes = e.target.value; };
    }

    if(state.tab === "manage"){
      var searchEl = document.getElementById("mgmt-search");
      if(searchEl){
        searchEl.oninput = function(e){ state.mgmtSearch = e.target.value; render(); };
        searchEl.onfocus = function(){ state.mgmtSearchFocused = true; };
        searchEl.onblur = function(){ state.mgmtSearchFocused = false; };
        if(state.mgmtSearchFocused){
          searchEl.focus();
          var v = searchEl.value; searchEl.value = ""; searchEl.value = v;
        }
      }
    }

    if(state.tab === "channels"){
      var neEl = document.getElementById("new-chan-emoji");
      var nlEl = document.getElementById("new-chan-label");
      if(neEl) neEl.oninput = function(e){ newChannelDraft.emoji = e.target.value; };
      if(nlEl) nlEl.oninput = function(e){ newChannelDraft.label = e.target.value; syncChannelSubmitState(); };
      var ceEl = document.getElementById("ce-emoji");
      var clEl = document.getElementById("ce-label");
      if(ceEl) ceEl.oninput = function(e){ channelEditDraft.emoji = e.target.value; };
      if(clEl) clEl.oninput = function(e){ channelEditDraft.label = e.target.value; };
    }
  }

  function syncSubmitState(){
    var btn = document.querySelector('[data-action="submit-car"]');
    if(btn) btn.disabled = formDraft.name.trim().length === 0;
  }

  function syncChannelSubmitState(){
    var btn = document.querySelector('[data-action="submit-channel"]');
    if(btn) btn.disabled = newChannelDraft.label.trim().length === 0;
  }

  /* ---------------- event delegation ---------------- */
  document.getElementById("app").addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "switch-tab"){
      state.tab = el.getAttribute("data-value");
      state.confirmDeleteId = null;
      state.editingId = null;
      state.editingChannelId = null;
      render();
    } else if(action === "publish"){
      markPublished(el.getAttribute("data-car"), el.getAttribute("data-platform"));
    } else if(action === "ask-delete"){
      state.confirmDeleteId = el.getAttribute("data-car");
      render();
    } else if(action === "confirm-delete"){
      removeCar(el.getAttribute("data-car"));
    } else if(action === "set-priority"){
      formDraft.priority = el.getAttribute("data-value");
      render();
    } else if(action === "submit-car"){
      if(formDraft.name.trim().length === 0) return;
      addCar(formDraft.name, formDraft.adLink, formDraft.notes, formDraft.priority);
      formDraft = { name:"", adLink:"", notes:"", priority:"medium" };
    } else if(action === "mgmt-filter"){
      state.mgmtFilter = el.getAttribute("data-value");
      render();
    } else if(action === "edit-car"){
      var carToEdit = state.cars.find(function(c){ return c.id === el.getAttribute("data-car"); });
      if(!carToEdit) return;
      editDraft = { name: carToEdit.name, adLink: carToEdit.adLink, notes: carToEdit.notes, priority: carToEdit.priority };
      state.editingId = carToEdit.id;
      render();
    } else if(action === "cancel-edit"){
      state.editingId = null;
      render();
    } else if(action === "set-edit-priority"){
      var nEl = document.getElementById("e-name");
      var lEl = document.getElementById("e-link");
      var noEl = document.getElementById("e-notes");
      if(nEl) editDraft.name = nEl.value;
      if(lEl) editDraft.adLink = lEl.value;
      if(noEl) editDraft.notes = noEl.value;
      editDraft.priority = el.getAttribute("data-value");
      render();
    } else if(action === "save-edit"){
      var editId = el.getAttribute("data-car");
      var nameEl2 = document.getElementById("e-name");
      var linkEl2 = document.getElementById("e-link");
      var notesEl2 = document.getElementById("e-notes");
      var newName = nameEl2 ? nameEl2.value.trim() : "";
      if(!newName){ showToast("اسم السيارة مطلوب"); return; }
      state.editingId = null;
      updateDoc(doc(db, "accounts", currentUser.uid, "cars", editId), {
        name: newName,
        adLink: linkEl2 ? linkEl2.value.trim() : "",
        notes: notesEl2 ? notesEl2.value.trim() : "",
        priority: editDraft.priority
      }).then(function(){
        showToast("تم حفظ التعديلات");
      }).catch(function(err){
        console.error("save-edit error:", err);
        showToast("فشل الحفظ — تحقق من الاتصال");
      });
      render();
    } else if(action === "toggle-active"){
      var toggleId = el.getAttribute("data-car");
      var toggleCar = state.cars.find(function(c){ return c.id === toggleId; });
      if(!toggleCar) return;
      updateDoc(doc(db, "accounts", currentUser.uid, "cars", toggleId), { active: !toggleCar.active }).catch(function(err){
        console.error("toggle-active error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "mgmt-ask-delete"){
      state.confirmDeleteId = el.getAttribute("data-car");
      render();
    } else if(action === "mgmt-confirm-delete"){
      removeCar(el.getAttribute("data-car"));
    } else if(action === "submit-channel"){
      var newLabel = newChannelDraft.label.trim();
      if(!newLabel) return;
      var newEmoji = (newChannelDraft.emoji || "📣").trim() || "📣";
      var maxOrder = state.platforms.reduce(function(m,p){ return Math.max(m, p.order); }, -1);
      addDoc(platformsCol, {
        label: newLabel, emoji: newEmoji, bg: "rgba(232,25,44,.14)",
        order: maxOrder + 1, active: true, createdAt: Date.now(), frequency: 1
      }).then(function(){
        showToast("تمت إضافة القناة");
      }).catch(function(err){
        console.error("submit-channel error:", err);
        showToast("فشلت الإضافة — تحقق من الاتصال");
      });
      newChannelDraft = { emoji:"📣", label:"" };
      render();
    } else if(action === "edit-channel"){
      var chanToEdit = state.platforms.find(function(p){ return p.id === el.getAttribute("data-channel"); });
      if(!chanToEdit) return;
      channelEditDraft = { emoji: chanToEdit.emoji, label: chanToEdit.label };
      state.editingChannelId = chanToEdit.id;
      render();
    } else if(action === "cancel-channel-edit"){
      state.editingChannelId = null;
      render();
    } else if(action === "save-channel-edit"){
      var chanId = el.getAttribute("data-channel");
      var ceEl2 = document.getElementById("ce-emoji");
      var clEl2 = document.getElementById("ce-label");
      var newChanLabel = clEl2 ? clEl2.value.trim() : "";
      if(!newChanLabel){ showToast("اسم القناة مطلوب"); return; }
      state.editingChannelId = null;
      updateDoc(doc(db, "accounts", currentUser.uid, "platforms", chanId), {
        label: newChanLabel,
        emoji: (ceEl2 ? ceEl2.value.trim() : "") || "📣"
      }).then(function(){
        showToast("تم حفظ القناة");
      }).catch(function(err){
        console.error("save-channel-edit error:", err);
        showToast("فشل الحفظ — تحقق من الاتصال");
      });
      render();
    } else if(action === "toggle-channel-active"){
      var toggleChanId = el.getAttribute("data-channel");
      var toggleChan = state.platforms.find(function(p){ return p.id === toggleChanId; });
      if(!toggleChan) return;
      updateDoc(doc(db, "accounts", currentUser.uid, "platforms", toggleChanId), { active: !toggleChan.active }).catch(function(err){
        console.error("toggle-channel-active error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "inc-frequency" || action === "dec-frequency"){
      var freqChanId = el.getAttribute("data-channel");
      var freqChan = state.platforms.find(function(p){ return p.id === freqChanId; });
      if(!freqChan) return;
      var newFreq = (freqChan.frequency || 1) + (action === "inc-frequency" ? 1 : -1);
      newFreq = Math.max(1, Math.min(9, newFreq));
      freqChan.frequency = newFreq; // optimistic
      render();
      updateDoc(doc(db, "accounts", currentUser.uid, "platforms", freqChanId), { frequency: newFreq }).catch(function(err){
        console.error("frequency update error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "inc-messages" || action === "dec-messages"){
      var msgCarId = el.getAttribute("data-car");
      var msgCar = state.cars.find(function(c){ return c.id === msgCarId; });
      if(!msgCar) return;
      var newMsgCount = (msgCar.messages || 0) + (action === "inc-messages" ? 1 : -1);
      newMsgCount = Math.max(0, newMsgCount);
      msgCar.messages = newMsgCount; // optimistic
      render();
      updateDoc(doc(db, "accounts", currentUser.uid, "cars", msgCarId), { messages: newMsgCount }).catch(function(err){
        console.error("messages update error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "chan-ask-delete"){
      state.confirmDeleteId = "chan:" + el.getAttribute("data-channel");
      render();
    } else if(action === "chan-confirm-delete"){
      var delChanId = el.getAttribute("data-channel");
      state.confirmDeleteId = null;
      deleteDoc(doc(db, "accounts", currentUser.uid, "platforms", delChanId)).catch(function(err){
        console.error("chan-confirm-delete error:", err);
        showToast("فشل الحذف — تحقق من الاتصال");
      });
      render();
    } else if(action === "google-signin"){
      state.authError = null;
      signInWithRedirect(auth, googleProvider);
    } else if(action === "toggle-account-menu"){
      state.showAccountMenu = !state.showAccountMenu;
      render();
    } else if(action === "sign-out"){
      state.showAccountMenu = false;
      signOut(auth).catch(function(err){ console.error("signout error:", err); });
    } else if(action === "run-migration"){
      runMigration();
    } else if(action === "dismiss-migration"){
      state.migrationAvailable = false;
      render();
    } else if(action === "toggle-alerts"){
      state.showAllAlerts = !state.showAllAlerts;
      render();
    } else if(action === "admin-approve" || action === "admin-extend"){
      var targetUid = el.getAttribute("data-uid");
      var targetAcc = state.allAccounts.find(function(a){ return a.id === targetUid; });
      if(!targetAcc) return;
      var base = (action === "admin-extend" && targetAcc.subscriptionExpiresAt && targetAcc.subscriptionExpiresAt > Date.now())
        ? targetAcc.subscriptionExpiresAt
        : Date.now();
      var newExpiry = base + 30 * 86400000;
      updateDoc(doc(db, "accounts", targetUid), { subscriptionStatus: "active", subscriptionExpiresAt: newExpiry }).then(function(){
        showToast("تم التفعيل حتى " + formatDateTime(newExpiry));
      }).catch(function(err){
        console.error("admin approve/extend error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "admin-deactivate"){
      var deactivateUid = el.getAttribute("data-uid");
      updateDoc(doc(db, "accounts", deactivateUid), { subscriptionStatus: "inactive" }).then(function(){
        showToast("تم إيقاف الحساب");
      }).catch(function(err){
        console.error("admin deactivate error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "admin-link-owner"){
      var marketerUid = el.getAttribute("data-uid");
      var inputEl = document.getElementById("link-input-" + marketerUid);
      var ownerEmail = inputEl ? inputEl.value.trim().toLowerCase() : "";
      if(!ownerEmail){ showToast("اكتب إيميل صاحب المعرض الأول"); return; }
      var ownerAccount = state.allAccounts.find(function(a){ return a.email.toLowerCase() === ownerEmail; });
      if(!ownerAccount){ showToast("مفيش حساب بالإيميل ده"); return; }
      var marketerAccount = state.allAccounts.find(function(a){ return a.id === marketerUid; });
      if(!marketerAccount){ return; }
      updateDoc(doc(db, "accounts", marketerUid), { orgOwnerId: ownerAccount.id }).catch(function(err){
        console.error("link marketer error:", err);
        showToast("فشل الربط — تحقق من الاتصال");
      });
      updateDoc(doc(db, "accounts", ownerAccount.id), {
        team: arrayUnion({ uid: marketerUid, displayName: marketerAccount.displayName || "", email: marketerAccount.email || "" })
      }).then(function(){
        showToast("تم الربط بصاحب المعرض");
      }).catch(function(err){
        console.error("update owner team error:", err);
        showToast("فشل تحديث فريق صاحب المعرض — تحقق من الاتصال");
      });
    }
  });

  render();
})();
</script>
</body>
</html>
