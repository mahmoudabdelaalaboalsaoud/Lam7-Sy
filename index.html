      var linkEl = document.getElementById("f-link");
      var notesEl = document.getElementById("f-notes");
      if(nameEl) nameEl.oninput = function(e){ formDraft.name = e.target.value; syncSubmitState(); };
      if(linkEl) linkEl.oninput = function(e){ formDraft.adLink = e.target.value; };
      if(notesEl) notesEl.oninput = function(e){ formDraft.notes = e.target.value; };
      effectiveChannels().filter(function(p){ return p.active; }).forEach(function(p){
        var cEl = document.getElementById("cf-camp-" + p.id);
        if(cEl) cEl.oninput = function(e){ formDraft.campaign[p.id] = e.target.value; };
      });
    }

    if(state.tab === "manage"){
      var searchEl = document.getElementById("mgmt-search");
      if(searchEl){
        searchEl.oninput = function(e){ state.mgmtSearch = e.target.value; render(); };
        searchEl.onfocus = function(){ state.mgmtSearchFocused = true; };
        searchEl.onblur = function(){ state.mgmtSearchFocused = false; };
        if(state.mgmtSearchFocused){
          searchEl.focus();
          var v = searchEl.value; searchEl.value = ""; searchEl.value = v;
        }
      }
    }

    if(state.tab === "channels"){
      var neEl = document.getElementById("new-chan-emoji");
      var nlEl = document.getElementById("new-chan-label");
      var nuEl = document.getElementById("new-chan-url-new");
      if(neEl) neEl.oninput = function(e){ newChannelDraft.emoji = e.target.value; };
      if(nlEl) nlEl.oninput = function(e){ newChannelDraft.label = e.target.value; syncChannelSubmitState(); };
      if(nuEl) nuEl.oninput = function(e){ newChannelDraft.url = e.target.value; };
      var ceEl = document.getElementById("ce-emoji");
      var clEl = document.getElementById("ce-label");
      if(ceEl) ceEl.oninput = function(e){ channelEditDraft.emoji = e.target.value; };
      if(clEl) clEl.oninput = function(e){ channelEditDraft.label = e.target.value; };
      if(state.editingChannelId){
        var cuEl = document.getElementById("ce-url-" + state.editingChannelId);
        if(cuEl) cuEl.oninput = function(e){ channelEditDraft.url = e.target.value; };
      }

      var ngeEl = document.getElementById("new-gchan-emoji");
      var nglEl = document.getElementById("new-gchan-label");
      var nguEl = document.getElementById("new-gchan-url-new");
      if(ngeEl) ngeEl.oninput = function(e){ newGlobalChannelDraft.emoji = e.target.value; };
      if(nglEl) nglEl.oninput = function(e){ newGlobalChannelDraft.label = e.target.value; syncGchanSubmitState(); };
      if(nguEl) nguEl.oninput = function(e){ newGlobalChannelDraft.url = e.target.value; };
      var geEl = document.getElementById("ge-emoji");
      var glEl = document.getElementById("ge-label");
      if(geEl) geEl.oninput = function(e){ globalChannelEditDraft.emoji = e.target.value; };
      if(glEl) glEl.oninput = function(e){ globalChannelEditDraft.label = e.target.value; };
      if(state.editingGlobalChannelId){
        var guEl = document.getElementById("ge-url-" + state.editingGlobalChannelId);
        if(guEl) guEl.oninput = function(e){ globalChannelEditDraft.url = e.target.value; };
      }
    }
  }

  function syncGchanSubmitState(){
    var btn = document.querySelector('[data-action="submit-gchan"]');
    if(btn) btn.disabled = newGlobalChannelDraft.label.trim().length === 0;
  }

  function syncSubmitState(){
    var btn = document.querySelector('[data-action="submit-car"]');
    if(btn) btn.disabled = formDraft.name.trim().length === 0;
  }

  function syncChannelSubmitState(){
    var btn = document.querySelector('[data-action="submit-channel"]');
    if(btn) btn.disabled = newChannelDraft.label.trim().length === 0;
  }

  /* ---------------- event delegation ---------------- */
  document.getElementById("app").addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "switch-tab"){
      state.tab = el.getAttribute("data-value");
      state.confirmDeleteId = null;
      state.editingId = null;
      state.editingChannelId = null;
      state.editingGlobalChannelId = null;
      state.showAddCarForm = false;
      state.publishModal = null;
      render();
    } else if(action === "publish"){
      markPublished(el.getAttribute("data-car"), el.getAttribute("data-platform"));
    } else if(action === "publish-with-link"){
      openPublishModal(el.getAttribute("data-car"), el.getAttribute("data-platform"), null);
    } else if(action === "register-campaign"){
      var rcCar = el.getAttribute("data-car");
      var rcPlatform = el.getAttribute("data-platform");
      var qtyEl = document.getElementById("camp-qty-" + rcPlatform);
      var qtyVal = qtyEl ? parseInt(qtyEl.value, 10) : NaN;
      if(!qtyVal || qtyVal <= 0){ showToast("دخّل كمية صحيحة"); return; }
      registerCampaignProgress(rcCar, rcPlatform, qtyVal);
    } else if(action === "register-campaign-with-link"){
      var rcCar2 = el.getAttribute("data-car");
      var rcPlatform2 = el.getAttribute("data-platform");
      var qtyEl2 = document.getElementById("camp-qty-" + rcPlatform2);
      var qtyVal2 = qtyEl2 ? parseInt(qtyEl2.value, 10) : NaN;
      if(!qtyVal2 || qtyVal2 <= 0){ showToast("دخّل كمية صحيحة"); return; }
      openPublishModal(rcCar2, rcPlatform2, qtyVal2);
    } else if(action === "publish-modal-skip"){
      finalizePublishModal(false);
    } else if(action === "publish-modal-confirm"){
      finalizePublishModal(true);
    } else if(action === "publish-modal-backdrop"){
      if(e.target === el) finalizePublishModal(false); // only closes on a tap outside the sheet
    } else if(action === "ask-delete"){
      state.confirmDeleteId = el.getAttribute("data-car");
      render();
    } else if(action === "confirm-delete"){
      removeCar(el.getAttribute("data-car"));
    } else if(action === "set-priority"){
      formDraft.priority = el.getAttribute("data-value");
      render();
    } else if(action === "toggle-form-channel"){
      var tfcId = el.getAttribute("data-value");
      if(formDraft.selectedChannels[tfcId]){
        delete formDraft.selectedChannels[tfcId];
        delete formDraft.campaign[tfcId];
      } else {
        formDraft.selectedChannels[tfcId] = true;
      }
      render();
    } else if(action === "submit-car"){
      if(formDraft.name.trim().length === 0) return;
      var campaignObj = {};
      Object.keys(formDraft.campaign).forEach(function(pid){
        if(!formDraft.selectedChannels[pid]) return;
        var n = parseInt(formDraft.campaign[pid], 10);
        if(n > 0) campaignObj[pid] = { target: n, done: 0 };
      });
      addCar(formDraft.name, formDraft.adLink, formDraft.notes, formDraft.priority, campaignObj);
      formDraft = { name:"", adLink:"", notes:"", priority:"medium", selectedChannels:{}, campaign:{} };
      state.showAddCarForm = false;
      render();
    } else if(action === "toggle-add-car-form"){
      state.showAddCarForm = !state.showAddCarForm;
      render();
    } else if(action === "mgmt-filter"){
      state.mgmtFilter = el.getAttribute("data-value");
      render();
    } else if(action === "edit-car"){
      var carToEdit = state.cars.find(function(c){ return c.id === el.getAttribute("data-car"); });
      if(!carToEdit) return;
      var initSel = {};
      var initCamp = {};
      if(carToEdit.campaign){
        Object.keys(carToEdit.campaign).forEach(function(pid){
          initSel[pid] = true;
          initCamp[pid] = carToEdit.campaign[pid].target;
        });
      }
      editDraft = { name: carToEdit.name, adLink: carToEdit.adLink, notes: carToEdit.notes, priority: carToEdit.priority, selectedChannels: initSel, campaign: initCamp };
      state.editingId = carToEdit.id;
      render();
    } else if(action === "cancel-edit"){
      state.editingId = null;
      render();
    } else if(action === "toggle-edit-form-channel"){
      var tefcId = el.getAttribute("data-value");
      var enEl = document.getElementById("e-name");
      var elEl = document.getElementById("e-link");
      var enoEl = document.getElementById("e-notes");
      if(enEl) editDraft.name = enEl.value;
      if(elEl) editDraft.adLink = elEl.value;
      if(enoEl) editDraft.notes = enoEl.value;
      effectiveChannels().forEach(function(p){
        var cEl = document.getElementById("ce-camp-" + p.id);
        if(cEl) editDraft.campaign[p.id] = cEl.value;
      });
      if(editDraft.selectedChannels[tefcId]){
        delete editDraft.selectedChannels[tefcId];
        delete editDraft.campaign[tefcId];
      } else {
        editDraft.selectedChannels[tefcId] = true;
      }
      render();
    } else if(action === "set-edit-priority"){
      var nEl = document.getElementById("e-name");
      var lEl = document.getElementById("e-link");
      var noEl = document.getElementById("e-notes");
      if(nEl) editDraft.name = nEl.value;
      if(lEl) editDraft.adLink = lEl.value;
      if(noEl) editDraft.notes = noEl.value;
      editDraft.priority = el.getAttribute("data-value");
      render();
    } else if(action === "save-edit"){
      var editId = el.getAttribute("data-car");
      var carBeingEdited = state.cars.find(function(c){ return c.id === editId; });
      var nameEl2 = document.getElementById("e-name");
      var linkEl2 = document.getElementById("e-link");
      var notesEl2 = document.getElementById("e-notes");
      var newName = nameEl2 ? nameEl2.value.trim() : "";
      if(!newName){ showToast("اسم السيارة مطلوب"); return; }
      var newCampaign = {};
      effectiveChannels().filter(function(p){ return p.active; }).forEach(function(p){
        var cEl = document.getElementById("ce-camp-" + p.id);
        var n = cEl ? parseInt(cEl.value, 10) : NaN;
        if(n > 0){
          var existing = carBeingEdited ? campaignEntry(carBeingEdited, p.id) : null;
          newCampaign[p.id] = { target: n, done: existing ? Math.min(existing.done, n) : 0 };
        }
      });
      state.editingId = null;
      updateDoc(doc(db, "accounts", currentUser.uid, "cars", editId), {
        name: newName,
        adLink: linkEl2 ? linkEl2.value.trim() : "",
        notes: notesEl2 ? notesEl2.value.trim() : "",
        priority: editDraft.priority,
        campaign: newCampaign
      }).then(function(){
        showToast("تم حفظ التعديلات");
      }).catch(function(err){
        console.error("save-edit error:", err);
        showToast("فشل الحفظ — تحقق من الاتصال");
      });
      render();
    } else if(action === "toggle-active"){
      var toggleId = el.getAttribute("data-car");
      var toggleCar = state.cars.find(function(c){ return c.id === toggleId; });
      if(!toggleCar) return;
      updateDoc(doc(db, "accounts", currentUser.uid, "cars", toggleId), { active: !toggleCar.active }).catch(function(err){
        console.error("toggle-active error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "mgmt-ask-delete"){
      state.confirmDeleteId = el.getAttribute("data-car");
      render();
    } else if(action === "mgmt-confirm-delete"){
      removeCar(el.getAttribute("data-car"));
    } else if(action === "set-new-channel-type"){
      newChannelDraft.messaging = el.getAttribute("data-value") === "1";
      render();
    } else if(action === "set-edit-channel-type"){
      channelEditDraft.messaging = el.getAttribute("data-value") === "1";
      render();
    } else if(action === "submit-channel"){
      var newLabel = newChannelDraft.label.trim();
      if(!newLabel) return;
      var newEmoji = (newChannelDraft.emoji || "📣").trim() || "📣";
      var maxOrder = state.platforms.reduce(function(m,p){ return Math.max(m, p.order); }, -1);
      addDoc(platformsCol, {
        label: newLabel, emoji: newEmoji, bg: "rgba(232,25,44,.14)", url: (newChannelDraft.url||"").trim(),
        order: maxOrder + 1, active: true, createdAt: Date.now(), messaging: !!newChannelDraft.messaging
      }).then(function(){
        showToast("تمت إضافة القناة");
      }).catch(function(err){
        console.error("submit-channel error:", err);
        showToast("فشلت الإضافة — تحقق من الاتصال");
      });
      newChannelDraft = { emoji:"📣", label:"", url:"", messaging:false };
      render();
    } else if(action === "edit-channel"){
      var chanToEdit = state.platforms.find(function(p){ return p.id === el.getAttribute("data-channel"); });
      if(!chanToEdit) return;
      channelEditDraft = { emoji: chanToEdit.emoji, label: chanToEdit.label, url: chanToEdit.url || "", messaging: !!chanToEdit.messaging };
      state.editingChannelId = chanToEdit.id;
      render();
    } else if(action === "cancel-channel-edit"){
      state.editingChannelId = null;
      render();
    } else if(action === "save-channel-edit"){
      var chanId = el.getAttribute("data-channel");
      var ceEl2 = document.getElementById("ce-emoji");
      var clEl2 = document.getElementById("ce-label");
      var cuEl2 = document.getElementById("ce-url-" + chanId);
      var newChanLabel = clEl2 ? clEl2.value.trim() : "";
      if(!newChanLabel){ showToast("اسم القناة مطلوب"); return; }
      state.editingChannelId = null;
      updateDoc(doc(db, "accounts", currentUser.uid, "platforms", chanId), {
        label: newChanLabel,
        emoji: (ceEl2 ? ceEl2.value.trim() : "") || "📣",
        url: cuEl2 ? cuEl2.value.trim() : "",
        messaging: !!channelEditDraft.messaging
      }).then(function(){
        showToast("تم حفظ القناة");
      }).catch(function(err){
        console.error("save-channel-edit error:", err);
        showToast("فشل الحفظ — تحقق من الاتصال");
      });
      render();
    } else if(action === "toggle-channel-active"){
      var toggleChanId = el.getAttribute("data-channel");
      var toggleChan = state.platforms.find(function(p){ return p.id === toggleChanId; });
      if(!toggleChan) return;
      updateDoc(doc(db, "accounts", currentUser.uid, "platforms", toggleChanId), { active: !toggleChan.active }).catch(function(err){
        console.error("toggle-channel-active error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "chan-ask-delete"){
      state.confirmDeleteId = "chan:" + el.getAttribute("data-channel");
      render();
    } else if(action === "chan-confirm-delete"){
      var delChanId = el.getAttribute("data-channel");
      state.confirmDeleteId = null;
      deleteDoc(doc(db, "accounts", currentUser.uid, "platforms", delChanId)).catch(function(err){
        console.error("chan-confirm-delete error:", err);
        showToast("فشل الحذف — تحقق من الاتصال");
      });
      render();
    } else if(action === "set-new-gchan-type"){
      newGlobalChannelDraft.messaging = el.getAttribute("data-value") === "1";
      render();
    } else if(action === "set-edit-gchan-type"){
      globalChannelEditDraft.messaging = el.getAttribute("data-value") === "1";
      render();
    } else if(action === "submit-gchan"){
      if(!state.isAdmin) return;
      var ngLabelEl = document.getElementById("new-gchan-label");
      var ngEmojiEl = document.getElementById("new-gchan-emoji");
      var ngUrlEl = document.getElementById("new-gchan-url-new");
      var ngLabel = ngLabelEl ? ngLabelEl.value.trim() : "";
      if(!ngLabel) return;
      var ngEmoji = (ngEmojiEl ? ngEmojiEl.value.trim() : "") || "📣";
      var maxGOrder = state.globalChannels.reduce(function(m,g){ return Math.max(m, g.order); }, -1);
      addDoc(globalChannelsCol, {
        label: ngLabel, emoji: ngEmoji, bg: "rgba(232,25,44,.14)",
        url: ngUrlEl ? ngUrlEl.value.trim() : "",
        order: maxGOrder + 1, active: true, createdAt: Date.now(), messaging: !!newGlobalChannelDraft.messaging
      }).then(function(){
        showToast("تمت إضافة القناة العامة");
      }).catch(function(err){
        console.error("submit-gchan error:", err);
        showToast("فشلت الإضافة — تحقق من الاتصال");
      });
      newGlobalChannelDraft = { emoji:"📣", label:"", url:"", messaging:false };
      render();
    } else if(action === "edit-gchan"){
      var gToEdit = findGlobalChannel(el.getAttribute("data-channel"));
      if(!gToEdit) return;
      var ov = state.channelOverrides[gToEdit.id];
      var eff = ov ? Object.assign({}, gToEdit, ov) : gToEdit;
      globalChannelEditDraft = { emoji: eff.emoji, label: eff.label, url: eff.url || "", messaging: !!eff.messaging };
      state.editingGlobalChannelId = gToEdit.id;
      render();
    } else if(action === "cancel-gchan-edit"){
      state.editingGlobalChannelId = null;
      render();
    } else if(action === "save-gchan-edit"){

      var geEmojiEl = document.getElementById("ge-emoji");
      var geLabelEl = document.getElementById("ge-label");
      var geUrlEl = document.getElementById("ge-url-" + gId);
      var geLabel = geLabelEl ? geLabelEl.value.trim() : "";
      if(!geLabel){ showToast("اسم القناة مطلوب"); return; }
      var geEmoji = (geEmojiEl ? geEmojiEl.value.trim() : "") || "📣";
      var geUrl = geUrlEl ? geUrlEl.value.trim() : "";
      state.editingGlobalChannelId = null;
      if(state.isAdmin){
        updateDoc(doc(db, "globalChannels", gId), {
          label: geLabel, emoji: geEmoji, url: geUrl, messaging: !!globalChannelEditDraft.messaging
        }).then(function(){
          showToast("تم حفظ القناة");
        }).catch(function(err){
          console.error("save-gchan-edit error:", err);
          showToast("فشل الحفظ — تحقق من الاتصال");
        });
      } else {
        setDoc(doc(db, "accounts", currentUser.uid, "channelOverrides", gId), {
          label: geLabel, emoji: geEmoji, url: geUrl, messaging: !!globalChannelEditDraft.messaging
        }).then(function(){
          showToast("تم الحفظ عندك بس");
        }).catch(function(err){
          console.error("save-gchan-override error:", err);
          showToast("فشل الحفظ — تحقق من الاتصال");
        });
      }
      render();
    } else if(action === "reset-gchan-override"){
      var roId = el.getAttribute("data-channel");
      state.editingGlobalChannelId = null;
      deleteDoc(doc(db, "accounts", currentUser.uid, "channelOverrides", roId)).then(function(){
        showToast("تم الاسترجاع للافتراضي");
      }).catch(function(err){
        console.error("reset-gchan-override error:", err);
        showToast("فشل — تحقق من الاتصال");
      });
      render();
    } else if(action === "toggle-gchan-active"){
      if(!state.isAdmin) return;
      var tgId = el.getAttribute("data-channel");
      var tgChan = findGlobalChannel(tgId);
      if(!tgChan) return;
      updateDoc(doc(db, "globalChannels", tgId), { active: !tgChan.active }).catch(function(err){
        console.error("toggle-gchan-active error:", err);
        showToast("فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "gchan-ask-delete"){
      if(!state.isAdmin) return;
      state.confirmDeleteId = "gchan:" + el.getAttribute("data-channel");
      render();
    } else if(action === "gchan-confirm-delete"){
      if(!state.isAdmin) return;
      var delGId = el.getAttribute("data-channel");
      state.confirmDeleteId = null;
      deleteDoc(doc(db, "globalChannels", delGId)).catch(function(err){
        console.error("gchan-confirm-delete error:", err);
        showToast("فشل الحذف — تحقق من الاتصال");
      });
      render();
    } else if(action === "google-signin"){
      state.authError = null;
      signInWithPopup(auth, googleProvider).catch(function(err){
        console.error("popup signin error:", err);
        if(err && err.code === "auth/popup-blocked"){
          state.authError = "المتصفح منع نافذة تسجيل الدخول. اسمح بالنوافذ المنبثقة (popups) لهذا الموقع وحاول تاني.";
        } else if(err && err.code === "auth/unauthorized-domain"){
          state.authError = "الدومين ده مش مسموح بيه في إعدادات Firebase. لازم تضيفه في Authentication → Settings → Authorized domains.";
        } else if(err && err.code === "auth/popup-closed-by-user" || err && err.code === "auth/cancelled-popup-request"){
          /* the user closed the popup themselves — no need to show an error */
        } else if(err && err.code) {
          state.authError = "حصل خطأ أثناء تسجيل الدخول (" + err.code + "). حاول تاني.";
        }
        render();
      });
    } else if(action === "toggle-account-menu"){
      state.showAccountMenu = !state.showAccountMenu;
      render();
    } else if(action === "sign-out"){
      state.showAccountMenu = false;
      signOut(auth).catch(function(err){ console.error("signout error:", err); });
    } else if(action === "run-migration"){
      runMigration();
    } else if(action === "dismiss-migration"){
      state.migrationAvailable = false;
      render();
    } else if(action === "install-app-now"){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(choice){
        deferredInstallPrompt = null;
        state.showInstallCard = false;
        if(choice && choice.outcome !== "accepted"){
          localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now()));
        }
        render();
      });
    } else if(action === "install-ios-toggle"){
      state.showIOSInstallSteps = !state.showIOSInstallSteps;
      render();
    } else if(action === "install-app-dismiss"){
      state.showInstallCard = false;
      state.showIOSInstallSteps = false;
      localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now()));
      render();
    } else if(action === "toggle-alerts"){
      state.showAllAlerts = !state.showAllAlerts;
      render();
    } else if(action === "toggle-subscription"){

      var subAccId = el.getAttribute("data-account");

      updateDoc(doc(db, "accounts", subAccId), { subscriptionStatus: subNext }).then(function(){
        showToast(subNext === "active" ? "تم تفعيل الاشتراك" : "تم إيقاف الاشتراك");
      }).catch(function(err){
        console.error("toggle-subscription error:", err);
        showToast("فشل التحديث — تحقق من صلاحيات Firestore Rules");
      });
    } else if(action === "sub-edit"){
      if(!state.isAdmin) return;
      var subEditId = el.getAttribute("data-account");
      var subAcc = state.adminAccounts.find(function(a){ return a.id === subEditId; });
      if(!subAcc) return;
      var defaultStartTs = subAcc.subscriptionStart || subAcc.createdAt || Date.now();
      var defaultEndTs = subAcc.subscriptionEnd || (defaultStartTs + 30*86400000);
      subEditDraft = {
        start: dateInputVal(defaultStartTs),
        end: dateInputVal(defaultEndTs),
        phone: subAcc.phone || "20"
      };
      state.editingSubId = subEditId;
      render();

      var endVal = endEl && endEl.value ? new Date(endEl.value + "T00:00:00").getTime() : null;
      state.editingSubId = null;
      updateDoc(doc(db, "accounts", saveSubId), {
        subscriptionStart: startVal,
        subscriptionEnd: endVal,
        phone: phoneEl ? phoneEl.value.trim() : ""
      }).then(function(){
        showToast("تم حفظ بيانات الاشتراك");
      }).catch(function(err){
        console.error("sub-save error:", err);
        showToast("فشل الحفظ — تحقق من الاتصال");
      });
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
