  function screenToday(){
    var activePlatforms = curEffectiveChannels().filter(function(p){ return p.active; });
    var body;
    if(activePlatforms.length === 0){
      body = '<div class="empty-state"><div class="box">' + ICONS.send.replace('viewBox','style="width:24px;height:24px;color:#6c6c74" viewBox') + '</div>' +
        '<p class="t1">' + esc(t("no_active_channels_title")) + '</p><p class="t2">' + esc(t("no_active_channels_sub")) + '</p></div>';
    } else {
      /* لو القناة معندهاش ولا عربية واحدة ممكن تتنشر عليها دلوقتي
         (مش لأن الكل خلّص حملته، لكن لأن مفيش عربية أصلاً بتنطبق عليها —
         إما مفيش عربيات نشطة، أو كل العربيات النشطة عندها حملة على
         قنوات تانية بس)، بنشيل القناة دي من خطة اليوم خالص بدل ما نعرض
         كارت فاضي مالوش أي إجراء ممكن تعمله. القنوات اللي "خلّصت حملتها"
         (relevantCars موجودة لكن كلها complete) بتفضل ظاهرة كتأكيد إنجاز. */
      var todayPlatforms = activePlatforms.filter(function(p){
        return relevantCarsFor(p.id).length > 0;
      });
      if(todayPlatforms.length === 0){
        body = '<div class="empty-state"><div class="box">' + ICONS.send.replace('viewBox','style="width:24px;height:24px;color:#6c6c74" viewBox') + '</div>' +
          '<p class="t1">' + esc(t("no_tasks_now_title")) + '</p><p class="t2">' + esc(t("no_tasks_now_sub")) + '</p></div>';
      } else {
      /* بدل ما كل قناة تطلع بكارت واحد بس بيتحدّث كل ما تنشر (وده
         اللي كان بيسمح تنشر أكتر من العدد المطلوب من غير ما حد يوضح
         مين اللي لسه محتاج نشر النهارده)، دلوقتي كل قناة بتطلع بعدد
         كروت = هدفها اليومي (dailyTarget) بالظبط، كل كارت لعربية مختلفة
         من طابور queueForPlatform. العربيات اللي اتنشرت فعلاً النهارده
         بتفضل ظاهرة كـ"تم" ضمن العدد، والباقي بيتملى بأكتر العربيات
         عطشانة للنشر. كده العدد اللي بتحدده في القناة (مثلاً 4) بيبقى
         فعليًا 4 مهام واضحة، وبكرة الدورة بتكمل على باقي العربيات
         تلقائيًا لأن اللي اتنشرله النهارده بقى "طازة" وترتيبه في
         الطابور بينزل لتحت. */
      var withStatus = [];
      todayPlatforms.forEach(function(p){
        var queue = queueForPlatform(p.id);
        if(queue.length === 0){
          /* القناة معندهاش ولا عربية لسه محتاجة نشر (كل الحملات عليها
             خلصت) — بنسيب كارت واحد يوضّح كده بدل ما القناة تختفي
             بصمت من خطة اليوم. */
          withStatus.push({ platform:p, car:null, doneToday:true, urgency:-1 });
          return;
        }
        queue.forEach(function(car){
          var doneToday = isToday(car.lastPublished[p.id]);
          withStatus.push({ platform:p, car:car, doneToday:doneToday, urgency:urgencyScore(car, p.id) });
        });
      });
      var doneCount = withStatus.filter(function(x){ return x.doneToday; }).length;
      var total = withStatus.length;
      var pct = total ? Math.round((doneCount/total)*100) : 0;
      var allDone = total > 0 && doneCount === total;

      /* pending tasks first (most urgent first among them), completed ones after */
      var ordered = withStatus.slice().sort(function(a,b){
        if(a.doneToday !== b.doneToday) return a.doneToday ? 1 : -1;
        return b.urgency - a.urgency;
      });

      var progressCard =
        '<div class="progress-card' + (allDone?' all-done':'') + '">' +
          '<div class="progress-head">' +
            '<p class="progress-title">' + (allDone ? esc(t("all_done_title")) : esc(t("today_plan_title"))) + '</p>' +
            '<span class="progress-count num-ltr">' + doneCount + ' / ' + total + '</span>' +
          '</div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<p class="progress-sub">' + (allDone ? esc(t("all_done_sub")) : (total - doneCount) + esc(t("tasks_remaining_sub")) ) + '</p>' +
        '</div>';

      var pendingItems = ordered.filter(function(x){ return !x.doneToday; });
      var doneItems = ordered.filter(function(x){ return x.doneToday; });

      var pendingHtml = pendingItems.length ?
        '<p class="section-title">' + esc(t("pending_tasks_title")) + pendingItems.length + ')</p>' +
        '<div class="today-grid">' + pendingItems.map(function(x){ return slotCard(x.platform.id, x.car); }).join("") + '</div>'
        : '';

      var doneExpanded = state.doneSectionExpanded;
      var doneToggle = '<button class="section-toggle" data-action="toggle-done-section">' + (doneExpanded ? esc(t("show_compact")) : esc(t("show_details_repost"))) + '</button>';

      var doneHtml = doneItems.length ?
        '<div class="section-divider"></div>' +
        '<div class="section-head-row">' +
          '<p class="section-title">' + esc(t("done_tasks_title")) + doneItems.length + ')</p>' +
          doneToggle +
        '</div>' +
        (doneExpanded ?
          '<div class="today-grid">' + doneItems.map(function(x){ return slotCard(x.platform.id, x.car); }).join("") + '</div>' :
          '<div class="done-list">' + doneItems.map(function(x){ return compactDoneRow(x.platform.id, x.car); }).join("") + '</div>')
        : '';

      body = progressCard + alertsPanel() + pendingHtml + doneHtml;
      }
    }
    return topbar(t("topbar_today_title"), t("topbar_today_sub")) + '<div class="content">' + body + '</div>';
  }

  /* ---------------- alerts ---------------- */
  var ALERT_OVERDUE_DAYS = 7;

  function computeAlerts(){
    var alerts = [];
    var cars = activeCars();
    var plats = curEffectiveChannels().filter(function(p){ return p.active; });
    cars.forEach(function(car){
      plats.forEach(function(p){
        /* لو السيارة عندها حملة محددة على قنوات معينة، والقناة دي مش
           من ضمنهم، يبقى أصلاً مش المفروض تتنشر عليها — فمينفعش نطلع
           تنبيه "لسه ما نشرتش" لقناة السيارة دي مستبعدة منها عمدًا
           (نفس استثناء relevantCarsFor/queueForPlatform). */
        var hasCampaign = car.campaign && Object.keys(car.campaign).length > 0;
        if(hasCampaign && !car.campaign[p.id]) return;
        if(campaignComplete(car, p.id)) return;
        var ts = car.lastPublished[p.id];
        if(ts === undefined || ts === null){
          alerts.push({ level:"warn", text: state.lang==="en"
            ? (t("alert_not_posted") + car.name + t("alert_not_posted_in") + p.label)
            : ('لسه ما نشرتش "' + car.name + '" في ' + p.label), sortDays: 9999 });
        } else {
          var days = daysSince(ts);
          if(days !== null && days >= ALERT_OVERDUE_DAYS){
            alerts.push({ level:"urgent", text: state.lang==="en"
              ? (t("alert_overdue_prefix") + car.name + t("alert_overdue_in") + p.label + t("alert_overdue_since") + days + t("alert_overdue_day"))
              : ('لم تُنشر "' + car.name + '" في ' + p.label + ' منذ ' + days + ' يوم'), sortDays: days });
          }
        }
      });
    });
    alerts.sort(function(a,b){
      if(a.level !== b.level) return a.level === "urgent" ? -1 : 1;
      return b.sortDays - a.sortDays;
    });
    return alerts;
  }

  function alertsPanel(){
    var alerts = computeAlerts();
    if(alerts.length === 0) return "";
    var showAll = state.showAllAlerts;
    var visible = showAll ? alerts : alerts.slice(0, 3);
    var items = visible.map(function(a){
      var dotColor = a.level === "urgent" ? "#E8192C" : "#F5A623";
      return '<div class="alert-item"><span class="alert-dot" style="background:' + dotColor + '"></span><span class="alert-text">' + esc(a.text) + '</span></div>';
    }).join("");
    var toggle = alerts.length > 3 ?
      '<button class="alerts-toggle" data-action="toggle-alerts">' + (showAll ? esc(t("alerts_hide")) : esc(t("alerts_show_all")) + alerts.length + ")") + '</button>' : "";
    return '<div class="alerts-panel">' +
      '<div class="alerts-head"><span>' + esc(t("alerts_title")) + '</span>' + toggle + '</div>' +
      items +
    '</div>';
  }

  /* ---------------- management screen ---------------- */
  state.mgmtSearch = "";
  state.mktSearch = "";
  state.mktCountryFilter = "all";
  state.mgmtFilter = "all";
  state.mgmtSort = "recent";
  state.mgmtSearchFocused = false;
  state.mktSearchFocused = false;
  state.editingId = null;
  var editDraft = { name:"", adLink:"", notes:"", priority:"medium", selectedChannels:{}, campaign:{} };

  function filteredMgmtCars(){
    var q = state.mgmtSearch.trim().toLowerCase();
    var list = state.cars.filter(function(c){
      if(state.mgmtFilter === "active" && !c.active) return false;
      if(state.mgmtFilter === "inactive" && c.active) return false;
      if(q && c.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    if(state.mgmtSort === "urgent"){
      /* الأكثر احتياجًا للنشر: نفس منطق طابور "إعادة النشر" اللي كان
         في تاب منفصل — أطول مدة من غير نشر × وزن الأولوية، والمثبّتة
         برضو بتفضل فوق لأن التثبيت أولوية عرض يدوية من المستخدم. */
      return list.sort(function(a,b){
        if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
        if(a.active !== b.active) return a.active ? -1 : 1;
        return cmpForPlatform(a, b, "global");
      });
    }
    return list.sort(function(a,b){

  function completionPct(car){
    var campKeys = car.campaign ? Object.keys(car.campaign) : [];
    if(campKeys.length > 0){
      var totalTarget = 0, totalDone = 0;
      campKeys.forEach(function(pid){
        var e = car.campaign[pid];
        totalTarget += e.target;
        totalDone += Math.min(e.done, e.target);
      });
      return totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) : 0;
    }
    var activePlats = curEffectiveChannels().filter(function(p){ return p.active; });
    if(activePlats.length === 0) return 0;
    var published = activePlats.filter(function(p){
      var v = car.lastPublished[p.id];
      return v !== undefined && v !== null;
    }).length;
    return Math.round((published / activePlats.length) * 100);
  }

          '<div class="mgmt-search-box">' + ICONS.search.replace('viewBox','style="width:16px;height:16px;flex-shrink:0;color:#6c6c74" viewBox') +
            '<input class="mgmt-search-input" id="mgmt-search" placeholder="' + esc(t("search_car_placeholder")) + '" value="' + esc(state.mgmtSearch) + '" /></div>' +
          '<div class="mgmt-filters">' + mgmtChip("all",t("filter_all")) + mgmtChip("active",t("filter_active")) + mgmtChip("inactive",t("filter_inactive")) + '</div>' +
          '<div class="mgmt-filters" style="margin-top:6px;flex-wrap:wrap">' + mgmtSortChip("recent",t("sort_recent")) + mgmtSortChip("urgent",t("sort_urgent")) + '</div>' +
        '</div>';
      var itemsHtml = list.length === 0
        ? '<p style="text-align:center;color:#8a8a92;font-size:13px;padding:40px 0">' + esc(t("no_matching_results")) + '</p>'
        : '<div class="mgmt-grid">' + list.map(mgmtItem).join("") + '</div>';
      body = toolbar + itemsHtml;
    }
    return topbar(t("topbar_manage_title"), state.cars.length + t("topbar_manage_sub_suffix")) + '<div class="content">' + addToggle + addForm + body + '</div>';
  }

  /* ---------------- معرض السيارات المتاحة للبيع (سوق بين كل المشتركين) ----------------
     مجموعة "marketplace" عامة بتتغذى من كل حسابات المشتركين اللي ضغطوا
     "عرضها للمسوقين الآخرين" على سياراتهم. هنا بنعرض بس الاسم ورقم
     التواصل — من غير أي تفاصيل حملة أو نشر. */
  function marketplaceMessage(carName){
    if(state.domain === "property"){
      return state.lang==="en"
        ? "Hello,\nI saw the property ( " + carName + " ) on the Lam7Track app and I'd like to know more details and see photos.\nThank you."
        : "السلام عليكم ورحمة الله وبركاته،\nلقد رأيت عقار ( " + carName + " ) علي تطبيق Lam7Track وأريد معرفة التفاصيل ورؤية الصور.\nشكرًا لكم.";
    }
    return state.lang==="en"
      ? "Hello,\nI saw the car ( " + carName + " ) on the Lam7CarsTrack app and I'd like to know more details and see photos of the car.\nThank you."
      : "السلام عليكم ورحمة الله وبركاته،\nمرحبآ بكم، لقد رأيت سيارة ( " + carName + " ) علي تطبيق Lam7CarsTrack واريد معرفة التفاصيل ورؤية الصور الخاصة بالسيارة.\nشكرًا لكم.";
  }

  /* رسالة طلب التثبيت اللي بتتفتح في واتساب الأدمن لما أي عضو يضغط
     "طلب تثبيت" على سيارة معينة في المعرض العام (سواء سيارته أو سيارة
     عضو تاني عايز يتواصل بخصوصها). */
  function pinRequestMessage(carName){
    return state.lang==="en"
      ? "Hello,\nI'd like to request pinning the car ( " + carName + " ) on the public marketplace, if possible.\nThank you."
      : "السلام عليكم،\nأنا عايز أطلب تثبيت سيارة ( " + carName + " ) في معرض البيع العام لو ممكن.\nشكرًا لكم.";
  }

  function marketplaceItem(mc){
    var isMine = currentUser && mc.ownerId === currentUser.uid;
    var contactHtml;
    if(isMine){
      contactHtml = '<span style="flex-shrink:0;font-size:11px;font-weight:800;color:var(--text-4);background:var(--ink-800);border:1px solid var(--ink-700);border-radius:8px;padding:6px 10px;white-space:nowrap">' + esc(state.domain==="property" ? t("mkt_your_prop_btn") : t("mkt_your_car_btn")) + '</span>';
    } else if(mc.phone){
      var msg = marketplaceMessage(mc.name);
      contactHtml = '<a class="mkt-contact-btn" href="https://wa.me/' + waDigits(mc.phone) + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noreferrer">' + ICONS.send + ' ' + esc(t("mkt_contact_btn")) + '</a>';
    } else {
      contactHtml = '<span style="flex-shrink:0;font-size:11px;color:var(--text-5)">' + esc(t("mkt_no_phone")) + '</span>';
    }

    /* زرار التثبيت: للأدمن زرار فعلي بيثبت/يلغي تثبيت السيارة في المعرض
       العام مباشرة. لغير الأدمن، زرار "طلب تثبيت" بيفتح واتساب الأدمن
       برسالة جاهزة — من غير أي صلاحية فعلية على المستند. */
    var pinHtml;
    if(state.isAdmin){
      pinHtml = '<button class="mkt-admin-pin-btn' + (mc.pinned ? ' is-pinned' : '') + '" data-action="toggle-marketplace-pin" data-mkt="' + mc.id + '" data-pinned="' + (mc.pinned ? "1" : "0") + '">' + ICONS.pin + ' ' + (mc.pinned ? esc(t("mkt_unpin_btn")) : esc(t("mkt_pin_btn"))) + '</button>';
    } else if(!mc.pinned && isMine){
      /* غير الأدمن يقدر بس يطلب تثبيت لسيارته هو، مش لسيارات باقي الأعضاء */
      var pinMsg = pinRequestMessage(mc.name);
      pinHtml = '<a class="mkt-request-pin-btn" href="https://wa.me/' + ADMIN_WHATSAPP + '?text=' + encodeURIComponent(pinMsg) + '" target="_blank" rel="noreferrer">' + ICONS.pin + ' ' + esc(t("mkt_request_pin_btn")) + '</a>';
    } else {
      pinHtml = '';
    }

    var safeProfileLink = mc.profileLink && isValidUrl(mc.profileLink) ? mc.profileLink : "";
    var roleText = roleLabel(state.domain, mc.role);
    var nameHtml = esc(mc.name);
    var roleHtml = roleText
      ? (safeProfileLink
          ? '<a class="mkt-role-badge" href="' + esc(safeProfileLink) + '" target="_blank" rel="noopener noreferrer" title="' + esc(t("view_profile_link")) + '">' + esc(roleText) + ' ' + ICONS.link.replace('viewBox','style="width:10px;height:10px;display:inline-block;vertical-align:-1px" viewBox') + '</a>'
          : '<span class="mkt-role-badge">' + esc(roleText) + '</span>')
      : "";

    return '<div class="mkt-item">' +
      '<div style="min-width:0">' +
        '<p class="mkt-name">' + (state.domain==="property"?'🏠':'🚗') + ' ' + nameHtml + (state.isAdmin ? ' <span style="color:var(--text-5);font-weight:700;font-size:11px">' + countryLabel(effCountry(mc)) + '</span>' : '') + '</p>' +
        (roleHtml ? '<div style="margin:3px 0">' + roleHtml + '</div>' : '') +
        (mc.phone && !isMine ? '<span class="mkt-phone">' + esc(mc.phone) + '</span>' : '') +
        (mc.pinned ? '<span class="mkt-pin-badge">' + ICONS.pin + ' ' + esc(t("pinned_badge")) + '</span>' : '') +
      '</div>' +
      '<div class="mkt-actions">' + contactHtml + pinHtml + '</div>' +
    '</div>';
  }

  function filteredMarketplaceCars(){
    var q = state.mktSearch.trim().toLowerCase();
    var list = curMarketCars();
    if(state.isAdmin && state.mktCountryFilter !== "all"){
      list = list.filter(function(mc){ return effCountry(mc) === state.mktCountryFilter; });
    }
    if(!q) return list;
    return list.filter(function(mc){
      return mc.name.toLowerCase().indexOf(q) !== -1;
    });
  }

  function curMarketCars(){ return state.domain === "property" ? state.propertyMarketplaceCars : state.marketplaceCars; }
  function curMarketLoaded(){ return state.domain === "property" ? state.propertyMarketplaceLoaded : state.marketplaceLoaded; }

  function screenMarketplace(){
    var isProp = state.domain === "property";
    var cars = curMarketCars();
    var title = isProp ? t("topbar_marketplace_title_prop") : t("topbar_marketplace_title");
    var sub = cars.length + (isProp ? t("topbar_marketplace_sub_suffix_prop") : t("topbar_marketplace_sub_suffix"));
    var body;
    var countryChips = state.isAdmin ?
      '<div class="mgmt-filters" style="margin-bottom:10px">' +
        '<button class="chip' + (state.mktCountryFilter==="all"?' active':'') + '" data-action="mkt-country-filter" data-value="all">' + esc(t("sub_all")) + '</button>' +
        COUNTRIES.map(function(c){
          return '<button class="chip' + (state.mktCountryFilter===c.id?' active':'') + '" data-action="mkt-country-filter" data-value="' + c.id + '">' + c.flag + ' ' + esc(state.lang==="en"?c.en:c.ar) + '</button>';
        }).join("") +
      '</div>' : '';
    var searchBox = '<div class="mgmt-search-box" style="margin-bottom:12px">' + ICONS.search.replace('viewBox','style="width:16px;height:16px;flex-shrink:0;color:#6c6c74" viewBox') +
      '<input class="mgmt-search-input" id="mkt-search" placeholder="' + esc(isProp ? t("prop_search_placeholder") : t("search_car_placeholder")) + '" value="' + esc(state.mktSearch) + '" /></div>';
    var iconBox = '<div class="box">' + ICONS.tag.replace('viewBox','style="width:24px;height:24px;color:#6c6c74" viewBox') + '</div>';
    if(!curMarketLoaded()){
      body = '<div class="empty-state">' + iconBox + '<p class="t1">' + esc(t("mkt_loading")) + '</p></div>';
    } else if(cars.length === 0){
      body = '<div class="empty-state">' + iconBox +
        '<p class="t1">' + esc(isProp ? t("mkt_empty_title_prop") : t("mkt_empty_title")) + '</p>' +
        '<p class="t2">' + esc(isProp ? t("mkt_empty_sub_prop") : t("mkt_empty_sub")) + '</p></div>';
    } else {
      var list = filteredMarketplaceCars();
      body = countryChips + searchBox + (list.length === 0
        ? '<p style="text-align:center;color:#8a8a92;font-size:13px;padding:40px 0">' + esc(t("no_matching_results")) + '</p>'
        : '<div class="card">' + list.map(marketplaceItem).join("") + '</div>');
    }
    return topbar(title, sub) + '<div class="content">' + body + '</div>';
  }

  /* ---------------- channels (publishing places) management ---------------- */
  var newChannelDraft = { emoji:"📣", label:"", url:"", messaging:false, dailyTarget:1, repostIntervalDays:0 };
  state.editingChannelId = null;
  var channelEditDraft = { emoji:"", label:"", url:"", messaging:false, dailyTarget:1, repostIntervalDays:0 };

  function chanUrlField(id, value, prefix){
    return '<input class="input" dir="ltr" style="text-align:left" id="' + prefix + id + '" value="' + esc(value||"") + '" placeholder="' + esc(t("chan_url_placeholder")) + '" />';
  }
  function chanTargetField(id, value, prefix){
    return '<div style="margin:8px 0">' +
      '<label style="display:block;font-size:11px;color:var(--text-5);margin-bottom:4px;font-weight:700">' + esc(t("chan_target_label")) + '</label>' +
      '<input class="input" type="number" min="1" style="width:100px" id="' + prefix + id + '" value="' + (value>0?value:1) + '" />' +
    '</div>';
  }

  /* فاصل إعادة النشر: أقل عدد أيام لازم يعدي قبل ما نقترح نفس السيارة
     تاني على القناة دي — بيتحسب لكل سيارة لوحدها (آخر نشر ليها هي بس)،
     ومفيش تأثير على سيارات تانية على نفس القناة. 0 = من غير فاصل. */
  function chanIntervalField(id, value, prefix){
    return '<div style="margin:8px 0">' +
      '<label style="display:block;font-size:11px;color:var(--text-5);margin-bottom:4px;font-weight:700">' + esc(t("chan_interval_label")) + '</label>' +
      '<input class="input" type="number" min="0" style="width:100px" id="' + prefix + id + '" value="' + (value>0?value:0) + '" />' +
    '</div>';
  }

  /* أي عربية عندها القناة دي جوه حملتها؟ بنستخدمها عشان نوضح للمستخدم
     وقت تعديل اسم قناة إن القناة دي مرتبطة فعلاً بحملات موجودة — عشان
     يعرف إن تغيير الاسم مش هيفصلها عن السيارات دي (نفس القناة، اسم جديد بس)،
     ومش هيضيفها كقناة جديدة فاضية من الصفر. */
  function carsLinkedToChannel(pid){
    return curItems().filter(function(c){ return c.campaign && !!c.campaign[pid]; }).map(function(c){ return c.name; });
  }

  function chanItem(p){
    if(state.editingChannelId === p.id) return chanEditForm(p);
    var isConfirm = state.confirmDeleteId === "chan:" + p.id;
    var isPromoteConfirm = state.confirmDeleteId === "promote:" + p.id;
    var linkedCount = carsLinkedToChannel(p.id).length;
    return '<div class="chan-item chan-item--private">' +
      '<div class="chan-emoji" style="background:' + p.bg + '">' + esc(p.emoji) + '</div>' +
      '<div class="chan-mid">' +
        '<p class="chan-name">' + esc(p.label) + (p.pinned ? '<span class="chan-private-badge" style="color:#F5A623;background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.35)">' + ICONS.pin.replace('viewBox','style="width:9px;height:9px;display:inline-block;vertical-align:-1px" viewBox') + ' ' + esc(t("pinned_badge")) + '</span>' : '') + '<span class="chan-private-badge">' + ICONS.lock.replace('viewBox','style="width:9px;height:9px;display:inline-block;vertical-align:-1px" viewBox') + ' ' + esc(t("chan_private_badge")) + '</span></p>' +
        '<p class="chan-sub"><span class="chan-type-badge ' + (p.messaging?'messaging':'link') + '">' + (p.messaging ? esc(t("chan_msg_type")) : esc(t("chan_link_type"))) + '</span><span style="color:' + (p.active ? "#34d399" : "#8b8b93") + '">' + (p.active ? esc(t("chan_active")) : esc(t("chan_paused"))) + '</span>' + (channelTarget(p) > 1 ? '<span style="color:var(--text-5)">' + esc(t("chan_daily_target")) + channelTarget(p) + esc(t("chan_per_day")) + '</span>' : '') + (linkedCount > 0 ? '<span style="color:#ff6b78">' + esc(t("chan_linked_campaign")) + linkedCount + esc(t("chan_car_word")) + '</span>' : '') + '</p>' +
        (!p.messaging && p.url ? '<p class="cat-chan-url" style="margin-top:4px">' + esc(p.url) + '</p>' : '') +
        (isPromoteConfirm ? '<p style="font-size:11px;color:var(--sky);margin:6px 0 0;line-height:1.6">' + esc(t("chan_promote_note")) + '</p>' : '') +
      '</div>' +
      '<div class="chan-actions">' +
        '<button class="chan-icon-btn" data-action="toggle-channel-pin" data-channel="' + p.id + '" title="' + (p.pinned ? esc(t("chan_unpin_title")) : esc(t("chan_pin_title"))) + '" style="' + (p.pinned ? 'color:#F5A623;border-color:rgba(245,166,35,.4)' : '') + '">' + ICONS.pin + '</button>' +
        (state.isAdmin ? (isPromoteConfirm ?
          '<button class="chan-icon-btn danger-confirm" data-action="chan-confirm-promote" data-channel="' + p.id + '">' + esc(t("chan_confirm_promote")) + '</button>' :
          '<button class="chan-icon-btn" data-action="chan-ask-promote" data-channel="' + p.id + '" title="' + esc(t("chan_promote_title")) + '">' + ICONS.globe + '</button>'
        ) : '') +
        '<button class="chan-icon-btn" data-action="edit-channel" data-channel="' + p.id + '">' + ICONS.edit + '</button>' +
        '<button class="chan-icon-btn" data-action="toggle-channel-active" data-channel="' + p.id + '">' + (p.active ? ICONS.pause : ICONS.play) + '</button>' +
        (isConfirm ?
          '<button class="chan-icon-btn danger-confirm" data-action="chan-confirm-delete" data-channel="' + p.id + '">' + esc(t("chan_confirm")) + '</button>' :
          '<button class="chan-icon-btn" data-action="chan-ask-delete" data-channel="' + p.id + '">' + ICONS.trash + '</button>'
        ) +
      '</div>' +
    '</div>';
  }

  function chanEditForm(p){
    var linkedCars = carsLinkedToChannel(p.id);
    var linkedNotice = linkedCars.length > 0
      ? '<div style="background:rgba(232,25,44,.12);border:1px solid rgba(232,25,44,.35);border-radius:10px;padding:10px 12px;margin-bottom:10px">' +
          '<p style="margin:0 0 4px;font-size:12px;font-weight:800;color:#ff6b78">' + esc(t("chan_linked_warning")) + linkedCars.length + esc(t("chan_linked_warning_suffix")) + '</p>' +
          '<p style="margin:0;font-size:11.5px;color:var(--text-4);line-height:1.6">' + esc(linkedCars.join(state.lang==="en" ? ", " : '، ')) + '</p>' +
          '<p style="margin:6px 0 0;font-size:11px;color:var(--text-5);line-height:1.6">' + esc(t("chan_linked_rename_note")) + '</p>' +
        '</div>'
      : '';
    return '<div class="chan-editing">' +
      linkedNotice +
      '<div class="chan-add-row" style="margin-bottom:10px">' +
        '<input class="input chan-emoji-input" id="ce-emoji" value="' + esc(channelEditDraft.emoji) + '" maxlength="4" />' +
        '<input class="input" id="ce-label" value="' + esc(channelEditDraft.label) + '" placeholder="' + esc(t("chan_name_field_placeholder")) + '" />' +
      '</div>' +
      '<div class="chan-type-toggle">' +
        '<button class="chan-type-opt' + (!channelEditDraft.messaging?' active':'') + '" data-action="set-edit-channel-type" data-value="0">' + esc(t("chan_link_type")) + '</button>' +
        '<button class="chan-type-opt' + (channelEditDraft.messaging?' active':'') + '" data-action="set-edit-channel-type" data-value="1">' + esc(t("chan_msg_type")) + '</button>' +
      '</div>' +
      (!channelEditDraft.messaging ? '<div style="margin-bottom:10px">' + chanUrlField(p.id, channelEditDraft.url, "ce-url-") + '</div>' : '') +
      chanTargetField(p.id, channelEditDraft.dailyTarget, "ce-target-") +
      chanIntervalField(p.id, channelEditDraft.repostIntervalDays, "ce-interval-") +
      '<p style="font-size:11px;color:var(--text-5);margin:0 0 10px;line-height:1.6">' + esc(t("chan_msg_note")) + '</p>' +
      '<div class="mgmt-actions">' +
        '<button class="mgmt-btn" data-action="cancel-channel-edit">' + esc(t("chan_cancel")) + '</button>' +
        '<button class="mgmt-btn primary" data-action="save-channel-edit" data-channel="' + p.id + '">' + esc(t("chan_save")) + '</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------------- global channels (admin-built, shared with everyone) ---------------- */
  var newGlobalChannelDraft = { emoji:"📣", label:"", url:"", messaging:false, dailyTarget:1, repostIntervalDays:0, country:"egypt" };
  var globalChannelEditDraft = { emoji:"", label:"", url:"", messaging:false, dailyTarget:1, repostIntervalDays:0 };

  function findGlobalChannel(id){
    return state.globalChannels.find(function(g){ return g.id === id; });
  }

  function gAddCard(){
    return '<div class="chan-add-card">' +
      '<p style="margin:0 0 10px;font-size:13px;font-weight:800;color:var(--text-3)">' + esc(t("chan_add_global_title")) + '</p>' +
      '<div class="chan-type-toggle" style="margin-bottom:8px">' +
      COUNTRIES.map(function(c){
        return '<button class="chan-type-opt' + (newGlobalChannelDraft.country===c.id?' active':'') + '" data-action="set-new-gchan-country" data-value="' + c.id + '">' + c.flag + ' ' + esc(state.lang==="en"?c.en:c.ar) + '</button>';
      }).join("") +
      '</div>' +
      '<div class="chan-add-row">' +
        '<input class="input chan-emoji-input" id="new-gchan-emoji" value="' + esc(newGlobalChannelDraft.emoji) + '" maxlength="4" placeholder="🚀" />' +
        '<input class="input" id="new-gchan-label" value="' + esc(newGlobalChannelDraft.label) + '" placeholder="' + esc(t("chan_name_placeholder_global")) + '" />' +
      '</div>' +
      '<div class="chan-type-toggle">' +
        '<button class="chan-type-opt' + (!newGlobalChannelDraft.messaging?' active':'') + '" data-action="set-new-gchan-type" data-value="0">' + esc(t("chan_link_type")) + '</button>' +
        '<button class="chan-type-opt' + (newGlobalChannelDraft.messaging?' active':'') + '" data-action="set-new-gchan-type" data-value="1">' + esc(t("chan_msg_type")) + '</button>' +
      '</div>' +
      (!newGlobalChannelDraft.messaging ? '<div style="margin:8px 0">' + chanUrlField("new", newGlobalChannelDraft.url, "new-gchan-url-") + '</div>' : '') +
      chanTargetField("new", newGlobalChannelDraft.dailyTarget, "new-gchan-target-") +
      chanIntervalField("new", newGlobalChannelDraft.repostIntervalDays, "new-gchan-interval-") +
      '<button class="submit-btn" style="margin-top:6px" data-action="submit-gchan"' + (newGlobalChannelDraft.label.trim() ? '' : ' disabled') + '>' + ICONS.plus.replace('viewBox','style="width:16px;height:16px;display:inline-block;vertical-align:-3px" viewBox') + ' ' + esc(t("chan_add_global_btn")) + '</button>' +
    '</div>';
  }

  function gEditForm(g){
    return '<div class="chan-editing">' +
      '<div class="chan-add-row" style="margin-bottom:10px">' +
        '<input class="input chan-emoji-input" id="ge-emoji" value="' + esc(globalChannelEditDraft.emoji) + '" maxlength="4" />' +
        '<input class="input" id="ge-label" value="' + esc(globalChannelEditDraft.label) + '" placeholder="' + esc(t("chan_name_label")) + '" />' +
      '</div>' +
      (state.isAdmin ?
        '<div class="chan-type-toggle">' +
          '<button class="chan-type-opt' + (!globalChannelEditDraft.messaging?' active':'') + '" data-action="set-edit-gchan-type" data-value="0">' + esc(t("chan_link_type")) + '</button>' +
          '<button class="chan-type-opt' + (globalChannelEditDraft.messaging?' active':'') + '" data-action="set-edit-gchan-type" data-value="1">' + esc(t("chan_msg_type")) + '</button>' +
        '</div>' : ''
      ) +
      (!globalChannelEditDraft.messaging ? '<div style="margin-bottom:10px">' + chanUrlField(g.id, globalChannelEditDraft.url, "ge-url-") + '</div>' : '') +
      chanTargetField(g.id, globalChannelEditDraft.dailyTarget, "ge-target-") +
      chanIntervalField(g.id, globalChannelEditDraft.repostIntervalDays, "ge-interval-") +
      (!state.isAdmin ? '<p style="font-size:11px;color:var(--text-5);margin:0 0 10px;line-height:1.6">' + esc(t("chan_private_edit_note")) + '</p>' : '') +
      '<div class="mgmt-actions">' +
        '<button class="mgmt-btn" data-action="cancel-gchan-edit">' + esc(t("chan_cancel")) + '</button>' +
        (g.overridden ? '<button class="mgmt-btn" data-action="reset-gchan-override" data-channel="' + g.id + '">' + esc(t("chan_restore_default")) + '</button>' : '') +
        '<button class="mgmt-btn primary" data-action="save-gchan-edit" data-channel="' + g.id + '">' + esc(t("chan_save")) + '</button>' +
      '</div>' +
    '</div>';
  }

  function fmtDate(ts){
    if(!ts) return "—";
    var d = new Date(ts);
    return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
  }
  function dateInputVal(ts){
    if(!ts) return "";
    var d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function waDigits(phone){ return String(phone||"").replace(/[^0-9]/g,""); }
  function daysLeft(endTs){
    if(!endTs) return null;
    return Math.ceil((endTs - Date.now()) / 86400000);
  }
  /* شهر قمري حقيقي (نفس يوم الشهر الجاي)، مش 30 يوم ثابتة — لو الشهر
     الجاي أقصر (زي فبراير)، بترجع لآخر يوم فيه بدل ما "تفيض" لشهر
     بعده (31 يناير → 28/29 فبراير، مش 3 مارس). */
  function addOneCalendarMonth(ts){
    var d = new Date(ts);
    var day = d.getDate();
    d.setMonth(d.getMonth() + 1);
    if(d.getDate() !== day) d.setDate(0);
    return d.getTime();
  }
  /* الاشتراك شغال فعليًا بس لو الحالة "active" والتاريخ النهائي (لو
     موجود) لسه ما عداش — فحص بيحصل في جهاز العميل نفسه كل مرة
     يفتح فيها التطبيق، بنفس منطق باقي التطبيق (مفيش سيرفر مركزي). */
  function isMySubscriptionCurrentlyActive(){
    if(state.mySubscriptionStatus !== "active") return false;
    if(state.mySubscriptionEnd && state.mySubscriptionEnd < Date.now()) return false;
    return true;
  }

  /* ---------------- delete member completely (admin) ----------------
     بيمسح كل الكوليكشنز الفرعية بتاعة الحساب وبعدها مستند الحساب نفسه، فيرجع
     كأنه عمره ما سجّل. أول ما العضو يدخل تاني، ensureAccount بيلاقي إنه مش موجود
     وبيعمله حساب جديد "قيد الانتظار". (مستخدم Firebase Auth نفسه بيفضل موجود —
     ده مش بيظهر في التطبيق ومش محتاج مسح.) */
  var ACCOUNT_SUBCOLLECTIONS = ["cars", "publishLog", "platforms", "channelOverrides"];
  function deleteMemberCompletely(accId){
    return Promise.all(ACCOUNT_SUBCOLLECTIONS.map(function(name){
      return getDocs(collection(db, "accounts", accId, name)).then(function(snap){
        return Promise.all(snap.docs.map(function(d){
          return deleteDoc(doc(db, "accounts", accId, name, d.id));
        }));
      });
    })).then(function(){
      return deleteDoc(doc(db, "accounts", accId));
    });
  }

  /* لو العضو المحذوف كان فاتح التطبيق وقت الحذف: نوقف الاستماع لبياناته ونرجّعه كتسجيل جديد */
  var accountRecreating = false;
  function dropDataListeners(){
    if(unsubCars) unsubCars();
    if(unsubPlatforms) unsubPlatforms();
    if(unsubLog) unsubLog();
    if(unsubGlobalChannels) unsubGlobalChannels();
    if(unsubOverrides) unsubOverrides();
    unsubCars = unsubPlatforms = unsubLog = unsubGlobalChannels = unsubOverrides = null;
    dataListenersStarted = false;
    state.cars = []; state.platforms = []; state.log = []; state.channelOverrides = {};
    state.loading = true;
  }

  /* ---------------- pending-approval indicators (admin) ---------------- */
  var seenPendingIds = null, seenTrialIds = null, pendingBaselineFromServer = false, lastBadgeCount = -1;

  function pendingAccounts(){
    return state.adminAccounts.filter(function(a){ return a.subscriptionStatus === "pending"; });
  }
  function pendingCount(){ return state.isAdmin ? pendingAccounts().length : 0; }

  /* عنوان التاب + بادج أيقونة التطبيق (لو متثبت PWA) بيعكسوا عدد الطلبات المعلّقة */
  function syncPendingIndicators(){
    var n = pendingCount();
    if(n === lastBadgeCount) return;
    lastBadgeCount = n;
    document.title = (n ? "(" + n + ") " : "") + "Lam7Track";
    try{
      if(n && navigator.setAppBadge){ var r = navigator.setAppBadge(n); if(r && r.catch) r.catch(function(){}); }
      else if(!n && navigator.clearAppBadge){ var r2 = navigator.clearAppBadge(); if(r2 && r2.catch) r2.catch(function(){}); }
    }catch(_){ /* غير مدعوم — عادي */ }
  }

  function trialAccounts(){
    return state.adminAccounts.filter(function(a){ return a.isTrial && a.subscriptionStatus === "active"; });
  }

  /* تنبيه لحظي لما يوصل طلب اشتراك جديد (المسار القديم، لسه ممكن
     يحصل لو أدمن رجّع حساب لحالة pending يدويًا) أو عضو تجريبي جديد
     سجّل دلوقتي وإنت فاتح التطبيق. بنتجاهل أول لقطة من الكاش/السيرفر
     عشان ما نطلّعش تنبيه على حسابات قديمة. */
  function notifyNewPending(snap){
    var pend = pendingAccounts();
    var ids = {};
    pend.forEach(function(a){ ids[a.id] = true; });

    var trials = trialAccounts();
    var trialIds = {};
    trials.forEach(function(a){ trialIds[a.id] = true; });

    var fromCache = !!(snap && snap.metadata && snap.metadata.fromCache);
    if(!fromCache){
      if(pendingBaselineFromServer && seenPendingIds){
        var fresh = pend.filter(function(a){ return !seenPendingIds[a.id]; });
        if(fresh.length){
          showToast(state.lang==="en"
            ? "🔔 " + (fresh.length === 1
                ? "New subscription request: " + (fresh[0].displayName || fresh[0].email || "New member")
                : fresh.length + " new subscription requests awaiting your approval")
            : "🔔 " + (fresh.length === 1
                ? "طلب اشتراك جديد: " + (fresh[0].displayName || fresh[0].email || "عضو جديد")
                : fresh.length + " طلبات اشتراك جديدة بتستنى موافقتك"), 4500);
        }
        var freshTrials = trials.filter(function(a){ return !seenTrialIds[a.id]; });
        if(freshTrials.length){
          showToast("🎉 " + (freshTrials.length === 1
            ? t("new_trial_single") + (freshTrials[0].displayName || freshTrials[0].email || "")
            : freshTrials.length + t("new_trial_plural")), 4500);
        }
      }
      pendingBaselineFromServer = true;
    }
    seenPendingIds = ids;
    seenTrialIds = trialIds;
  }

  /* ---------------- bulk email broadcast (admin) ---------------- */
  var BC_AUDIENCES = [
    { id:"all" },
    { id:"active" },
    { id:"pending" },
    { id:"inactive" },
    { id:"expiring" }
  ];
  function bcAudienceLabel(id){ return t("bc_aud_" + id); }
  var BC_SIZES = [20, 30, 50, 100];
  var BC_MAX_URL = 6000;
  var EMAIL_RE = /^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/;
  var bcDraft = { audience:"all", subject:"", body:"", method:"gmail", batchSize:30, sent:{} };

  function bcMatches(acc, aud){
    var st = acc.subscriptionStatus;
    if(aud === "all") return true;
    if(aud === "active") return st === "active";
    if(aud === "pending") return st === "pending";
    if(aud === "inactive") return st !== "active" && st !== "pending";
    if(aud === "expiring"){
      var dl = daysLeft(acc.subscriptionEnd);
      return st === "active" && dl !== null && dl <= 7;
    }
    return false;
  }

  /* إيميلات فريدة وصحيحة الشكل، من غير إيميل الأدمن (هو خانة "إلى") */
  function bcRecipients(aud){
    var me = ((currentUser && currentUser.email) || "").toLowerCase();
    var seen = {}, out = [];
    state.adminAccounts.forEach(function(a){
      var em = String(a.email || "").trim().toLowerCase();
      if(!em || em === me || seen[em] || !EMAIL_RE.test(em)) return;
      if(!bcMatches(a, aud)) return;
      seen[em] = true;
      out.push(em);
    });
    return out;
  }

  function bcBatches(list, size){
    var out = [];
    for(var i = 0; i < list.length; i += size) out.push(list.slice(i, i + size));
    return out;
  }

  function bcEncEmail(e){ return encodeURIComponent(e).replace(/%40/g, "@"); }

  function bcBuildUrl(method, to, bccList, subject, body){
    var bcc = bccList.map(bcEncEmail).join(",");
    function make(withBody){
      if(method === "mailto"){
        return "mailto:" + bcEncEmail(to || "") + "?bcc=" + bcc +
          "&subject=" + encodeURIComponent(subject) +
          (withBody ? "&body=" + encodeURIComponent(body.replace(/\r?\n/g, "\r\n")) : "");
      }
      return "https://mail.google.com/mail/?view=cm&fs=1&to=" + bcEncEmail(to || "") + "&bcc=" + bcc +
        "&su=" + encodeURIComponent(subject) +
        (withBody ? "&body=" + encodeURIComponent(body) : "");
    }
    var full = make(true);
    if(full.length <= BC_MAX_URL) return { url: full, bodyIncluded: true };
    return { url: make(false), bodyIncluded: false };
  }

  function openMailUrl(url, method){
    var a = document.createElement("a");
    a.href = url;
    if(method !== "mailto"){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function legacyCopy(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(_){ return false; }
  }
  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }

  function bcSyncDraftFromDom(){
    var sEl = document.getElementById("bc-subject");
    var bEl = document.getElementById("bc-body");
    if(sEl) bcDraft.subject = sEl.value;

    var summary = recips.length

      : '<div class="bc-summary empty">' + esc(t("bc_no_emails")) + '</div>';

    var batchRows = batches.map(function(b, i){
      var sent = !!bcDraft.sent[i];
      return '<div class="bc-batch' + (sent ? ' sent' : '') + '">' +
        '<div><div class="bc-batch-title">' + (batches.length > 1 ? esc(t("bc_batch_prefix")) + (i + 1) + esc(t("bc_batch_of")) + batches.length : esc(t("bc_batch_message_word"))) + '</div>' +
        '<div class="bc-batch-sub"><span class="num-ltr">' + b.length + '</span>' + esc(t("bc_recipient_word")) + (sent ? esc(t("bc_opened_mark")) : '') + '</div></div>' +
        '<button class="bc-batch-btn" data-action="bc-open-batch" data-index="' + i + '">' + ICONS.send + (sent ? esc(t("bc_open_again")) : esc(t("bc_open_send"))) + '</button>' +
      '</div>';
    }).join("");

    return '<div class="pm-backdrop' + (anim ? '' : ' bc-still') + '" data-action="bc-backdrop">' +
      '<div class="pm-sheet bc-sheet">' +
        '<div class="pm-handle"></div>' +
        '<p class="pm-title">' + esc(t("bc_modal_title")) + '</p>' +
        '<p class="pm-sub">' + esc(t("bc_modal_sub")) + '</p>' +

        '<p class="bc-label" style="margin-top:4px">' + esc(t("bc_label_audience")) + '</p>' +
        '<div class="bc-chips">' + audChips + '</div>' +

        '<p class="bc-label">' + esc(t("bc_label_subject")) + '</p>' +
        '<input class="bc-field" id="bc-subject" dir="auto" maxlength="200" placeholder="' + esc(t("bc_subject_placeholder")) + '" value="' + esc(bcDraft.subject) + '" />' +

        '<p class="bc-label">' + esc(t("bc_label_body")) + '</p>' +
        '<textarea class="bc-field" id="bc-body" dir="auto" rows="6" placeholder="' + esc(t("bc_body_placeholder")) + '">' + esc(bcDraft.body) + '</textarea>' +

        '<p class="bc-label">' + esc(t("bc_label_open_from")) + '</p>' +
        '<div class="bc-chips">' + methodChips + '</div>' +

        '<p class="bc-label">' + esc(t("bc_label_batch_size")) + '</p>' +
        '<div class="bc-chips">' + sizeChips + '</div>' +

        summary + batchRows +
        '<p class="bc-note">' + esc(t("bc_note")) + '</p>' +

        '<div class="pm-actions">' +
          '<button class="pm-skip" data-action="bc-copy-emails">' + esc(t("bc_copy_emails")) + '</button>' +
          '<button class="pm-skip" data-action="bc-copy-body">' + esc(t("bc_copy_body")) + '</button>' +
          '<button class="pm-confirm" data-action="bc-close">' + esc(t("bc_done")) + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

        '<span><span class="bc-entry-t1">' + esc(t("legacy_cleanup_entry_title")) + '</span><span class="bc-entry-t2">' + esc(t("legacy_cleanup_entry_sub")) + '</span></span>' +
        '<span class="bc-entry-go">‹</span>' +

      var chips = [["all", t("sub_all")], ["pending", t("sub_pending_chip")], ["active", t("sub_active_chip")], ["inactive", t("sub_inactive_chip")]].map(function(f){

  function splashHtml(){
    /* اللوجو نفسه فيه كلمة "Lam7Track" مرسومة جواه، فمفيش داعي نكررها
       تاني كنص HTML تحته — عشان كده هنا بس العنوان الفرعي والسلوجان. */
    return '<div class="splash-wrap">' +
      '<div class="splash-logo"><img src="logo.png" alt="Lam7Track" style="width:100%;height:auto;display:block" /></div>' +
      '<p class="splash-sub" style="margin-top:16px">' + esc(t("splash_subtitle")) + '</p>' +
      '<p class="splash-tagline">' + t("splash_tagline") + '</p>' +

    if(!state.isAdmin && !isMySubscriptionCurrentlyActive()){

    if(state.loading){

    var html = statusBanner() + installCardHtml() + migrationBanner();

    else if(state.tab === "channels") html += screenChannels();

  /* ---------------- event delegation ---------------- */
  document.getElementById("app").addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "switch-tab"){
      state.tab = el.getAttribute("data-value");
      state.confirmDeleteId = null;
      state.editingId = null;
      state.editingChannelId = null;
      state.editingGlobalChannelId = null;
      state.showAddCarForm = false;
      state.publishModal = null;
      state.editingPropertyId = null;
      state.editingPropertyChannelId = null;
      state.showAddPropertyForm = false;
      if(state.tab === "marketplace"){ if(state.domain === "property") maybeStartPropertyMarketplaceListening(); else maybeStartMarketplaceListening(); }
      render();
    } else if(action === "publish"){
      markPublished(el.getAttribute("data-car"), el.getAttribute("data-platform"));
    } else if(action === "publish-with-link"){
      openPublishModal(el.getAttribute("data-car"), el.getAttribute("data-platform"), null);
    } else if(action === "register-campaign"){
      var rcCar = el.getAttribute("data-car");
      var rcPlatform = el.getAttribute("data-platform");
      var qtyEl = document.getElementById("camp-qty-" + rcPlatform + "-" + rcCar);
      var qtyVal = qtyEl ? parseInt(qtyEl.value, 10) : NaN;
      if(!qtyVal || qtyVal <= 0){
        /* مجموعات فيس بوك لازم كمية واضحة (عدد الأعضاء/المنشورات الفعلي)
           لأنها بتتفاوت كتير من مجموعة لمجموعة، فمينفعش نفترضها ١
           زي باقي القنوات. باقي القنوات لو الخانة فاضية، بنعتبرها ١
           تلقائيًا بدل ما نوقف المستخدم. */
        var rcMeta = effectiveChannels().find(function(c){ return c.id === rcPlatform; });
        if(isFacebookGroupsChannel(rcMeta)){ showToast(state.lang==="en" ? "Enter a valid quantity for Facebook groups" : "دخّل كمية صحيحة لمجموعات فيس بوك"); return; }
        qtyVal = 1;
      }
      registerCampaignProgress(rcCar, rcPlatform, qtyVal);
    } else if(action === "register-campaign-with-link"){
      var rcCar2 = el.getAttribute("data-car");
      var rcPlatform2 = el.getAttribute("data-platform");
      var qtyEl2 = document.getElementById("camp-qty-" + rcPlatform2 + "-" + rcCar2);
      var qtyVal2 = qtyEl2 ? parseInt(qtyEl2.value, 10) : NaN;
      if(!qtyVal2 || qtyVal2 <= 0){
        var rcMeta2 = effectiveChannels().find(function(c){ return c.id === rcPlatform2; });
        if(isFacebookGroupsChannel(rcMeta2)){ showToast(state.lang==="en" ? "Enter a valid quantity for Facebook groups" : "دخّل كمية صحيحة لمجموعات فيس بوك"); return; }
        qtyVal2 = 1;
      }
      openPublishModal(rcCar2, rcPlatform2, qtyVal2);
    } else if(action === "publish-modal-skip"){
      finalizePublishModal(false);
    } else if(action === "publish-modal-confirm"){
      finalizePublishModal(true);
    } else if(action === "publish-modal-backdrop"){
      if(e.target === el) finalizePublishModal(false); // only closes on a tap outside the sheet
    } else if(action === "ask-delete"){
      state.confirmDeleteId = el.getAttribute("data-car");
      render();
    } else if(action === "confirm-delete"){
      removeCar(el.getAttribute("data-car"));
    } else if(action === "set-priority"){
      formDraft.priority = el.getAttribute("data-value");
      render();
    } else if(action === "toggle-form-channel"){
      var tfcId = el.getAttribute("data-value");
      if(formDraft.selectedChannels[tfcId]){
        delete formDraft.selectedChannels[tfcId];
        delete formDraft.campaign[tfcId];
      } else {
        formDraft.selectedChannels[tfcId] = true;
      }
      render();
    } else if(action === "submit-car"){
      if(formDraft.name.trim().length === 0) return;
      var campaignObj = {};
      Object.keys(formDraft.campaign).forEach(function(pid){
        if(!formDraft.selectedChannels[pid]) return;
        var n = parseInt(formDraft.campaign[pid], 10);
        if(n > 0) campaignObj[pid] = { target: n, done: 0 };
      });
      addCar(formDraft.name, formDraft.adLink, formDraft.notes, formDraft.priority, campaignObj);
      formDraft = { name:"", adLink:"", notes:"", priority:"medium", selectedChannels:{}, campaign:{} };
      state.showAddCarForm = false;

      var roId = el.getAttribute("data-channel");
      state.editingGlobalChannelId = null;
      deleteDoc(doc(db, "accounts", currentUser.uid, "channelOverrides", roId)).then(function(){
        showToast(state.lang==="en" ? "Restored to default" : "تم الاسترجاع للافتراضي");
      }).catch(function(err){
        console.error("reset-gchan-override error:", err);
        showToast(state.lang==="en" ? "Failed — check your connection" : "فشل — تحقق من الاتصال");
      });
      render();
    } else if(action === "toggle-gchan-active"){
      if(!state.isAdmin) return;
      var tgId = el.getAttribute("data-channel");
      var tgChan = findGlobalChannel(tgId);
      if(!tgChan) return;
      updateDoc(doc(db, "globalChannels", tgId), { active: !tgChan.active }).catch(function(err){
        console.error("toggle-gchan-active error:", err);
        showToast(state.lang==="en" ? "Update failed — check your connection" : "فشل التحديث — تحقق من الاتصال");
      });
    } else if(action === "toggle-gchan-pin"){
      /* التثبيت هنا شخصي لكل حساب — متاح للأدمن وللمشتركين كلهم، وبيتخزن
         كـ override خاص بالحساب مش على القناة العامة نفسها، عشان تثبيت
         عميل لقناة معينة ميأثرش على ترتيب باقي العملاء ولا على دورة
         النشر خالص (effectiveChannels() بيفضل يرتب بالـ order العادي). */
      var pinGId = el.getAttribute("data-channel");
      var gChanForPin = findGlobalChannel(pinGId);
      if(!gChanForPin) return;
      var curOv = state.channelOverrides[pinGId] || {};
      var curPinned = curOv.pinned !== undefined ? curOv.pinned : !!gChanForPin.pinned;
      var newPinned = !curPinned;
      var prevOvForPin = state.channelOverrides[pinGId] ? Object.assign({}, state.channelOverrides[pinGId]) : null;
      state.channelOverrides = Object.assign({}, state.channelOverrides);
      state.channelOverrides[pinGId] = Object.assign({}, curOv, { pinned: newPinned });
      render();
      setDoc(doc(db, "accounts", currentUser.uid, "channelOverrides", pinGId), { pinned: newPinned }, { merge: true }).catch(function(err){
        console.error("toggle-gchan-pin error:", err);
        state.channelOverrides = Object.assign({}, state.channelOverrides);
        if(prevOvForPin) state.channelOverrides[pinGId] = prevOvForPin; else delete state.channelOverrides[pinGId];
        showToast(state.lang==="en" ? "⚠️ Pin failed — check your connection" : "⚠️ فشل التثبيت — تحقق من الاتصال");
        render();
      });
    } else if(action === "gchan-ask-delete"){
      if(!state.isAdmin) return;
      state.confirmDeleteId = "gchan:" + el.getAttribute("data-channel");
      render();
    } else if(action === "gchan-confirm-delete"){
      if(!state.isAdmin) return;
      var delGId = el.getAttribute("data-channel");
      state.confirmDeleteId = null;
      deleteDoc(doc(db, "globalChannels", delGId)).catch(function(err){
        console.error("gchan-confirm-delete error:", err);
        showToast(state.lang==="en" ? "Delete failed — check your connection" : "فشل الحذف — تحقق من الاتصال");
      });
      render();
    } else if(action === "google-signin"){
      state.authError = null;
      signInWithPopup(auth, googleProvider).catch(function(err){
        console.error("popup signin error:", err);
        if(err && err.code === "auth/popup-blocked"){
          state.authError = "المتصفح منع نافذة تسجيل الدخول. اسمح بالنوافذ المنبثقة (popups) لهذا الموقع وحاول تاني.";
        } else if(err && err.code === "auth/unauthorized-domain"){
          state.authError = "الدومين ده مش مسموح بيه في إعدادات Firebase. لازم تضيفه في Authentication → Settings → Authorized domains.";
        } else if(err && err.code === "auth/popup-closed-by-user" || err && err.code === "auth/cancelled-popup-request"){
          /* the user closed the popup themselves — no need to show an error */
        } else if(err && err.code) {
          state.authError = "حصل خطأ أثناء تسجيل الدخول (" + err.code + "). حاول تاني.";
        }
        render();
      });
    } else if(action === "toggle-account-menu"){
      state.showAccountMenu = !state.showAccountMenu;
      render();
    } else if(action === "toggle-lang"){
      state.showAccountMenu = false;
      setLang(state.lang === "en" ? "ar" : "en");
    } else if(action === "toggle-domain"){
      setDomain(state.domain === "property" ? "car" : "property");
    } else if(action === "open-profile"){
      state.showAccountMenu = false;
      profileDraft = Object.assign({}, state.myProfile);
      state.showProfileScreen = true;
      render();
    } else if(action === "profile-close"){
      if(e.target !== el) return;
      state.showProfileScreen = false;
      render();
    } else if(action === "set-profile-car-role"){
      profileDraft.carRole = el.getAttribute("data-value");
      render();
    } else if(action === "set-profile-property-role"){
      profileDraft.propertyRole = el.getAttribute("data-value");
      render();
    } else if(action === "profile-save"){
      if(!currentUser) return;
      var pFirstEl = document.getElementById("pf-first-name");
      var pLastEl = document.getElementById("pf-last-name");
      var pDobEl = document.getElementById("pf-dob");
      var pBioEl = document.getElementById("pf-bio");
      var pJobEl = document.getElementById("pf-current-job");
      var pPrevEl = document.getElementById("pf-previous-jobs");
      var newProfile = {
        firstName: pFirstEl ? pFirstEl.value.trim() : "",
        lastName: pLastEl ? pLastEl.value.trim() : "",
        dob: pDobEl ? pDobEl.value : "",
        bio: pBioEl ? pBioEl.value.trim().slice(0,150) : "",
        currentJob: pJobEl ? pJobEl.value.trim() : "",
        previousJobs: pPrevEl ? pPrevEl.value.trim() : "",
        carRole: profileDraft.carRole,
        propertyRole: profileDraft.propertyRole
      };
      state.myProfile = newProfile;
      state.showProfileScreen = false;
      render();
      updateDoc(doc(db, "accounts", currentUser.uid), { profile: newProfile }).then(function(){
        showToast(t("profile_saved"));
      }).catch(function(err){
        console.error("profile-save error:", err);
        showToast(state.lang==="en" ? "Save failed — check your connection" : "فشل الحفظ — تحقق من الاتصال");
      });
    } else if(action === "set-country"){
      var chosenCountry = el.getAttribute("data-value");
      if(!chosenCountry || !currentUser) return;
      updateDoc(doc(db, "accounts", currentUser.uid), { country: chosenCountry }).then(function(){
        state.myCountry = chosenCountry;
        state.showCountryPicker = false;
        render();
      }).catch(function(err){
        console.error("set-country error:", err);
        showToast(state.lang === "en" ? "Failed to save — check your connection" : "فشل الحفظ — تحقق من الاتصال");
      });
    } else if(action === "sign-out"){
      state.showAccountMenu = false;
      signOut(auth).catch(function(err){ console.error("signout error:", err); });
    } else if(action === "pending-send-whatsapp"){
      var pendPhoneEl = document.getElementById("pending-phone");
      var pendPhone = pendPhoneEl ? pendPhoneEl.value.trim() : "";
      pendingPhoneDraft = pendPhone;
      var u2 = currentUser || {};
      var waMsg = state.lang === "en"
        ? ("Hello, my name is " + (u2.displayName || "-") +
           "\nEmail: " + (u2.email || "-") +
           (pendPhone ? "\nPhone: " + pendPhone : "") +
           "\nPlease activate my subscription on Lam7Track.")
        : ("مرحبًا، اسمي " + (u2.displayName || "-") +
           "\nبريدي الإلكتروني: " + (u2.email || "-") +
           (pendPhone ? "\nرقم الهاتف: " + pendPhone : "") +
           "\nبرجاء تفعيل اشتراكي في نظام Lam7Track.");
      var waUrl = "https://wa.me/" + ADMIN_WHATSAPP + "?text=" + encodeURIComponent(waMsg);
      window.open(waUrl, "_blank", "noopener");
      if(pendPhone && currentUser){
        updateDoc(doc(db, "accounts", currentUser.uid), { phone: pendPhone }).catch(function(err){
          console.error("save pending phone error:", err);
        });
      }
    } else if(action === "run-migration"){
      runMigration();
    } else if(action === "dismiss-migration"){
      state.migrationAvailable = false;
      render();
    } else if(action === "install-app-now"){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(choice){
        deferredInstallPrompt = null;
        state.showInstallCard = false;
        if(choice && choice.outcome !== "accepted"){
          localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now()));
        }
        render();
      });
    } else if(action === "install-ios-toggle"){
      state.showIOSInstallSteps = !state.showIOSInstallSteps;
      render();
    } else if(action === "install-app-dismiss"){
      state.showInstallCard = false;
      state.showIOSInstallSteps = false;
      localStorage.setItem(INSTALL_DISMISS_KEY, String(Date.now()));
      render();
    } else if(action === "toggle-alerts"){
      state.showAllAlerts = !state.showAllAlerts;
      render();
    } else if(action === "toggle-done-section"){
      state.doneSectionExpanded = !state.doneSectionExpanded;
      render();
    } else if(action === "toggle-subscription"){
      if(!state.isAdmin) return;
      var subAccId = el.getAttribute("data-account");
      var subCurrent = el.getAttribute("data-current");
      var subNext = subCurrent === "active" ? "inactive" : "active";
      var subUpdate = { subscriptionStatus: subNext };
      if(subCurrent === "pending" && subNext === "active"){
        /* تفعيل عضو جديد لأول مرة: تاريخ البداية = دلوقتي، والنهاية بعد شهر بالظبط،
           وبعدين الأدمن يقدر يعدّلهم يدويًا من زرار التعديل (sub-edit). كمان بنصفّر
           فلاج "اترسلتله رسالة تفعيل" عشان الفقاعة الحمرا تفضل شغالة كتذكير. */
        var newSubStart = Date.now();
        var newSubEndDate = new Date(newSubStart);
        newSubEndDate.setMonth(newSubEndDate.getMonth() + 1);
        subUpdate.subscriptionStart = newSubStart;
        subUpdate.subscriptionEnd = newSubEndDate.getTime();
        subUpdate.welcomeMsgSent = false;
      }
      updateDoc(doc(db, "accounts", subAccId), subUpdate).then(function(){
        showToast(subNext === "active" ? "تم تفعيل الاشتراك" : "تم إيقاف الاشتراك");
      }).catch(function(err){
        console.error("toggle-subscription error:", err);
        showToast(state.lang==="en" ? "Update failed — check Firestore Rules permissions" : "فشل التحديث — تحقق من صلاحيات Firestore Rules");
      });
    } else if(action === "mark-welcome-sent"){
      /* الزرار ده رابط <a> عادي (واتساب أو جيميل) وهيفتح تبويب جديد بشكل طبيعي —
         إحنا هنا بس بنسجّل إن الأدمن ضغط عليه، عشان نطفي الفقاعة الحمرا. مفيش
         preventDefault هنا فالتنقل هيحصل عادي جنبًا لجنب. */
      if(!state.isAdmin) return;
      var wsAccId = el.getAttribute("data-account");
      var wsAcc = state.adminAccounts.find(function(a){ return a.id === wsAccId; });
      if(wsAcc) wsAcc.welcomeMsgSent = true;
      render();
      updateDoc(doc(db, "accounts", wsAccId), { welcomeMsgSent: true }).catch(function(err){
        console.error("mark-welcome-sent error:", err);
      });
    } else if(action === "sub-edit"){
      if(!state.isAdmin) return;
      var subEditId = el.getAttribute("data-account");
      var subAcc = state.adminAccounts.find(function(a){ return a.id === subEditId; });
      if(!subAcc) return;
      var defaultStartTs = subAcc.subscriptionStart || subAcc.createdAt || Date.now();
      var defaultEndTs = subAcc.subscriptionEnd || (defaultStartTs + 30*86400000);
      subEditDraft = {
        start: dateInputVal(defaultStartTs),
        end: dateInputVal(defaultEndTs),
        phone: subAcc.phone || "20"
      };
      state.editingSubId = subEditId;
      render();
    } else if(action === "sub-cancel-edit"){
      state.editingSubId = null;
      render();
    } else if(action === "sub-save"){
      if(!state.isAdmin) return;
      var saveSubId = el.getAttribute("data-account");
      var startEl = document.getElementById("se-start");
      var endEl = document.getElementById("se-end");
      var phoneEl = document.getElementById("se-phone");
      var startVal = startEl && startEl.value ? new Date(startEl.value + "T00:00:00").getTime() : null;
      var endVal = endEl && endEl.value ? new Date(endEl.value + "T00:00:00").getTime() : null;
      state.editingSubId = null;
      updateDoc(doc(db, "accounts", saveSubId), {
        subscriptionStart: startVal,
        subscriptionEnd: endVal,
        phone: phoneEl ? phoneEl.value.trim() : "",
        isTrial: false /* الأدمن عدّل التواريخ يدويًا، يبقى مش تجريبي تلقائي بقى */
      }).then(function(){
        showToast(state.lang==="en" ? "Subscription data saved" : "تم حفظ بيانات الاشتراك");
      }).catch(function(err){
        console.error("sub-save error:", err);
        showToast(state.lang==="en" ? "Save failed — check your connection" : "فشل الحفظ — تحقق من الاتصال");
      });
      render();
    } else if(action === "sub-ask-delete"){
      if(!state.isAdmin) return;
      var askId = el.getAttribute("data-account");
      if(!askId || (currentUser && askId === currentUser.uid)) return;
      state.confirmSubDeleteId = askId;
      state.editingSubId = null;
      render();
    } else if(action === "sub-cancel-delete"){
      state.confirmSubDeleteId = null;
      render();
    } else if(action === "sub-confirm-delete"){
      if(!state.isAdmin || state.deletingSubId) return;
      var delMemberId = el.getAttribute("data-account");
      if(!delMemberId || (currentUser && delMemberId === currentUser.uid)) return;
      state.deletingSubId = delMemberId;
      state.confirmSubDeleteId = null;
      render();
      deleteMemberCompletely(delMemberId).then(function(){
        state.deletingSubId = null;
        showToast(state.lang==="en" ? "Member permanently deleted" : "تم حذف العضو نهائيًا");
      }).catch(function(err){
        console.error("delete-member error:", err);
        state.deletingSubId = null;
        showToast(state.lang==="en" ? "Delete failed — check Firestore Rules permissions" : "فشل الحذف — تحقق من صلاحيات Firestore Rules", 4500);
      });
    } else if(action === "sub-filter"){
      state.subFilter = el.getAttribute("data-value") || "all";
      state.editingSubId = null;
      render();
    } else if(action === "bc-open"){
      if(!state.isAdmin) return;
      bcDraft.sent = {};
      state.bcModal = true;
      state.bcAnimate = true;
      render();
    } else if(action === "bc-close"){
      bcSyncDraftFromDom();
      state.bcModal = false;
      render();
    } else if(action === "legacy-cleanup-open"){
      if(!state.isAdmin) return;
      state.legacyCleanupOpen = true;
      state.legacyCleanup = null;
      state.legacyCleanupSelections = {};
      scanLegacyCleanup();
      render();
    } else if(action === "legacy-cleanup-close"){
      if(e.target !== el) return;
      state.legacyCleanupOpen = false;
      state.legacyCleanup = null;
      render();
    } else if(action === "legacy-cleanup-toggle"){
      var lcAccId = el.getAttribute("data-account");
      state.legacyCleanupSelections[lcAccId] = !!el.checked;
    } else if(action === "legacy-cleanup-run"){
      runLegacyCleanup();
    } else if(action === "bc-backdrop"){
      if(e.target === el){
        bcSyncDraftFromDom();
        state.bcModal = false;
        render();
      }
    } else if(action === "bc-audience"){
      bcSyncDraftFromDom();
      bcDraft.audience = el.getAttribute("data-value") || "all";
      bcDraft.sent = {};
      render();
    } else if(action === "bc-method"){
      bcSyncDraftFromDom();
      bcDraft.method = el.getAttribute("data-value") === "mailto" ? "mailto" : "gmail";
      render();
    } else if(action === "bc-size"){
      bcSyncDraftFromDom();
      bcDraft.batchSize = parseInt(el.getAttribute("data-value"), 10) || 30;
      bcDraft.sent = {};
      render();
    } else if(action === "bc-copy-emails"){
      if(!state.isAdmin) return;
      bcSyncDraftFromDom();
      var bcAll = bcRecipients(bcDraft.audience);
      if(!bcAll.length){ showToast(state.lang==="en" ? "No emails in this category" : "مفيش إيميلات في الفئة دي"); return; }
      copyText(bcAll.join(", ")).then(function(ok){
        showToast(ok ? "تم نسخ " + bcAll.length + " إيميل" : "تعذّر النسخ — جرّب من متصفح تاني");
      });
    } else if(action === "bc-copy-body"){
      if(!state.isAdmin) return;
      bcSyncDraftFromDom();
      var bcText = (bcDraft.subject.trim() ? bcDraft.subject.trim() + "\n\n" : "") + bcDraft.body.trim();
      if(!bcText){ showToast(state.lang==="en" ? "Write the message first" : "اكتب الرسالة الأول"); return; }
      copyText(bcText).then(function(ok){
        showToast(ok ? "تم نسخ الرسالة" : "تعذّر النسخ — جرّب من متصفح تاني");
      });
    } else if(action === "bc-open-batch"){
      if(!state.isAdmin) return;
      bcSyncDraftFromDom();
      var bcIdx = parseInt(el.getAttribute("data-index"), 10);
      var bcBatch = bcBatches(bcRecipients(bcDraft.audience), bcDraft.batchSize)[bcIdx];
      if(!bcBatch) return;
      var bcSubj = bcDraft.subject.trim();
      var bcMsg = bcDraft.body.trim();
      if(!bcSubj || !bcMsg){ showToast(state.lang==="en" ? "Write the subject and message first" : "اكتب الموضوع ونص الرسالة الأول"); return; }
      var built = bcBuildUrl(bcDraft.method, currentUser && currentUser.email, bcBatch, bcSubj, bcMsg);
      bcDraft.sent[bcIdx] = true;
      openMailUrl(built.url, bcDraft.method);
      if(built.bodyIncluded){
        render();
      } else {
        copyText(bcMsg).then(function(ok){
          showToast(ok ? "الرسالة طويلة — اتنسخت، الصقها في نص الإيميل" : "الرسالة طويلة — انسخها من زر (نسخ الرسالة)", 4000);
        });
      }
    }
  });

  syncHtmlDir();
  render();
})();
</script>
</body>
</html>
