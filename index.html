<style>
  :root{
    --ink-950:#0a0a0c; --ink-900:#0d0d0d; --ink-850:#141417; --ink-800:#1a1a1f;
    --ink-700:#232329; --ink-600:#2e2e36; --ink-500:#3f3f49;
    --text-1:#f2f1ef; --text-2:#c9c9ce; --text-3:#a9a9b0; --text-4:#8a8a92; --text-5:#6c6c74;
    --red:#E8192C; --red-dark:#B01121; --gold:#F5A623;
    --green:#34d399; --sky:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink-900); color:var(--text-1);
    font-family:'Cairo',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none; line-height:1.5; font-size:15px;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px;}
  a{color:inherit}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-600); border-radius:999px;}

  /* topbar */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(13,13,13,.88); backdrop-filter:blur(14px); border-bottom:1px solid var(--ink-700);}
  .topbar-inner{max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; display:flex; align-items:center; gap:12px;}
  .logo{width:36px; height:36px; border-radius:11px; background:var(--ink-900); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); padding:4px; overflow:hidden;}
  .logo span{color:#fff; font-weight:900; font-size:14px;}
  .logo img{width:100%; height:100%; object-fit:contain;}
  .topbar h1{font-size:17px; font-weight:800; margin:0; line-height:1.2; color:#fff;}
  .topbar p{font-size:13.5px; color:var(--text-4); margin:2px 0 0;}

  .content{padding:16px;}

  /* bottom nav */
  .bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(13,13,13,.92); backdrop-filter:blur(14px); border-top:1px solid var(--ink-700); padding-bottom:env(safe-area-inset-bottom);}
  .bottomnav-inner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr);}
  .navbtn{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:9px 0 7px; color:var(--text-5); transition:transform .1s;}
  .navbtn:active{transform:scale(.93);}
  .navbtn.active{color:var(--red);}
  .navbtn .bar{position:absolute; top:0; width:32px; height:2px; border-radius:2px; background:var(--red);}
  .navbtn svg{width:19px; height:19px;}
  .navbtn span{font-size:11px; font-weight:700;}

  /* cards */
  .card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6); overflow:hidden;}
  .slot{margin-bottom:12px; animation:rise .28s ease-out;}
  .slot-bar{height:4px; width:100%;}
  .slot-body{padding:16px;}
  .slot-head{display:flex; align-items:center; gap:10px;}
  .platform-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .slot-label{font-size:14px; font-weight:700; color:var(--text-2); flex:1; min-width:0;}
  .prio-badge{font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; border:1px solid; flex-shrink:0; white-space:nowrap;}
  .car-name{font-size:19px; font-weight:800; color:#fff; margin:12px 0 0; line-height:1.35;}
  .car-notes{display:flex; gap:6px; align-items:flex-start; font-size:14px; color:var(--text-3); margin-top:5px; line-height:1.4;}
  .fresh-pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:800; margin-top:12px;}
  .fresh-dot{width:6px; height:6px; border-radius:999px;}
  .slot-actions{display:flex; gap:8px; margin-top:16px;}
  .btn-link{display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 15px; font-size:14px; font-weight:700; color:var(--text-2); flex-shrink:0; transition:transform .1s;}
  .btn-link:active{transform:scale(.95);}
  .btn-goto{display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid rgba(232,25,44,.4); background:rgba(232,25,44,.1); padding:13px 15px; font-size:14px; font-weight:800; color:var(--red); flex-shrink:0; transition:transform .1s;}
  .btn-goto:active{transform:scale(.95);}
  .btn-publish{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--red); padding:13px 16px; font-size:15.5px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .btn-publish:active{transform:scale(.95);}
  .empty-slot{border:1.5px dashed var(--ink-600); border-radius:16px; padding:22px; text-align:center; background:rgba(20,20,23,.4); margin-bottom:12px;}
  .empty-slot .platform-icon{margin:0 auto;}
  .empty-slot p{margin:8px 0 0;}
  .empty-slot .t1{font-size:14.5px; font-weight:800; color:#fff;}
  .empty-slot .t2{font-size:13.5px; color:var(--text-4); margin-top:3px;}

  /* daily plan progress */
  .progress-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .progress-card.all-done{border-color:rgba(52,211,153,.4); background:linear-gradient(135deg, rgba(52,211,153,.08), var(--ink-850));}
  .progress-head{display:flex; align-items:center; justify-content:space-between;}
  .progress-title{font-size:15.5px; font-weight:800; color:#fff;}
  .progress-count{font-size:14px; font-weight:800; color:var(--red);}
  .num-ltr{direction:ltr; unicode-bidi:isolate; display:inline-block;}
  .all-done .progress-count{color:#34d399;}
  .progress-track{height:8px; border-radius:999px; background:var(--ink-700); margin-top:10px; overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--red), var(--gold)); transition:width .4s ease;}
  .all-done .progress-fill{background:#34d399;}
  .progress-sub{font-size:13.5px; color:var(--text-4); font-weight:600; margin-top:8px;}

  /* alerts panel */
  .alerts-panel{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:14px 16px; margin-bottom:14px;}
  .alerts-head{display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:800; color:#fff; margin-bottom:8px;}
  .alerts-toggle{font-size:12.5px; font-weight:800; color:var(--red); background:none; padding:2px 4px;}
  .alert-item{display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-top:1px solid var(--ink-700);}
  .alert-item:first-of-type{border-top:none;}
  .alert-dot{width:6px; height:6px; border-radius:999px; margin-top:6px; flex-shrink:0;}
  .alert-text{font-size:13.5px; color:var(--text-2); line-height:1.6;}

  /* mini progress (car completion) */
  .mini-progress-wrap{margin-top:10px;}
  .mini-progress-label{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--text-4); margin-bottom:4px;}
  .mini-progress-track{height:5px; border-radius:999px; background:var(--ink-700); overflow:hidden;}
  .mini-progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--gold), #34d399); transition:width .4s ease;}

  .done-badge{display:flex; align-items:center; gap:4px; font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; background:rgba(52,211,153,.15); color:#34d399; flex-shrink:0; white-space:nowrap;}
  .slot.slot-done{opacity:.72;}
  .slot.slot-done:hover{opacity:1;}
  .btn-publish-done{background:var(--ink-700); box-shadow:none; color:var(--text-2);}

  /* today plan sections (pending / done) */
  .section-head-row{display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px; gap:10px;}
  .section-title{font-size:14px; font-weight:800; color:var(--text-3); margin:18px 0 10px; letter-spacing:.2px;}
  .section-head-row .section-title{margin:0;}
  .section-toggle{font-size:12.5px; font-weight:800; color:var(--red); background:rgba(232,25,44,.1); border:1px solid rgba(232,25,44,.3); border-radius:999px; padding:6px 12px; flex-shrink:0; white-space:nowrap; transition:transform .1s;}
  .section-toggle:active{transform:scale(.95);}
  .section-divider{height:1px; background:var(--ink-700); margin:20px 0 4px;}

  .done-list{display:flex; flex-direction:column; gap:8px;}
  .done-item{display:flex; align-items:center; gap:10px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:14px; padding:10px 12px; opacity:.8; transition:opacity .15s;}
  .done-item:hover{opacity:1;}
  .done-item-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14.5px; flex-shrink:0;}
  .done-item-body{min-width:0; flex:1;}
  .done-item-title{font-size:14px; font-weight:700; color:#fff; margin:0; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .done-item-sub{font-size:12.5px; color:var(--text-4); margin:2px 0 0; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .done-item-check{width:20px; height:20px; border-radius:999px; background:rgba(52,211,153,.15); color:#34d399; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(.97);} 100%{transform:scale(1);}}
  .pop{animation:pop .25s ease-out;}

  /* republish list */
  .rq-item{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .rq-rank{width:28px; height:28px; border-radius:999px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:var(--text-4); flex-shrink:0;}
  .rq-mid{flex:1; min-width:0;}
  .rq-name-row{display:flex; align-items:center; gap:8px;}
  .rq-name{font-size:15.5px; font-weight:800; color:#fff; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .rq-days-box{flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; padding:6px 10px;}
  .rq-days-num{font-size:18px; font-weight:900; line-height:1;}
  .rq-days-lbl{font-size:10.5px; font-weight:800; margin-top:2px;}
  .rq-del{flex-shrink:0; width:32px; height:32px; border-radius:10px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-5); transition:transform .1s;}
  .rq-del:active{transform:scale(.9);}
  .rq-del.confirm{width:auto; padding:0 10px; background:var(--red); color:#fff; font-size:12px; font-weight:800; white-space:nowrap;}

  /* empty state */
  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:70px 20px;}
  .empty-state .box{width:56px; height:56px; border-radius:16px; background:var(--ink-850); border:1px solid var(--ink-700); display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .empty-state .t1{font-size:15.5px; font-weight:800; color:#fff;}
  .empty-state .t2{font-size:14px; color:var(--text-4); margin-top:4px;}

  /* form */
  .field{display:block; margin-bottom:16px;}
  .field label{display:block; margin-bottom:6px; font-size:14px; font-weight:700; color:var(--text-3);}
  .input{width:100%; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 14px; font-size:15.5px; font-weight:600; color:#fff; outline:none; transition:border-color .15s;}
  .input::placeholder{color:#5c5c64;}
  .input:focus{border-color:var(--red);}
  textarea.input{resize:none;}
  .prio-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .chan-select-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chan-select-chip{border-radius:20px; border:1px solid var(--ink-600); background:var(--ink-800); padding:9px 14px; font-size:13.5px; font-weight:800; color:var(--text-4); transition:all .15s;}
  .chan-select-chip.active{background:rgba(232,25,44,.15); border-color:transparent; color:var(--red); transform:scale(1.03);}
  .prio-opt{border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 0; font-size:14px; font-weight:800; color:var(--text-4); text-align:center; transition:all .15s;}
  .prio-opt.active{transform:scale(1.03); border-color:transparent;}
  .prio-opt.active.high{background:rgba(232,25,44,.15); color:var(--red);}
  .prio-opt.active.medium{background:rgba(245,166,35,.15); color:var(--gold);}
  .prio-opt.active.low{background:rgba(63,63,73,.4); color:#b7b7be;}
  .submit-btn{width:100%; border-radius:12px; background:var(--red); padding:15px 0; font-size:16.5px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .submit-btn:disabled{opacity:.3; box-shadow:none;}
  .submit-btn:active:not(:disabled){transform:scale(.97);}

  /* toast */
  .toast-wrap{position:fixed; bottom:96px; left:0; right:0; z-index:40; display:flex; justify-content:center; padding:0 16px; pointer-events:none;}
  .toast{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:999px; padding:11px 18px; box-shadow:0 8px 24px -12px rgba(0,0,0,.6); font-size:14px; font-weight:700; color:#fff; animation:rise .25s ease-out;}

  /* offline / sync status banner */
  .status-banner{text-align:center; font-size:13px; font-weight:800; padding:9px 12px;}
  .status-banner.offline{background:var(--red); color:#fff;}
  .status-banner.online{background:#34d399; color:#062b1e;}
  .offline-dot{display:inline-block; width:7px; height:7px; border-radius:999px; background:#fff; margin-left:4px; animation:pop 1.4s ease-in-out infinite;}

  /* login screen */
  .login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; max-width:420px; margin:0 auto;}
  .login-logo{width:64px; height:64px; border-radius:18px; margin-bottom:20px;}
  .login-logo span{font-size:22px;}
  .login-title{font-size:20px; font-weight:900; color:#fff; margin:0 0 8px;}
  .login-sub{font-size:14px; color:var(--text-4); line-height:1.7; margin:0 0 28px;}
  .google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:#fff; color:#1f1f1f; border-radius:12px; padding:14px 20px; font-size:15.5px; font-weight:800; box-shadow:0 8px 24px -12px rgba(0,0,0,.5); transition:transform .1s;}
  .google-btn:active{transform:scale(.97);}
  .login-error{margin-top:16px; font-size:13.5px; color:var(--red); line-height:1.7; background:rgba(232,25,44,.1); border:1px solid rgba(232,25,44,.3); border-radius:10px; padding:12px;}

  /* account chip + menu */
  .account-chip-wrap{position:relative; flex-shrink:0;}
  .account-chip{width:34px; height:34px; border-radius:999px; overflow:hidden; background:var(--red); display:flex; align-items:center; justify-content:center; border:2px solid var(--ink-700);}
  .account-chip img{width:100%; height:100%; object-fit:cover;}
  .account-chip span{color:#fff; font-weight:900; font-size:14px;}
  .account-menu{position:absolute; top:42px; left:0; z-index:40; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:14px; padding:14px; width:200px; box-shadow:0 12px 30px -10px rgba(0,0,0,.7); animation:rise .2s ease-out;}
  .account-menu-name{font-size:14px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-email{font-size:12.5px; color:var(--text-4); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-signout{width:100%; margin-top:12px; border-radius:10px; background:var(--ink-700); padding:9px 0; font-size:13.5px; font-weight:800; color:#fff;}

  /* install app banner */
  .install-banner{display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, rgba(232,25,44,.12), var(--ink-850)); border:1px solid rgba(232,25,44,.3); border-radius:16px; padding:14px; margin:12px 16px 0; animation:rise .25s ease-out;}
  .install-banner .logo{width:44px; height:44px; border-radius:13px;}
  .install-banner-mid{flex:1; min-width:0;}
  .install-banner-title{font-size:14px; font-weight:800; color:#fff; line-height:1.3;}
  .install-banner-sub{font-size:12.5px; color:var(--text-4); margin-top:3px; line-height:1.6;}
  .install-banner-actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
  .install-btn{border-radius:10px; background:var(--red); padding:8px 14px; font-size:13px; font-weight:800; color:#fff; white-space:nowrap; box-shadow:0 6px 18px -8px rgba(232,25,44,.5);}
  .install-btn:active{transform:scale(.95);}
  .install-dismiss{border-radius:10px; background:var(--ink-800); border:1px solid var(--ink-600); padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--text-4); white-space:nowrap;}
  .install-dismiss:active{transform:scale(.95);}
  .install-ios-steps{font-size:12.5px; color:var(--text-3); margin-top:8px; line-height:1.8; padding-top:8px; border-top:1px solid var(--ink-700);}
  .install-ios-steps b{color:#fff;}

  /* migration banner */
  .migration-banner{background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.3); border-radius:14px; padding:14px; margin:12px 16px 0;}
  .migration-text{font-size:14px; font-weight:700; color:var(--gold); line-height:1.6;}
  .migration-actions{display:flex; gap:8px; margin-top:10px;}

  /* stats */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .stat-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .stat-icon{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-size:16.5px;}
  .stat-val{font-size:26px; font-weight:900; line-height:1;}
  .stat-lbl{font-size:13.5px; font-weight:700; color:var(--text-4); margin-top:6px;}
  .hl-card{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .hl-icon{width:44px; height:44px; border-radius:12px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .hl-title{font-size:13px; font-weight:700; color:var(--text-4);}
  .hl-name{font-size:15.5px; font-weight:800; color:#fff; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .hl-detail{font-size:13.5px; font-weight:600; color:var(--text-3); margin-top:2px;}

  /* management screen */
  .mgmt-toolbar{margin-bottom:14px;}
  .mgmt-search-box{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:12px; padding:11px 14px;}
  .mgmt-search-input{flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:14.5px; font-weight:600;}
  .mgmt-search-input::placeholder{color:#5c5c64;}
  .mgmt-filters{display:flex; gap:8px; margin-top:10px;}
  .chip{border-radius:999px; border:1px solid var(--ink-600); background:var(--ink-800); padding:7px 14px; font-size:13.5px; font-weight:700; color:var(--text-4); transition:all .15s;}
  .chip.active{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-item{margin-bottom:12px; animation:rise .25s ease-out;}
  .mgmt-item-body{padding:16px;}
  .mgmt-item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .mgmt-name{font-size:17px; font-weight:800; color:#fff; line-height:1.35; min-width:0; flex:1; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .mgmt-badges{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; flex-shrink:0; max-width:44%;}
  .status-badge{font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .status-badge.active{background:rgba(52,211,153,.15); color:#34d399;}
  .status-badge.inactive{background:rgba(139,139,147,.18); color:#8b8b93;}
  .mgmt-meta-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:13.5px; color:var(--text-3); font-weight:600;}
  .mgmt-meta-row b{color:#fff; font-weight:800;}
  .mgmt-plat-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .mgmt-plat-chip{font-size:12px; font-weight:700; background:var(--ink-800); border:1px solid var(--ink-700); border-radius:8px; padding:4px 7px; color:var(--text-3); white-space:nowrap;}
  .mgmt-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .mgmt-btn{display:flex; align-items:center; justify-content:center; gap:6px; flex:1; min-width:90px; border-radius:11px; border:1px solid var(--ink-600); background:var(--ink-800); padding:10px 12px; font-size:13.5px; font-weight:800; color:var(--text-2); transition:all .15s;}
  .mgmt-btn:active{transform:scale(.95);}
  .mgmt-btn svg{width:14px; height:14px;}
  .mgmt-btn.primary{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-btn.danger{color:var(--red); border-color:rgba(232,25,44,.3);}
  .mgmt-btn.danger-confirm{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-item.editing{border-color:var(--red);}

  /* channels management */
  .chan-add-card{background:var(--ink-850); border:1px dashed var(--ink-600); border-radius:16px; padding:16px; margin-bottom:14px;}
  .chan-add-row{display:flex; gap:8px;}
  .chan-emoji-input{width:56px; flex-shrink:0; text-align:center; font-size:20px; padding:13px 4px;}
  .chan-item{position:relative; display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px 12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:12px 14px 12px 16px; margin-bottom:10px; overflow:hidden;}
  .chan-item.chan-item--private{border-color:rgba(56,189,248,.4); background:linear-gradient(135deg, rgba(56,189,248,.1), var(--ink-850) 55%);}
  .chan-item.chan-item--private::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--sky);}
  .chan-private-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; color:var(--sky); background:rgba(56,189,248,.14); border:1px solid rgba(56,189,248,.35); border-radius:999px; padding:2px 8px; margin-inline-start:6px; white-space:nowrap; vertical-align:middle;}
  .chan-emoji{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .chan-mid{flex:1 1 170px; min-width:0;}
  .chan-name{font-size:15.5px; font-weight:800; color:#fff; overflow-wrap:break-word; word-break:break-word; white-space:normal; line-height:1.4;}
  .chan-sub{font-size:12.5px; font-weight:700; margin-top:4px; line-height:1.7;}
  .chan-actions{display:flex; gap:6px; flex-shrink:0; margin-inline-start:auto;}
  .chan-icon-btn{width:32px; height:32px; border-radius:9px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-5); transition:transform .1s; flex-shrink:0;}
  .chan-icon-btn:active{transform:scale(.9);}
  .chan-icon-btn svg{width:14px; height:14px;}
  .chan-icon-btn.danger-confirm{width:auto; padding:0 10px; background:var(--red); color:#fff; font-size:12px; font-weight:800; white-space:nowrap;}
  .chan-editing{background:var(--ink-850); border:1px solid var(--red); border-radius:16px; padding:14px; margin-bottom:10px;}
  .cat-chan-url{font-size:12px; color:var(--text-5); direction:ltr; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}

  /* subscriptions table */
  .sub-table-wrap{overflow-x:auto; border:1px solid var(--ink-700); border-radius:16px; background:var(--ink-850);}
  .sub-table{width:100%; border-collapse:collapse; min-width:640px; font-size:14px;}
  .sub-table thead th{position:sticky; top:0; background:var(--ink-800); color:var(--text-4); font-size:12.5px; font-weight:800; text-align:right; padding:11px 12px; border-bottom:1px solid var(--ink-700); white-space:nowrap;}
  .sub-table tbody td{padding:12px; border-bottom:1px solid var(--ink-700); color:var(--text-2); vertical-align:middle; white-space:nowrap;}
  .sub-table tbody tr:last-child td{border-bottom:none;}
  .sub-num{color:var(--text-5); font-weight:800; text-align:center; width:32px;}
  .sub-email-cell{white-space:normal; min-width:170px;}
  .sub-email{color:#fff; font-weight:700; font-size:13.5px;}
  .sub-dname{color:var(--text-4); font-size:12.5px; margin-top:2px;}
  .sub-days{font-size:12px; font-weight:800; color:var(--text-4); margin-top:2px;}
  tr.sub-near td{background:rgba(245,166,35,.07);}
  tr.sub-near .sub-days{color:var(--gold);}
  tr.sub-expired td{background:rgba(232,25,44,.07);}
  tr.sub-expired .sub-days{color:var(--red);}
  .sub-actions-cell{display:flex; gap:6px;}
  .sub-edit-row td{padding:14px; background:var(--ink-800);}
  .sub-edit-card{display:flex; flex-direction:column; gap:10px; max-width:360px;}

  /* link-per-publish button + modal */
  .btn-addlink{display:flex; align-items:center; justify-content:center; gap:5px; border-radius:12px; border:1px dashed var(--ink-600); background:transparent; padding:9px 12px; font-size:12.5px; font-weight:800; color:var(--text-4); flex-shrink:0; transition:all .15s; margin-top:8px; width:100%;}
  .btn-addlink:active{transform:scale(.97);}
  .btn-addlink.has-links{border-style:solid; border-color:rgba(56,189,248,.4); color:var(--sky); background:rgba(56,189,248,.08);}
  .links-count-badge{display:inline-flex; align-items:center; gap:3px; font-size:11.5px; font-weight:800; color:var(--sky);}
  .btn-publish:disabled, .mgmt-btn:disabled{opacity:.55; pointer-events:none;}
  .btn-publish.saving{background:var(--ink-700); box-shadow:none; color:var(--text-3);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin-dot{display:inline-block; width:14px; height:14px; border-radius:999px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .7s linear infinite;}

  .pm-backdrop{position:fixed; left:0; right:0; top:0; height:calc(var(--app-vh, 1vh) * 100); z-index:60; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; animation:fadein .15s ease-out;}
  .pm-sheet{max-height:88%; overflow-y:auto;}
  @media (min-width:880px){ .pm-backdrop{ align-items:center; } }
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  .pm-sheet{width:100%; max-width:480px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 18px); animation:slideup .22s ease-out;}
  @media (min-width:880px){ .pm-sheet{ border-radius:20px; margin:0 16px; } }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .pm-handle{width:36px; height:4px; border-radius:999px; background:var(--ink-600); margin:0 auto 14px;}
  .pm-title{font-size:16.5px; font-weight:800; color:#fff; margin:0;}
  .pm-sub{font-size:13.5px; color:var(--text-4); margin:4px 0 14px; line-height:1.6;}
  .pm-qty-chip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800; color:var(--gold); background:rgba(245,166,35,.12); border-radius:999px; padding:4px 10px; margin-bottom:12px;}
  .pm-textarea{width:100%; min-height:92px; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:12px 13px; font-size:14.5px; font-weight:600; color:#fff; outline:none; resize:vertical; direction:ltr; text-align:left;}
  .pm-textarea::placeholder{color:#5c5c64; direction:rtl; text-align:right;}
  .pm-textarea:focus{border-color:var(--sky);}
  .pm-hint{font-size:12px; color:var(--text-5); margin-top:8px; line-height:1.6;}
  .pm-actions{display:flex; gap:8px; margin-top:16px; scroll-margin-bottom:12px;}
  .pm-skip{flex:1; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:14px 0; font-size:14.5px; font-weight:800; color:var(--text-2);}
  .pm-skip:active{transform:scale(.97);}
  .pm-confirm{flex:1.4; border-radius:12px; background:var(--red); padding:14px 0; font-size:14.5px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45);}
  .pm-confirm:active{transform:scale(.97);}

  /* channel type toggle */
  .chan-type-toggle{display:flex; gap:8px; margin:10px 0;}
  .chan-type-opt{flex:1; border-radius:11px; border:1px solid var(--ink-600); background:var(--ink-800); padding:10px 6px; font-size:12.5px; font-weight:800; color:var(--text-4); text-align:center; transition:all .15s;}
  .chan-type-opt.active{border-color:var(--sky); color:var(--sky); background:rgba(56,189,248,.1);}
  .chan-type-badge{font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px; margin-right:6px; white-space:nowrap;}
  .chan-type-badge.link{background:rgba(56,189,248,.14); color:var(--sky);}
  .chan-type-badge.messaging{background:rgba(52,211,153,.14); color:#34d399;}

  /* ===== desktop layout ===== */
  @media (min-width: 880px){
    body{ padding-right:236px; }
    #app{ max-width:1080px; margin:0 auto; padding-bottom:40px; }

    .bottomnav{ right:0; left:auto; top:0; bottom:0; width:236px; border-top:none; border-left:1px solid var(--ink-700); padding-bottom:0; }
    .bottomnav-inner{ max-width:none; display:flex; flex-direction:column; gap:4px; padding:28px 14px; height:100%; }
    .navbtn{ flex-direction:row; justify-content:flex-start; gap:12px; padding:13px 15px; border-radius:12px; }
    .navbtn:hover{ background:var(--ink-800); }
    .navbtn .bar{ top:14%; left:0; right:auto; width:3px; height:72%; border-radius:3px; }
    .navbtn svg{ width:20px; height:20px; }
    .navbtn span{ font-size:14px; }

    .topbar-inner{ max-width:900px; margin:0 auto; padding-top:26px; }
    .content{ max-width:900px; margin:0 auto; padding:20px 16px 16px; }

    .today-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:16px; align-items:start; }
    .today-grid .slot, .today-grid .empty-slot{ margin-bottom:0; }

    .mgmt-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:14px; align-items:start; }
    .mgmt-grid .mgmt-item{ margin-bottom:0; }
