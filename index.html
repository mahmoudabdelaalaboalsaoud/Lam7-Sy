<style>
  :root{
    --ink-950:#0a0a0c; --ink-900:#0d0d0d; --ink-850:#141417; --ink-800:#1a1a1f;
    --ink-700:#232329; --ink-600:#2e2e36; --ink-500:#3f3f49;
    --text-1:#f2f1ef; --text-2:#c9c9ce; --text-3:#a9a9b0; --text-4:#8a8a92; --text-5:#6c6c74;
    --red:#E8192C; --red-dark:#B01121; --gold:#F5A623;
    --green:#34d399; --sky:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink-900); color:var(--text-1);
    font-family:'Cairo',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px;}
  a{color:inherit}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-600); border-radius:999px;}

  /* topbar */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(13,13,13,.88); backdrop-filter:blur(14px); border-bottom:1px solid var(--ink-700);}
  .topbar-inner{max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; display:flex; align-items:center; gap:12px;}
  .logo{width:36px; height:36px; border-radius:11px; background:var(--ink-900); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); padding:4px; overflow:hidden;}
  .logo span{color:#fff; font-weight:900; font-size:13px;}
  .logo img{width:100%; height:100%; object-fit:contain;}
  .topbar h1{font-size:17px; font-weight:800; margin:0; line-height:1.2; color:#fff;}
  .topbar p{font-size:12.5px; color:var(--text-4); margin:2px 0 0;}

  .content{padding:16px;}

  /* bottom nav */
  .bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(13,13,13,.92); backdrop-filter:blur(14px); border-top:1px solid var(--ink-700); padding-bottom:env(safe-area-inset-bottom);}
  .bottomnav-inner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr);}
  .navbtn{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:9px 0 7px; color:var(--text-5); transition:transform .1s;}
  .navbtn:active{transform:scale(.93);}
  .navbtn.active{color:var(--red);}
  .navbtn .bar{position:absolute; top:0; width:32px; height:2px; border-radius:2px; background:var(--red);}
  .navbtn svg{width:19px; height:19px;}
  .navbtn span{font-size:9.5px; font-weight:700;}

  /* cards */
  .card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6); overflow:hidden;}
  .slot{margin-bottom:12px; animation:rise .28s ease-out;}
  .slot-bar{height:4px; width:100%;}
  .slot-body{padding:16px;}
  .slot-head{display:flex; align-items:center; gap:10px;}
  .platform-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .slot-label{font-size:13px; font-weight:700; color:var(--text-2); flex:1; min-width:0;}
  .prio-badge{font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; border:1px solid; flex-shrink:0; white-space:nowrap;}
  .car-name{font-size:19px; font-weight:800; color:#fff; margin:12px 0 0; line-height:1.35;}
  .car-notes{display:flex; gap:6px; align-items:flex-start; font-size:13px; color:var(--text-3); margin-top:5px; line-height:1.4;}
  .fresh-pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:800; margin-top:12px;}
  .fresh-dot{width:6px; height:6px; border-radius:999px;}
  .slot-actions{display:flex; gap:8px; margin-top:16px;}
  .btn-link{display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 15px; font-size:13px; font-weight:700; color:var(--text-2); flex-shrink:0; transition:transform .1s;}
  .btn-link:active{transform:scale(.95);}
  .btn-goto{display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid rgba(232,25,44,.4); background:rgba(232,25,44,.1); padding:13px 15px; font-size:13px; font-weight:800; color:var(--red); flex-shrink:0; transition:transform .1s;}
  .btn-goto:active{transform:scale(.95);}
  .btn-publish{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--red); padding:13px 16px; font-size:15px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .btn-publish:active{transform:scale(.95);}
  .empty-slot{border:1.5px dashed var(--ink-600); border-radius:16px; padding:22px; text-align:center; background:rgba(20,20,23,.4); margin-bottom:12px;}
  .empty-slot .platform-icon{margin:0 auto;}
  .empty-slot p{margin:8px 0 0;}
  .empty-slot .t1{font-size:14px; font-weight:800; color:#fff;}
  .empty-slot .t2{font-size:12.5px; color:var(--text-4); margin-top:3px;}

  /* daily plan progress */
  .progress-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .progress-card.all-done{border-color:rgba(52,211,153,.4); background:linear-gradient(135deg, rgba(52,211,153,.08), var(--ink-850));}
  .progress-head{display:flex; align-items:center; justify-content:space-between;}
  .progress-title{font-size:15px; font-weight:800; color:#fff;}
  .progress-count{font-size:13px; font-weight:800; color:var(--red);}
  .all-done .progress-count{color:#34d399;}
  .progress-track{height:8px; border-radius:999px; background:var(--ink-700); margin-top:10px; overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--red), var(--gold)); transition:width .4s ease;}
  .all-done .progress-fill{background:#34d399;}
  .progress-sub{font-size:12.5px; color:var(--text-4); font-weight:600; margin-top:8px;}

  /* alerts panel */
  .alerts-panel{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:14px 16px; margin-bottom:14px;}
  .alerts-head{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:800; color:#fff; margin-bottom:8px;}
  .alerts-toggle{font-size:11.5px; font-weight:800; color:var(--red); background:none; padding:2px 4px;}
  .alert-item{display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-top:1px solid var(--ink-700);}
  .alert-item:first-of-type{border-top:none;}
  .alert-dot{width:6px; height:6px; border-radius:999px; margin-top:6px; flex-shrink:0;}
  .alert-text{font-size:12.5px; color:var(--text-2); line-height:1.6;}

  /* mini progress (car completion) */
  .mini-progress-wrap{margin-top:10px;}
  .mini-progress-label{display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--text-4); margin-bottom:4px;}
  .mini-progress-track{height:5px; border-radius:999px; background:var(--ink-700); overflow:hidden;}
  .mini-progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--gold), #34d399); transition:width .4s ease;}

  .done-badge{display:flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; background:rgba(52,211,153,.15); color:#34d399; flex-shrink:0; white-space:nowrap;}
  .slot.slot-done{opacity:.72;}
  .slot.slot-done:hover{opacity:1;}
  .btn-publish-done{background:var(--ink-700); box-shadow:none; color:var(--text-2);}

  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(.97);} 100%{transform:scale(1);}}
  .pop{animation:pop .25s ease-out;}

  /* republish list */
  .rq-item{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .rq-rank{width:28px; height:28px; border-radius:999px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text-4); flex-shrink:0;}
  .rq-mid{flex:1; min-width:0;}
  .rq-name-row{display:flex; align-items:center; gap:8px;}
  .rq-name{font-size:15px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rq-days-box{flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; padding:6px 10px;}
  .rq-days-num{font-size:18px; font-weight:900; line-height:1;}
  .rq-days-lbl{font-size:9px; font-weight:800; margin-top:2px;}
  .rq-del{flex-shrink:0; width:32px; height:32px; border-radius:10px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-5); transition:transform .1s;}
  .rq-del:active{transform:scale(.9);}
  .rq-del.confirm{width:auto; padding:0 10px; background:var(--red); color:#fff; font-size:11px; font-weight:800; white-space:nowrap;}

  /* empty state */
  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:70px 20px;}
  .empty-state .box{width:56px; height:56px; border-radius:16px; background:var(--ink-850); border:1px solid var(--ink-700); display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .empty-state .t1{font-size:15px; font-weight:800; color:#fff;}
  .empty-state .t2{font-size:13px; color:var(--text-4); margin-top:4px;}

  /* form */
  .field{display:block; margin-bottom:16px;}
  .field label{display:block; margin-bottom:6px; font-size:13px; font-weight:700; color:var(--text-3);}
  .input{width:100%; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 14px; font-size:15px; font-weight:600; color:#fff; outline:none; transition:border-color .15s;}
  .input::placeholder{color:#5c5c64;}
  .input:focus{border-color:var(--red);}
  textarea.input{resize:none;}
  .prio-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .chan-select-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chan-select-chip{border-radius:20px; border:1px solid var(--ink-600); background:var(--ink-800); padding:9px 14px; font-size:12.5px; font-weight:800; color:var(--text-4); transition:all .15s;}
  .chan-select-chip.active{background:rgba(232,25,44,.15); border-color:transparent; color:var(--red); transform:scale(1.03);}
  .prio-opt{border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 0; font-size:13px; font-weight:800; color:var(--text-4); text-align:center; transition:all .15s;}
  .prio-opt.active{transform:scale(1.03); border-color:transparent;}
  .prio-opt.active.high{background:rgba(232,25,44,.15); color:var(--red);}
  .prio-opt.active.medium{background:rgba(245,166,35,.15); color:var(--gold);}
  .prio-opt.active.low{background:rgba(63,63,73,.4); color:#b7b7be;}
  .submit-btn{width:100%; border-radius:12px; background:var(--red); padding:15px 0; font-size:16px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .submit-btn:disabled{opacity:.3; box-shadow:none;}
  .submit-btn:active:not(:disabled){transform:scale(.97);}

  /* toast */
  .toast-wrap{position:fixed; bottom:96px; left:0; right:0; z-index:40; display:flex; justify-content:center; padding:0 16px; pointer-events:none;}
  .toast{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:999px; padding:11px 18px; box-shadow:0 8px 24px -12px rgba(0,0,0,.6); font-size:13px; font-weight:700; color:#fff; animation:rise .25s ease-out;}

  /* offline / sync status banner */
  .status-banner{text-align:center; font-size:12px; font-weight:800; padding:9px 12px;}
  .status-banner.offline{background:var(--red); color:#fff;}
  .status-banner.online{background:#34d399; color:#062b1e;}
  .offline-dot{display:inline-block; width:7px; height:7px; border-radius:999px; background:#fff; margin-left:4px; animation:pop 1.4s ease-in-out infinite;}

  /* login screen */
  .login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; max-width:420px; margin:0 auto;}
  .login-logo{width:64px; height:64px; border-radius:18px; margin-bottom:20px;}
  .login-logo span{font-size:22px;}
  .login-title{font-size:20px; font-weight:900; color:#fff; margin:0 0 8px;}
  .login-sub{font-size:13.5px; color:var(--text-4); line-height:1.7; margin:0 0 28px;}
  .google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:#fff; color:#1f1f1f; border-radius:12px; padding:14px 20px; font-size:15px; font-weight:800; box-shadow:0 8px 24px -12px rgba(0,0,0,.5); transition:transform .1s;}
  .google-btn:active{transform:scale(.97);}
  .login-error{margin-top:16px; font-size:12.5px; color:var(--red); line-height:1.7; background:rgba(232,25,44,.1); border:1px solid rgba(232,25,44,.3); border-radius:10px; padding:12px;}

  /* account chip + menu */
  .account-chip-wrap{position:relative; flex-shrink:0;}
  .account-chip{width:34px; height:34px; border-radius:999px; overflow:hidden; background:var(--red); display:flex; align-items:center; justify-content:center; border:2px solid var(--ink-700);}
  .account-chip img{width:100%; height:100%; object-fit:cover;}
  .account-chip span{color:#fff; font-weight:900; font-size:13px;}
  .account-menu{position:absolute; top:42px; left:0; z-index:40; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:14px; padding:14px; width:200px; box-shadow:0 12px 30px -10px rgba(0,0,0,.7); animation:rise .2s ease-out;}
  .account-menu-name{font-size:13.5px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-email{font-size:11.5px; color:var(--text-4); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-signout{width:100%; margin-top:12px; border-radius:10px; background:var(--ink-700); padding:9px 0; font-size:12.5px; font-weight:800; color:#fff;}

  /* install app banner */
  .install-banner{display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, rgba(232,25,44,.12), var(--ink-850)); border:1px solid rgba(232,25,44,.3); border-radius:16px; padding:14px; margin:12px 16px 0; animation:rise .25s ease-out;}
  .install-banner .logo{width:44px; height:44px; border-radius:13px;}
  .install-banner-mid{flex:1; min-width:0;}
  .install-banner-title{font-size:13.5px; font-weight:800; color:#fff; line-height:1.3;}
  .install-banner-sub{font-size:11.5px; color:var(--text-4); margin-top:3px; line-height:1.6;}
  .install-banner-actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
  .install-btn{border-radius:10px; background:var(--red); padding:8px 14px; font-size:12px; font-weight:800; color:#fff; white-space:nowrap; box-shadow:0 6px 18px -8px rgba(232,25,44,.5);}
  .install-btn:active{transform:scale(.95);}
  .install-dismiss{border-radius:10px; background:var(--ink-800); border:1px solid var(--ink-600); padding:7px 14px; font-size:11.5px; font-weight:700; color:var(--text-4); white-space:nowrap;}
  .install-dismiss:active{transform:scale(.95);}
  .install-ios-steps{font-size:11.5px; color:var(--text-3); margin-top:8px; line-height:1.8; padding-top:8px; border-top:1px solid var(--ink-700);}
  .install-ios-steps b{color:#fff;}

  /* migration banner */
  .migration-banner{background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.3); border-radius:14px; padding:14px; margin:12px 16px 0;}
  .migration-text{font-size:13px; font-weight:700; color:var(--gold); line-height:1.6;}
  .migration-actions{display:flex; gap:8px; margin-top:10px;}

  /* stats */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .stat-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .stat-icon{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-size:16px;}
  .stat-val{font-size:26px; font-weight:900; line-height:1;}
  .stat-lbl{font-size:12.5px; font-weight:700; color:var(--text-4); margin-top:6px;}
  .hl-card{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .hl-icon{width:44px; height:44px; border-radius:12px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .hl-title{font-size:12px; font-weight:700; color:var(--text-4);}
  .hl-name{font-size:15px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hl-detail{font-size:12.5px; font-weight:600; color:var(--text-3); margin-top:2px;}

  /* management screen */
  .mgmt-toolbar{margin-bottom:14px;}
  .mgmt-search-box{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:12px; padding:11px 14px;}
  .mgmt-search-input{flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:14px; font-weight:600;}
  .mgmt-search-input::placeholder{color:#5c5c64;}
  .mgmt-filters{display:flex; gap:8px; margin-top:10px;}
  .chip{border-radius:999px; border:1px solid var(--ink-600); background:var(--ink-800); padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--text-4); transition:all .15s;}
  .chip.active{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-item{margin-bottom:12px; animation:rise .25s ease-out;}
  .mgmt-item-body{padding:16px;}
  .mgmt-item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .mgmt-name{font-size:17px; font-weight:800; color:#fff; line-height:1.3; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mgmt-badges{display:flex; gap:6px; flex-shrink:0;}
  .status-badge{font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .status-badge.active{background:rgba(52,211,153,.15); color:#34d399;}
  .status-badge.inactive{background:rgba(139,139,147,.18); color:#8b8b93;}
  .mgmt-meta-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:var(--text-3); font-weight:600;}
  .mgmt-meta-row b{color:#fff; font-weight:800;}
  .mgmt-plat-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .mgmt-plat-chip{font-size:11px; font-weight:700; background:var(--ink-800); border:1px solid var(--ink-700); border-radius:8px; padding:4px 7px; color:var(--text-3); white-space:nowrap;}
  .mgmt-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .mgmt-btn{display:flex; align-items:center; justify-content:center; gap:6px; flex:1; min-width:90px; border-radius:11px; border:1px solid var(--ink-600); background:var(--ink-800); padding:10px 12px; font-size:12.5px; font-weight:800; color:var(--text-2); transition:all .15s;}
  .mgmt-btn:active{transform:scale(.95);}
  .mgmt-btn svg{width:14px; height:14px;}
  .mgmt-btn.primary{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-btn.danger{color:var(--red); border-color:rgba(232,25,44,.3);}
  .mgmt-btn.danger-confirm{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-item.editing{border-color:var(--red);}

  /* channels management */
  .chan-add-card{background:var(--ink-850); border:1px dashed var(--ink-600); border-radius:16px; padding:16px; margin-bottom:14px;}
  .chan-add-row{display:flex; gap:8px;}
  .chan-emoji-input{width:56px; flex-shrink:0; text-align:center; font-size:20px; padding:13px 4px;}
  .chan-item{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:12px 14px; margin-bottom:10px;}
  .chan-emoji{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .chan-mid{flex:1; min-width:0;}
  .chan-name{font-size:15px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chan-sub{font-size:11.5px; font-weight:700; margin-top:2px;}
  .chan-actions{display:flex; gap:6px; flex-shrink:0;}
  .chan-icon-btn{width:32px; height:32px; border-radius:9px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-5); transition:transform .1s;}
  .chan-icon-btn:active{transform:scale(.9);}
  .chan-icon-btn svg{width:14px; height:14px;}
  .chan-icon-btn.danger-confirm{width:auto; padding:0 10px; background:var(--red); color:#fff; font-size:11px; font-weight:800; white-space:nowrap;}
  .chan-editing{background:var(--ink-850); border:1px solid var(--red); border-radius:16px; padding:14px; margin-bottom:10px;}
  .cat-chan-url{font-size:11px; color:var(--text-5); direction:ltr; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}

  /* subscriptions table */
  .sub-table-wrap{overflow-x:auto; border:1px solid var(--ink-700); border-radius:16px; background:var(--ink-850);}
  .sub-table{width:100%; border-collapse:collapse; min-width:640px; font-size:13px;}
  .sub-table thead th{position:sticky; top:0; background:var(--ink-800); color:var(--text-4); font-size:11.5px; font-weight:800; text-align:right; padding:11px 12px; border-bottom:1px solid var(--ink-700); white-space:nowrap;}
  .sub-table tbody td{padding:12px; border-bottom:1px solid var(--ink-700); color:var(--text-2); vertical-align:middle; white-space:nowrap;}
  .sub-table tbody tr:last-child td{border-bottom:none;}
  .sub-num{color:var(--text-5); font-weight:800; text-align:center; width:32px;}
  .sub-email-cell{white-space:normal; min-width:170px;}
  .sub-email{color:#fff; font-weight:700; font-size:12.5px;}
  .sub-dname{color:var(--text-4); font-size:11.5px; margin-top:2px;}
  .sub-days{font-size:10.5px; font-weight:800; color:var(--text-4); margin-top:2px;}
  tr.sub-near td{background:rgba(245,166,35,.07);}
  tr.sub-near .sub-days{color:var(--gold);}
  tr.sub-expired td{background:rgba(232,25,44,.07);}
  tr.sub-expired .sub-days{color:var(--red);}
  .sub-actions-cell{display:flex; gap:6px;}
  .sub-edit-row td{padding:14px; background:var(--ink-800);}
  .sub-edit-card{display:flex; flex-direction:column; gap:10px; max-width:360px;}

  /* link-per-publish button + modal */
  .btn-addlink{display:flex; align-items:center; justify-content:center; gap:5px; border-radius:12px; border:1px dashed var(--ink-600); background:transparent; padding:9px 12px; font-size:11.5px; font-weight:800; color:var(--text-4); flex-shrink:0; transition:all .15s; margin-top:8px; width:100%;}
  .btn-addlink:active{transform:scale(.97);}
  .btn-addlink.has-links{border-style:solid; border-color:rgba(56,189,248,.4); color:var(--sky); background:rgba(56,189,248,.08);}
  .links-count-badge{display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:800; color:var(--sky);}
  .btn-publish:disabled, .mgmt-btn:disabled{opacity:.55; pointer-events:none;}
  .btn-publish.saving{background:var(--ink-700); box-shadow:none; color:var(--text-3);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin-dot{display:inline-block; width:14px; height:14px; border-radius:999px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .7s linear infinite;}

  .pm-backdrop{position:fixed; left:0; right:0; top:0; height:calc(var(--app-vh, 1vh) * 100); z-index:60; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; animation:fadein .15s ease-out;}
  .pm-sheet{max-height:88%; overflow-y:auto;}
  @media (min-width:880px){ .pm-backdrop{ align-items:center; } }
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  .pm-sheet{width:100%; max-width:480px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 18px); animation:slideup .22s ease-out;}
  @media (min-width:880px){ .pm-sheet{ border-radius:20px; margin:0 16px; } }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .pm-handle{width:36px; height:4px; border-radius:999px; background:var(--ink-600); margin:0 auto 14px;}
  .pm-title{font-size:16px; font-weight:800; color:#fff; margin:0;}
  .pm-sub{font-size:12.5px; color:var(--text-4); margin:4px 0 14px; line-height:1.6;}
  .pm-qty-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:800; color:var(--gold); background:rgba(245,166,35,.12); border-radius:999px; padding:4px 10px; margin-bottom:12px;}
  .pm-textarea{width:100%; min-height:92px; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:12px 13px; font-size:14px; font-weight:600; color:#fff; outline:none; resize:vertical; direction:ltr; text-align:left;}
  .pm-textarea::placeholder{color:#5c5c64; direction:rtl; text-align:right;}
  .pm-textarea:focus{border-color:var(--sky);}
  .pm-hint{font-size:11px; color:var(--text-5); margin-top:8px; line-height:1.6;}
  .pm-actions{display:flex; gap:8px; margin-top:16px;}
  .pm-skip{flex:1; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:14px 0; font-size:14px; font-weight:800; color:var(--text-2);}
  .pm-skip:active{transform:scale(.97);}
  .pm-confirm{flex:1.4; border-radius:12px; background:var(--red); padding:14px 0; font-size:14px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45);}
  .pm-confirm:active{transform:scale(.97);}

  /* channel type toggle */
  .chan-type-toggle{display:flex; gap:8px; margin:10px 0;}
  .chan-type-opt{flex:1; border-radius:11px; border:1px solid var(--ink-600); background:var(--ink-800); padding:10px 6px; font-size:11.5px; font-weight:800; color:var(--text-4); text-align:center; transition:all .15s;}
  .chan-type-opt.active{border-color:var(--sky); color:var(--sky); background:rgba(56,189,248,.1);}
  .chan-type-badge{font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:999px; margin-right:6px; white-space:nowrap;}
  .chan-type-badge.link{background:rgba(56,189,248,.14); color:var(--sky);}
  .chan-type-badge.messaging{background:rgba(52,211,153,.14); color:#34d399;}

  /* ===== desktop layout ===== */
  @media (min-width: 880px){
    body{ padding-right:236px; }
    #app{ max-width:1080px; margin:0 auto; padding-bottom:40px; }

    .bottomnav{ right:0; left:auto; top:0; bottom:0; width:236px; border-top:none; border-left:1px solid var(--ink-700); padding-bottom:0; }
    .bottomnav-inner{ max-width:none; display:flex; flex-direction:column; gap:4px; padding:28px 14px; height:100%; }
    .navbtn{ flex-direction:row; justify-content:flex-start; gap:12px; padding:13px 15px; border-radius:12px; }
    .navbtn:hover{ background:var(--ink-800); }
    .navbtn .bar{ top:14%; left:0; right:auto; width:3px; height:72%; border-radius:3px; }
    .navbtn svg{ width:20px; height:20px; }
    .navbtn span{ font-size:13.5px; }

    .topbar-inner{ max-width:900px; margin:0 auto; padding-top:26px; }
    .content{ max-width:900px; margin:0 auto; padding:20px 16px 16px; }

    .today-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:16px; align-items:start; }
    .today-grid .slot, .today-grid .empty-slot{ margin-bottom:0; }

    .mgmt-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:14px; align-items:start; }
    .mgmt-grid .mgmt-item{ margin-bottom:0; }

    .chan-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:10px; align-items:start; }
    .chan-list .chan-item{ margin-bottom:0; }

    .rq-list{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .rq-item{ margin-bottom:0; }

    .stat-grid{ grid-template-columns:repeat(4,1fr); }

    .add-form-wrap{ max-width:520px; }

    .btn-publish:hover, .btn-link:hover, .submit-btn:hover, .mgmt-btn:hover, .chip:hover{ filter:brightness(1.1); }
    .rq-del:hover{ background:var(--ink-700); }
  }</style>
</head>

  try {
    var manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
    var manifestLink = document.getElementById("app-manifest");
    if(manifestLink) manifestLink.setAttribute("href", URL.createObjectURL(manifestBlob));
  } catch(e){ /* manifest is a nice-to-have; ignore if unsupported */ }

  function isStandaloneMode(){
    return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }
  function isIOSDevice(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }
  function recentlyDismissedInstall(){
    var raw = localStorage.getItem(INSTALL_DISMISS_KEY);
    if(!raw) return false;
    var days = (Date.now() - Number(raw)) / 86400000;
    return days < 14;
  }
  function maybeShowInstallCard(){
    if(isStandaloneMode() || recentlyDismissedInstall()) return;
    if(deferredInstallPrompt || isIOSDevice()){
      state.showInstallCard = true;
      render();
    }
  }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    maybeShowInstallCard();
  });
  window.addEventListener("appinstalled", function(){
    state.showInstallCard = false;
    deferredInstallPrompt = null;
    render();
  });
  setTimeout(maybeShowInstallCard, 1200);

  function syncViewportHeight(){
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty("--app-vh", (h / 100) + "px");
  }
  syncViewportHeight();
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", syncViewportHeight);
    window.visualViewport.addEventListener("scroll", syncViewportHeight);
  }
  window.addEventListener("resize", syncViewportHeight);
  document.addEventListener("focusin", function(e){
    if(e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")){
      setTimeout(function(){
        e.target.scrollIntoView({ block: "center", behavior: "smooth" });
      }, 180);
    }
  });

  window.addEventListener("online", function(){
    state.online = true;
    state.syncFlash = true;
    render();
    setTimeout(function(){ state.syncFlash = false; render(); }, 2500);
  });
  window.addEventListener("offline", function(){
    state.online = false;
    render();
  });

  var platformsSeedAttempted = false;

  function startListening(userId){
    carsCol = collection(db, "accounts", userId, "cars");
    logCol = collection(db, "accounts", userId, "publishLog");
    platformsCol = collection(db, "accounts", userId, "platforms");
    overridesCol = collection(db, "accounts", userId, "channelOverrides");

    state.cars = []; state.platforms = []; state.log = [];
    state.carsLoaded = false; state.platformsLoaded = false; state.loading = true;
    platformsSeedAttempted = false;

    unsubCars = onSnapshot(carsCol, function(snap){
      state.cars = snap.docs.map(function(d){
        var data = d.data();
        return {
          id: d.id,
          name: data.name || data.carName || data.title || data.Name || data.model || "",
          adLink: data.adLink || "",
          notes: data.notes || "",
          priority: data.priority || "medium",
          createdAt: data.createdAt || 0,
          active: data.active !== false,
          lastPublished: data.lastPublished || {},
          totalPublishes: data.totalPublishes || 0,
          campaign: data.campaign || {}
        };
      });
      state.carsLoaded = true;
      state.loading = !(state.carsLoaded && state.platformsLoaded);
      render();
    }, function(err){
      console.error("Firestore cars sync error:", err);
      showConnectionError();
    });

    unsubPlatforms = onSnapshot(platformsCol, function(snap){
      if(snap.empty && !platformsSeedAttempted){
        platformsSeedAttempted = true;
        DEFAULT_PLATFORMS.forEach(function(p){
          setDoc(doc(db, "accounts", userId, "platforms", p.id), {
            label: p.label, emoji: p.emoji, bg: p.bg, order: p.order, active: true, createdAt: Date.now(), messaging: !!p.messaging
          }).catch(function(err){ console.error("seed platform error:", err); });
        });
        return; // the setDoc calls will re-trigger this listener
      }
      state.platforms = snap.docs.map(function(d){
        var data = d.data();
        return {
          id: d.id,
          label: data.label || "",
          emoji: data.emoji || "📣",
          bg: data.bg || "rgba(232,25,44,.14)",
          order: typeof data.order === "number" ? data.order : 999,
          active: data.active !== false,
          messaging: !!data.messaging
        };
      }).sort(function(a,b){ return a.order - b.order; });
      state.platformsLoaded = true;
      state.loading = !(state.carsLoaded && state.platformsLoaded);
      render();
    }, function(err){
      console.error("Firestore platforms sync error:", err);
      showConnectionError();
    });

    unsubLog = onSnapshot(logCol, function(snap){
      state.log = snap.docs.map(function(d){
        var data = d.data();
        return { id: d.id, carId: data.carId, carName: data.carName, platform: data.platform, timestamp: data.timestamp || 0, quantity: data.quantity || 1, links: Array.isArray(data.links) ? data.links : [] };
      }).sort(function(a,b){ return b.timestamp - a.timestamp; });
      render();
    }, function(err){
      console.error("Firestore log sync error:", err);
    });
  }

  function stopListening(){
    if(unsubCars) unsubCars();
    if(unsubPlatforms) unsubPlatforms();
    if(unsubLog) unsubLog();
    if(unsubMyAccount) unsubMyAccount();
    if(unsubAdminAccounts) unsubAdminAccounts();
    if(unsubGlobalChannels) unsubGlobalChannels();
    if(unsubOverrides) unsubOverrides();
    unsubCars = unsubPlatforms = unsubLog = unsubMyAccount = unsubAdminAccounts = unsubGlobalChannels = unsubOverrides = null;
  }

  /* ---------------- global channels (built by admin, visible to everyone) ---------------- */
  function startGlobalChannelsListening(){
    unsubGlobalChannels = onSnapshot(globalChannelsCol, function(snap){
      state.globalChannels = snap.docs.map(function(d){
        var data = d.data();
        return {
          id: d.id,
          label: data.label || "",
          emoji: data.emoji || "📣",
          bg: data.bg || "rgba(232,25,44,.14)",
          url: data.url || "",
          order: typeof data.order === "number" ? data.order : 999,
          active: data.active !== false,
          messaging: !!data.messaging,
          createdAt: data.createdAt || 0
        };
      }).sort(function(a,b){ return a.order - b.order; });
      state.globalChannelsLoaded = true;
      render();
    }, function(err){
      console.error("Firestore globalChannels sync error:", err);
    });
  }

  function startOverridesListening(){
    unsubOverrides = onSnapshot(overridesCol, function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = d.data(); });
      state.channelOverrides = map;
      render();
    }, function(err){
      console.error("Firestore channelOverrides sync error:", err);
    });
  }

  /* effective list every user actually sees/uses: global channels (with their own
     personal overrides applied) merged with their own private channels */
  function effectiveChannels(){
    var globals = state.globalChannels.map(function(g){
      var ov = state.channelOverrides[g.id];
      if(!ov) return Object.assign({ scope:"global" }, g);
      return Object.assign({}, g, ov, { id: g.id, scope:"global", overridden:true });
    });
    var privates = state.platforms.map(function(p){ return Object.assign({ scope:"private" }, p); });
    return globals.concat(privates).sort(function(a,b){ return (a.order||0) - (b.order||0); });
  }

  /* ---------------- account bootstrap + one-time legacy data import ---------------- */

          displayName: user.displayName || "",

        });

      } else {
        updateDoc(accountRef, {
          displayName: user.displayName || "",

          photoURL: user.photoURL || ""
        }).catch(function(){});

  function checkLegacyData(userId){
    getDocs(collection(db, "lam7_cars")).then(function(snap){

  function runMigration(){

    state.migrating = true;
    render();
    Promise.all([
      getDocs(collection(db, "lam7_cars")),
      getDocs(collection(db, "lam7_platforms")),
      getDocs(collection(db, "lam7_publish_log"))
    ]).then(function(results){
      var writes = [];
      results[0].docs.forEach(function(d){ writes.push(setDoc(doc(db,"accounts",userId,"cars",d.id), d.data())); });
      results[1].docs.forEach(function(d){ writes.push(setDoc(doc(db,"accounts",userId,"platforms",d.id), d.data())); });
      results[2].docs.forEach(function(d){ writes.push(setDoc(doc(db,"accounts",userId,"publishLog",d.id), d.data())); });
      return Promise.all(writes);
    }).then(function(){
      state.migrating = false;
      state.migrationAvailable = false;
      showToast("تم استيراد بياناتك القديمة بنجاح");
      render();

  /* ---------------- helpers ---------------- */
  function globalLast(car){
    var vals = Object.keys(car.lastPublished).map(function(k){return car.lastPublished[k];}).filter(function(v){return v!==null && v!==undefined;});
    if(vals.length===0) return null;
    return Math.max.apply(null, vals);
  }
  function daysSince(ts){ if(ts===null||ts===undefined) return null; return Math.floor((Date.now()-ts)/86400000); }
  function isToday(ts){
    if(ts===null||ts===undefined) return false;
    var d = new Date(ts), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function formatRelative(ts){
    if(ts===null||ts===undefined) return "لم يُنشر بعد";
    var d = daysSince(ts);
    if(d===0){ var hrs = Math.floor((Date.now()-ts)/3600000); if(hrs<1) return "منذ لحظات"; return "منذ " + hrs + " " + (hrs===1?"ساعة":"ساعات"); }
    if(d===1) return "منذ يوم واحد";
    if(d===2) return "منذ يومين";
    if(d<11) return "منذ " + d + " أيام";
    return "منذ " + d + " يومًا";
  }
  function urgencyTier(days){
    if(days===null||days===undefined) return "urgent";
    if(days<=2) return "fresh";
    if(days<=5) return "ok";
    if(days<=9) return "warn";
    return "urgent";
  }
  var URGENCY = {
    fresh: { text:"#34d399", bg:"rgba(52,211,153,.12)" },
    ok:    { text:"#38bdf8", bg:"rgba(56,189,248,.12)" },
    warn:  { text:"#F5A623", bg:"rgba(245,166,35,.12)" },
    urgent:{ text:"#E8192C", bg:"rgba(232,25,44,.12)" }
  };
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- security: URL sanitization ----------------
     Only http(s) links are ever allowed to be rendered as href/text.
     This blocks javascript:, data:, vbscript: and other schemes that
     could otherwise be injected via a car's ad link or a publish link
     and executed when the user taps it. */
  function isValidUrl(s){
    if(typeof s !== "string") return false;
    var t = s.trim();
    if(!t) return false;
    if(t.length > 2000) return false; // guard against pathological input
    return /^https?:\/\/[^\s"'<>]+$/i.test(t);
  }
  function sanitizeHref(s){
    return isValidUrl(s) ? String(s).trim() : "";
  }

  /* ---------------- queue logic ---------------- */
  function activeCars(){ return state.cars.filter(function(c){ return c.active; }); }

  /**
   * Urgency = days waited * priority weight.
   * This is the fix for "same car keeps repeating": priority used to be an
   * absolute override, so a high-priority car could block others forever.
   * Now priority just accelerates how fast a car becomes urgent — every
   * active car eventually surfaces, guaranteed, while important cars still
   * come up more often on average.
   */
  function urgencyScore(car, platform){
    var ts = platform === "global" ? globalLast(car) : (car.lastPublished[platform] !== undefined ? car.lastPublished[platform] : null);
    var days = (ts === null || ts === undefined) ? 30 : (Date.now() - ts) / 86400000;
    var weight = (PRIORITY_META[car.priority] && PRIORITY_META[car.priority].urgencyWeight) || 1;
    return days * weight;
  }

  function cmpForPlatform(a, b, platform){
    var diff = urgencyScore(b, platform) - urgencyScore(a, platform);
    if(diff !== 0) return diff;
    return a.createdAt - b.createdAt;
  }

  function campaignEntry(car, platform){
    return (car.campaign && car.campaign[platform]) ? car.campaign[platform] : null;
  }
  function campaignComplete(car, platform){
    var e = campaignEntry(car, platform);
    return !!(e && e.target > 0 && e.done >= e.target);
  }

  function suggestionFor(platform){
    var list = activeCars().filter(function(c){ return !campaignComplete(c, platform); }).slice().sort(function(a,b){ return cmpForPlatform(a,b,platform); });
    return list.length ? list[0] : null;
  }

  function republishQueue(){
    return activeCars().slice().sort(function(a,b){ return cmpForPlatform(a,b,"global"); });
  }

  function startOfToday(){
    var now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  }
  function linksTodayCount(carId, platform){
    var sod = startOfToday();
    var count = 0;
    state.log.forEach(function(l){
      if(l.carId === carId && l.platform === platform && l.timestamp >= sod && l.links) count += l.links.length;
    });
    return count;
  }

  function computeStats(){
    var now = new Date();
    var startOfDay = startOfToday();
    var daysSinceSat = (now.getDay() + 1) % 7;
    var startOfWeek = startOfDay - daysSinceSat * 86400000;

    var postsToday = state.log.filter(function(l){ return l.timestamp >= startOfDay; }).length;
    var postsThisWeek = state.log.filter(function(l){ return l.timestamp >= startOfWeek; }).length;

    var mostPublished = null;
    state.cars.forEach(function(c){
      if(!mostPublished || c.totalPublishes > mostPublished.totalPublishes) mostPublished = c;
    });
    if(mostPublished && mostPublished.totalPublishes === 0) mostPublished = null;

    var staleCar = null, staleDays = -1;
    activeCars().forEach(function(c){
      var last = globalLast(c);
      var d = last===null ? Infinity : Math.floor((Date.now()-last)/86400000);
      if(d > staleDays){ staleDays = d; staleCar = c; }
    });

    return {
      activeCount: activeCars().length,
      postsToday: postsToday,
      postsThisWeek: postsThisWeek,
      mostPublished: mostPublished,
      staleCar: staleCar,
      staleDays: staleDays===Infinity ? null : staleDays
    };
  }

  function pendingKey(carId, platform){ return carId + "::" + platform; }
  function isPending(carId, platform){ return !!state.pendingWrites[pendingKey(carId, platform)]; }

  function markPublished(carId, platform, links){
    var now = Date.now();
    var car = state.cars.find(function(c){ return c.id === carId; });
    if(!car) return;
    if(isPending(carId, platform)) return; // guard against double-tap while a write is in flight

    var safeLinks = (links || []).filter(isValidUrl);
    var prevTs = car.lastPublished ? car.lastPublished[platform] : undefined;
    var key = pendingKey(carId, platform);

    /* optimistic local update — reflect instantly, don't wait on the network */
    car.lastPublished = Object.assign({}, car.lastPublished);
    car.lastPublished[platform] = now;
    car.totalPublishes += 1;
    state.justPublished = platform;
    state.pendingWrites[key] = true;
    render();
    setTimeout(function(){ state.justPublished = null; render(); }, 500);

    var update = {};
    update["lastPublished." + platform] = now;
    update.totalPublishes = increment(1);

    updateDoc(doc(db, "accounts", currentUser.uid, "cars", carId), update).then(function(){
      delete state.pendingWrites[key];
      render();
    }).catch(function(err){
      console.error("markPublished error:", err);
      /* roll back the optimistic update so the UI matches reality */
      delete state.pendingWrites[key];
      car.lastPublished = Object.assign({}, car.lastPublished);
      car.lastPublished[platform] = prevTs;
      car.totalPublishes -= 1;
      showToast("⚠️ لم يُحفظ على السيرفر — حاول تاني");
      render();
    });

    addDoc(logCol, { carId: carId, carName: car.name, platform: platform, timestamp: now, quantity: 1, links: safeLinks }).catch(function(err){
      console.error("log write error:", err);
    });
  }

  function registerCampaignProgress(carId, platform, qty, links){
    var now = Date.now();
    var car = state.cars.find(function(c){ return c.id === carId; });
    if(!car) return;
    var entry = campaignEntry(car, platform);
    if(!entry) return;
    if(isPending(carId, platform)) return; // guard against double-tap while a write is in flight

    var safeLinks = (links || []).filter(isValidUrl);
    var newDone = Math.min(entry.target, entry.done + qty);
    var platMeta = effectiveChannels().find(function(p){ return p.id === platform; });
    var prevDone = entry.done;
    var prevTs = car.lastPublished ? car.lastPublished[platform] : undefined;
    var key = pendingKey(carId, platform);

    /* optimistic local update */
    car.campaign = Object.assign({}, car.campaign);
    car.campaign[platform] = Object.assign({}, entry, { done: newDone });
    car.lastPublished = Object.assign({}, car.lastPublished);
    car.lastPublished[platform] = now;
    car.totalPublishes += qty;
    state.justPublished = platform;
    state.pendingWrites[key] = true;
    render();
    setTimeout(function(){ state.justPublished = null; render(); }, 500);

    var update = {};
    update["campaign." + platform + ".done"] = newDone;
    update["lastPublished." + platform] = now;
    update.totalPublishes = increment(qty);

    updateDoc(doc(db, "accounts", currentUser.uid, "cars", carId), update).then(function(){
      delete state.pendingWrites[key];
      if(newDone >= entry.target){
        showToast("🎉 خلصت حملة " + (platMeta ? platMeta.label : platform) + " لعربية " + car.name);
      } else {
        showToast("تم تسجيل " + qty + " — الباقي " + (entry.target - newDone));
      }
      render();
    }).catch(function(err){
      console.error("registerCampaignProgress error:", err);
      /* roll back the optimistic update so the UI matches reality */
      delete state.pendingWrites[key];
      car.campaign = Object.assign({}, car.campaign);
      car.campaign[platform] = Object.assign({}, entry, { done: prevDone });
      car.lastPublished = Object.assign({}, car.lastPublished);
      car.lastPublished[platform] = prevTs;
      car.totalPublishes -= qty;
      showToast("⚠️ لم يُحفظ على السيرفر — حاول تاني");
      render();
    });

    addDoc(logCol, { carId: carId, carName: car.name, platform: platform, timestamp: now, quantity: qty, links: safeLinks }).catch(function(err){
      console.error("log write error:", err);
    });
  }

  function slotCard(platform){
    var meta = effectiveChannels().filter(function(p){return p.id===platform;})[0];
    if(!meta) return "";
    var car = suggestionFor(platform);
    if(!car){
      var allCampaignDone = activeCars().length > 0 && activeCars().every(function(c){ return campaignComplete(c, platform); });
      return '<div class="empty-slot">' +
        '<div class="platform-icon" style="background:' + meta.bg + '">' + meta.emoji + '</div>' +
        '<p class="t1">' + esc(meta.label) + '</p>' +
        '<p class="t2">' + (allCampaignDone ? 'كل السيارات خلّصت حملتها على القناة دي 🎉' : 'لا توجد سيارات نشطة في القائمة') + '</p>' +
      '</div>';
    }
    var ts = car.lastPublished[platform];
    var days = daysSince(ts);
    var tier = urgencyTier(days);
    var u = URGENCY[tier];
    var prio = PRIORITY_META[car.priority];
    var justPub = state.justPublished === platform;
    var doneToday = isToday(ts);
    var camp = campaignEntry(car, platform);
    var safeAdLink = sanitizeHref(car.adLink);
    var linkHtml = car.adLink ? (
      meta.messaging
        ? '<span class="btn-link" dir="ltr">' + ICONS.link.replace('viewBox','style="width:16px;height:16px" viewBox') + esc(car.adLink) + '</span>'
        : (safeAdLink
            ? '<a class="btn-link" href="' + esc(safeAdLink) + '" target="_blank" rel="noopener noreferrer">' + ICONS.link.replace('viewBox','style="width:16px;height:16px" viewBox') + 'الإعلان</a>'
            : '<span class="btn-link" dir="ltr">' + ICONS.link.replace('viewBox','style="width:16px;height:16px" viewBox') + esc(car.adLink) + '</span>')
    ) : '';
    var pending = isPending(car.id, platform);
    var isMessaging = !!meta.messaging;
    var safeChanUrl = !isMessaging ? sanitizeHref(meta.url) : "";
    var gotoHtml = safeChanUrl ? '<a class="btn-goto" href="' + esc(safeChanUrl) + '" target="_blank" rel="noopener noreferrer">' + ICONS.send.replace('viewBox','style="width:15px;height:15px" viewBox') + ' تنفيذ المهمة</a>' : '';
    var linksToday = linksTodayCount(car.id, platform);
    var campaignHtml = '';
    var actionsHtml;
    if(camp){
      var pct = Math.min(100, Math.round((camp.done / camp.target) * 100));
      campaignHtml =
        '<div class="mini-progress-wrap" style="margin-top:12px">' +
          '<div class="mini-progress-label"><span>تقدم الحملة</span><span>' + camp.done + ' / ' + camp.target + '</span></div>' +
          '<div class="mini-progress-track"><div class="mini-progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>';
      var campAction = isMessaging ? "register-campaign" : "register-campaign-with-link";
      actionsHtml =
        '<div class="slot-actions">' + gotoHtml + linkHtml +
          '<input class="input" type="number" min="1" id="camp-qty-' + platform + '"' + (pending?' disabled':'') + ' placeholder="الكمية" style="width:78px;flex-shrink:0;text-align:center;padding:13px 8px" />' +
          '<button class="btn-publish' + (pending?' saving':'') + '" data-action="' + campAction + '" data-car="' + car.id + '" data-platform="' + platform + '"' + (pending?' disabled':'') + '>' + (pending ? '<span class="spin-dot"></span>' : 'تسجيل') + '</button>' +
        '</div>';
    } else {
      var pubAction = isMessaging ? "publish" : "publish-with-link";
      actionsHtml =
        '<div class="slot-actions">' + gotoHtml + linkHtml +
          '<button class="btn-publish' + (doneToday?' btn-publish-done':'') + (pending?' saving':'') + '" data-action="' + pubAction + '" data-car="' + car.id + '" data-platform="' + platform + '"' + (pending?' disabled':'') + '>' + (pending ? '<span class="spin-dot"></span>' : (ICONS.check.replace('viewBox','style="width:18px;height:18px" viewBox') + (doneToday ? 'نشر مرة أخرى' : 'تم النشر'))) + '</button>' +
        '</div>';
    }
    return '<div class="card slot' + (justPub?' pop':'') + (doneToday?' slot-done':'') + '">' +
      '<div class="slot-bar" style="background:' + (doneToday ? '#34d399' : u.text) + '"></div>' +
      '<div class="slot-body">' +
        '<div class="slot-head">' +
          '<div class="platform-icon" style="background:' + meta.bg + '">' + meta.emoji + '</div>' +
          '<div class="slot-label">' + esc(meta.label) + '</div>' +
          (doneToday ?
            '<span class="done-badge">' + ICONS.check.replace('viewBox','style="width:11px;height:11px" viewBox') + ' تم اليوم' + (linksToday>0 ? ' <span class="links-count-badge">· 🔗' + linksToday + '</span>' : '') + '</span>' :
            '<span class="prio-badge" style="' + prio.chip + '">' + prio.label + '</span>'
          ) +
        '</div>' +
        '<p class="car-name">🚗 ' + esc(car.name) + '</p>' +
        '<div class="fresh-pill" style="background:' + u.bg + ';color:' + u.text + '">' +
          '<span class="fresh-dot" style="background:' + u.text + '"></span>' + formatRelative(ts) +
        '</div>' +
        campaignHtml +
        actionsHtml +
      '</div>' +
    '</div>';
  }

  function screenToday(){
    var activePlatforms = effectiveChannels().filter(function(p){ return p.active; });
    var body;
    if(activePlatforms.length === 0){
      body = '<div class="empty-state"><div class="box">' + ICONS.send.replace('viewBox','style="width:24px;height:24px;color:#6c6c74" viewBox') + '</div>' +
        '<p class="t1">لا توجد قنوات نشر مفعّلة</p><p class="t2">أضف قناة من تبويب "القنوات"</p></div>';
    } else {
      var withStatus = activePlatforms.map(function(p){
        var car = suggestionFor(p.id);
        var doneToday = car ? isToday(car.lastPublished[p.id]) : false;
        var urgency = car ? urgencyScore(car, p.id) : -1;
        return { platform:p, doneToday:doneToday, urgency:urgency };
      });
      var doneCount = withStatus.filter(function(x){ return x.doneToday; }).length;
      var total = withStatus.length;
      var pct = total ? Math.round((doneCount/total)*100) : 0;
      var allDone = total > 0 && doneCount === total;

      /* pending channels first (most urgent first among them), completed ones after */
      var ordered = withStatus.slice().sort(function(a,b){
        if(a.doneToday !== b.doneToday) return a.doneToday ? 1 : -1;
        return b.urgency - a.urgency;
      });

      var progressCard =
        '<div class="progress-card' + (allDone?' all-done':'') + '">' +
          '<div class="progress-head">' +
            '<p class="progress-title">' + (allDone ? '🎉 خلّصت خطة اليوم بالكامل' : 'خطة اليوم') + '</p>' +
            '<span class="progress-count">' + doneCount + ' / ' + total + '</span>' +
          '</div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '<p class="progress-sub">' + (allDone ? 'كل القنوات اتنشرت اليوم — تقدر تنشر تاني أي وقت' : (total - doneCount) + ' قناة متبقية للنشر النهارده' ) + '</p>' +
        '</div>';

      body = progressCard + alertsPanel() + '<div class="today-grid">' + ordered.map(function(x){ return slotCard(x.platform.id); }).join("") + '</div>';
    }
    return topbar("مهام اليوم", "خطة نشر اليوم لكل قناة") + '<div class="content">' + body + '</div>';
  }

  /* ---------------- alerts ---------------- */
  var ALERT_OVERDUE_DAYS = 7;

  function computeAlerts(){
    var alerts = [];
    var cars = activeCars();
    var plats = effectiveChannels().filter(function(p){ return p.active; });
    cars.forEach(function(car){
      plats.forEach(function(p){
        if(campaignComplete(car, p.id)) return;
        var ts = car.lastPublished[p.id];
        if(ts === undefined || ts === null){
          alerts.push({ level:"warn", text: 'لسه ما نشرتش "' + car.name + '" في ' + p.label, sortDays: 9999 });
        } else {
          var days = daysSince(ts);
          if(days !== null && days >= ALERT_OVERDUE_DAYS){
            alerts.push({ level:"urgent", text: 'لم تُنشر "' + car.name + '" في ' + p.label + ' منذ ' + days + ' يوم', sortDays: days });
          }
        }
      });
    });
    alerts.sort(function(a,b){
      if(a.level !== b.level) return a.level === "urgent" ? -1 : 1;
      return b.sortDays - a.sortDays;
    });
    return alerts;
  }

  function alertsPanel(){
    var alerts = computeAlerts();
    if(alerts.length === 0) return "";
    var showAll = state.showAllAlerts;
    var visible = showAll ? alerts : alerts.slice(0, 3);
    var items = visible.map(function(a){
      var dotColor = a.level === "urgent" ? "#E8192C" : "#F5A623";
      return '<div class="alert-item"><span class="alert-dot" style="background:' + dotColor + '"></span><span class="alert-text">' + esc(a.text) + '</span></div>';
    }).join("");
    var toggle = alerts.length > 3 ?

  function filteredMgmtCars(){
    var q = state.mgmtSearch.trim().toLowerCase();
    return state.cars.filter(function(c){
      if(state.mgmtFilter === "active" && !c.active) return false;
      if(state.mgmtFilter === "inactive" && c.active) return false;
      if(q && c.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function(a,b){
      if(a.active !== b.active) return a.active ? -1 : 1;
      var pw = PRIORITY_META[b.priority].weight - PRIORITY_META[a.priority].weight;
      if(pw !== 0) return pw;
      return a.name.localeCompare(b.name, "ar");
    });
  }

  function mgmtChip(value, label){
    var active = state.mgmtFilter === value;
    return '<button class="chip' + (active?' active':'') + '" data-action="mgmt-filter" data-value="' + value + '">' + label + '</button>';

  function completionPct(car){
    var campKeys = car.campaign ? Object.keys(car.campaign) : [];
    if(campKeys.length > 0){
      var totalTarget = 0, totalDone = 0;
      campKeys.forEach(function(pid){
        var e = car.campaign[pid];
        totalTarget += e.target;
        totalDone += Math.min(e.done, e.target);
      });
      return totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) : 0;
    }
    var activePlats = effectiveChannels().filter(function(p){ return p.active; });
    if(activePlats.length === 0) return 0;
    var published = activePlats.filter(function(p){
      var v = car.lastPublished[p.id];
      return v !== undefined && v !== null;
    }).length;
    return Math.round((published / activePlats.length) * 100);
  }

      (!state.isAdmin ? '<p style="font-size:11px;color:var(--text-5);margin:0 0 10px;line-height:1.6">التعديل ده هيفضل خاص بيك بس، ومش هيأثر على باقي العملاء.</p>' : '') +
      '<div class="mgmt-actions">' +
        '<button class="mgmt-btn" data-action="cancel-gchan-edit">إلغاء</button>' +
        (g.overridden ? '<button class="mgmt-btn" data-action="reset-gchan-override" data-channel="' + g.id + '">استرجاع الافتراضي</button>' : '') +
        '<button class="mgmt-btn primary" data-action="save-gchan-edit" data-channel="' + g.id + '">حفظ</button>' +
      '</div>' +
    '</div>';
  }

  function gItem(g){
    if(state.editingGlobalChannelId === g.id) return gEditForm(g);
    var isConfirm = state.confirmDeleteId === "gchan:" + g.id;
    return '<div class="chan-item">' +
      '<div class="chan-emoji" style="background:' + g.bg + '">' + esc(g.emoji) + '</div>' +
      '<div class="chan-mid">' +
        '<p class="chan-name">' + esc(g.label) + (g.overridden ? ' <span style="color:var(--text-5);font-weight:700">(معدّلة عندك)</span>' : '') + '</p>' +
        '<p class="chan-sub"><span class="chan-type-badge ' + (g.messaging?'messaging':'link') + '">' + (g.messaging ? 'قناة رسائل' : 'قناة روابط') + '</span><span style="color:' + (g.active ? "#34d399" : "#8b8b93") + '">' + (g.active ? "مفعّلة" : "موقوفة") + '</span></p>' +
        (!g.messaging && g.url ? '<p class="cat-chan-url" style="margin-top:4px">' + esc(g.url) + '</p>' : '') +
      '</div>' +
      '<div class="chan-actions">' +
        '<button class="chan-icon-btn" data-action="edit-gchan" data-channel="' + g.id + '">' + ICONS.edit + '</button>' +
        (state.isAdmin ? '<button class="chan-icon-btn" data-action="toggle-gchan-active" data-channel="' + g.id + '">' + (g.active ? ICONS.pause : ICONS.play) + '</button>' : '') +
        (state.isAdmin ? (isConfirm ?
          '<button class="chan-icon-btn danger-confirm" data-action="gchan-confirm-delete" data-channel="' + g.id + '">تأكيد</button>' :
          '<button class="chan-icon-btn" data-action="gchan-ask-delete" data-channel="' + g.id + '">' + ICONS.trash + '</button>'
        ) : '') +
      '</div>' +
    '</div>';
  }

  function screenChannels(){
    var globalListHtml = state.globalChannels.length === 0
      ? '<p style="text-align:center;color:#8a8a92;font-size:12.5px;padding:14px 0">لا توجد قنوات عامة بعد' + (state.isAdmin ? '' : ' — لسه الأدمن ما ضافش قنوات') + '</p>'
      : '<div class="chan-list">' + effectiveChannels().filter(function(c){ return c.scope==="global"; }).map(gItem).join("") + '</div>';

    var globalSection =
      '<p class="section-label" style="font-size:12px;font-weight:800;color:var(--text-4);margin:0 0 10px">القنوات العامة</p>' +
      (state.isAdmin ? gAddCard() : '') +
      globalListHtml;

    var addCard =
      '<div class="chan-add-card">' +
        '<p style="margin:0 0 10px;font-size:13px;font-weight:800;color:var(--text-3)">أضف قناة خاصة بيك</p>' +
        '<div class="chan-add-row">' +
          '<input class="input chan-emoji-input" id="new-chan-emoji" value="' + esc(newChannelDraft.emoji) + '" maxlength="4" placeholder="🚀" />' +
          '<input class="input" id="new-chan-label" value="' + esc(newChannelDraft.label) + '" placeholder="مثال: فيسبوك ماركت بليس" />' +
        '</div>' +
        '<div class="chan-type-toggle">' +
          '<button class="chan-type-opt' + (!newChannelDraft.messaging?' active':'') + '" data-action="set-new-channel-type" data-value="0">📎 قناة روابط</button>' +
          '<button class="chan-type-opt' + (newChannelDraft.messaging?' active':'') + '" data-action="set-new-channel-type" data-value="1">💬 قناة رسائل</button>' +
        '</div>' +
        (!newChannelDraft.messaging ? '<div style="margin:8px 0">' + chanUrlField("new", newChannelDraft.url, "new-chan-url-") + '</div>' : '') +
        '<p style="font-size:11px;color:var(--text-5);margin:0 0 4px;line-height:1.6">قنوات الرسائل (واتساب/تيليجرام/SMS) مبتفتحش خانة روابط عند النشر، لأن النشر فيها بيكون بأرقام مش لينكات.</p>' +
        '<button class="submit-btn" style="margin-top:10px" data-action="submit-channel"' + (newChannelDraft.label.trim() ? '' : ' disabled') + '>' + ICONS.plus.replace('viewBox','style="width:16px;height:16px;display:inline-block;vertical-align:-3px" viewBox') + ' إضافة القناة</button>' +
      '</div>';

    var listHtml = state.platforms.length === 0
      ? '<p style="text-align:center;color:#8a8a92;font-size:13px;padding:20px 0">لا توجد قنوات خاصة بعد</p>'
      : '<div class="chan-list">' + state.platforms.map(chanItem).join("") + '</div>';

    var privateSection =
      '<p class="section-label" style="font-size:12px;font-weight:800;color:var(--text-4);margin:18px 0 10px">قنواتي الخاصة</p>' +
      addCard + listHtml;

    return topbar("قنوات النشر", "أضف أو أوقف أو عدّل قنوات النشر") + '<div class="content">' + globalSection + privateSection + '</div>';
  }

  function screenStats(){
    var s = computeStats();
    var grid =
      '<div class="stat-grid">' +
        statCard(ICONS.layers, "#38bdf8", "rgba(56,189,248,.1)", s.activeCount, "سيارات نشطة") +
        statCard(ICONS.send, "#34d399", "rgba(52,211,153,.1)", s.postsToday, "منشورات اليوم") +
        statCard(ICONS.calendar, "#F5A623", "rgba(245,166,35,.1)", s.postsThisWeek, "منشورات الأسبوع") +
        statCard(ICONS.trophy, "#E8192C", "rgba(232,25,44,.1)", s.mostPublished ? s.mostPublished.totalPublishes : "—", "الأكثر نشرًا") +
      '</div>';
    var highlights = "";
    if(s.mostPublished){
      highlights += hlCard(ICONS.trophy, "#F5A623", "أكثر سيارة تم نشرها", s.mostPublished.name, "نُشرت " + s.mostPublished.totalPublishes + " " + (s.mostPublished.totalPublishes===1?"مرة":"مرات"));
    }
    if(s.staleCar){
      highlights += hlCard(ICONS.alarm, "#E8192C", "لم تُنشر منذ أطول مدة", s.staleCar.name, formatRelative(globalLast(s.staleCar)));
    }
    return topbar("لوحة الإحصائيات", "نظرة سريعة على أداء النشر") + '<div class="content">' + grid + highlights + '</div>';
  }

  function statCard(icon, color, bg, value, label){
    return '<div class="stat-card">' +
      '<div class="stat-icon" style="background:' + bg + ';color:' + color + '">' + icon.replace('viewBox','style="width:18px;height:18px" viewBox') + '</div>' +
      '<p class="stat-val" style="color:' + color + '">' + esc(value) + '</p>' +
      '<p class="stat-lbl">' + esc(label) + '</p>' +
    '</div>';
  }
  function hlCard(icon, color, title, name, detail){
    return '<div class="hl-card">' +
      '<div class="hl-icon" style="color:' + color + '">' + icon.replace('viewBox','style="width:20px;height:20px" viewBox') + '</div>' +
      '<div style="min-width:0"><p class="hl-title">' + esc(title) + '</p>' +
      '<p class="hl-name">🚗 ' + esc(name) + '</p>' +
      '<p class="hl-detail">' + esc(detail) + '</p></div>' +
    '</div>';
  }

  var TABS = [
    { id:"today", label:"اليوم", icon:ICONS.today },
    { id:"manage", label:"السيارات", icon:ICONS.cars },
    { id:"channels", label:"القنوات", icon:ICONS.broadcast },
    { id:"republish", label:"إعادة النشر", icon:ICONS.republish },
    { id:"stats", label:"الإحصائيات", icon:ICONS.stats }
  ];

  function visibleTabs(){
    return state.isAdmin
      ? TABS.concat([{ id:"subscriptions", label:"الاشتراكات", icon:ICONS.crown }])
      : TABS;
  }

  function bottomNav(){
    return '<div class="bottomnav"><div class="bottomnav-inner">' +
      visibleTabs().map(function(t){
        var active = state.tab === t.id;
        return '<button class="navbtn' + (active?' active':'') + '" data-action="switch-tab" data-value="' + t.id + '">' +
          (active ? '<span class="bar"></span>' : '') + t.icon + '<span>' + t.label + '</span></button>';
      }).join("") +
    '</div></div>';
  }

  function toast(){
    if(!state.toast) return '';
    return '<div class="toast-wrap"><div class="toast">' + ICONS.check.replace('viewBox','style="width:16px;height:16px;color:#34d399" viewBox') + '<span>' + esc(state.toast) + '</span></div></div>';
  }

  function publishModalHtml(){
    var pm = state.publishModal;
    if(!pm) return '';
    var meta = effectiveChannels().find(function(p){ return p.id === pm.platform; });
    var label = meta ? meta.label : pm.platform;
    return '<div class="pm-backdrop" data-action="publish-modal-backdrop">' +
      '<div class="pm-sheet" data-stop-close="1">' +
        '<div class="pm-handle"></div>' +
        '<p class="pm-title">روابط النشر — ' + esc(label) + '</p>' +
        (pm.qty ?
          '<span class="pm-qty-chip">📍 ' + pm.qty + ' مكان نشر</span>' : '') +
        '<p class="pm-sub">لو عندك روابط المنشورات، الصقها هنا (رابط في كل سطر) — الخطوة دي اختيارية بالكامل.</p>' +
        '<textarea class="pm-textarea" id="pm-links" dir="ltr" placeholder="https://...' + "\n" + 'https://..."></textarea>' +
        '<p class="pm-hint">سيب الحقل فاضي واضغط "تخطي" لو مفيش روابط دلوقتي.</p>' +
        '<div class="pm-actions">' +
          '<button class="pm-skip" data-action="publish-modal-skip">تخطي</button>' +
          '<button class="pm-confirm" data-action="publish-modal-confirm">تم النشر</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function statusBanner(){
    if(state.syncFlash){
      return '<div class="status-banner online">' + ICONS.check.replace('viewBox','style="width:13px;height:13px" viewBox') + ' تم الاتصال — جارٍ مزامنة أي تغييرات محفوظة</div>';
    }
    if(!state.online){
      return '<div class="status-banner offline"><span class="offline-dot"></span> غير متصل — التعديلات هتتحفظ محليًا وتتزامن أول ما النت يرجع</div>';
    }
    return '';
  }

  function renderSubscriptionBlockedScreen(){
    return '<div class="login-wrap">' +
      '<div class="logo login-logo" style="background:var(--ink-700)">' + ICONS.crown.replace('viewBox','style="width:20px;height:20px;color:#8a8a92" viewBox') + '</div>' +
      '<h1 class="login-title">الاشتراك غير مفعّل</h1>' +
      '<p class="login-sub">حسابك موقوف حاليًا. تواصل مع إدارة النظام لتفعيل الاشتراك.</p>' +

    '</div>';
  }

  /* ---------------- subscriptions (admin only) ---------------- */
  state.editingSubId = null;
  var subEditDraft = { start:"", end:"", phone:"" };

  function fmtDate(ts){
    if(!ts) return "—";
    var d = new Date(ts);
    return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
  }
  function dateInputVal(ts){
    if(!ts) return "";
    var d = new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function waDigits(phone){ return String(phone||"").replace(/[^0-9]/g,""); }
  function daysLeft(endTs){
    if(!endTs) return null;
    return Math.ceil((endTs - Date.now()) / 86400000);
  }

  function subRow(acc, index){
    var isActive = acc.subscriptionStatus === "active";
    var isMe = currentUser && acc.id === currentUser.uid;
    var dl = daysLeft(acc.subscriptionEnd);
    var expiryClass = dl === null ? "" : (dl < 0 ? "sub-expired" : (dl <= 7 ? "sub-near" : ""));

    if(state.editingSubId === acc.id){
      return '<tr class="sub-edit-row"><td colspan="6">' +
        '<div class="sub-edit-card">' +
          '<div class="field"><label>بداية الاشتراك</label><input class="input" type="date" id="se-start" value="' + esc(subEditDraft.start) + '" /></div>' +
          '<div class="field"><label>نهاية الاشتراك</label><input class="input" type="date" id="se-end" value="' + esc(subEditDraft.end) + '" /></div>' +
          '<div class="field"><label>رقم واتساب (مع كود الدولة)</label><input class="input" dir="ltr" style="text-align:left" id="se-phone" placeholder="e.g. 20100xxxxxxx" value="' + esc(subEditDraft.phone) + '" /></div>' +
          '<div class="mgmt-actions">' +
            '<button class="mgmt-btn" data-action="sub-cancel-edit">إلغاء</button>' +
            '<button class="mgmt-btn primary" data-action="sub-save" data-account="' + acc.id + '">حفظ</button>' +
          '</div>' +
        '</div>' +
      '</td></tr>';
    }

    return '<tr class="' + expiryClass + '">' +
      '<td class="sub-num">' + (index+1) + '</td>' +
      '<td class="sub-email-cell">' +
        '<div class="sub-email" dir="ltr" style="unicode-bidi:plaintext">' + esc(acc.email || acc.id) + '</div>' +
        (acc.displayName ? '<div class="sub-dname">' + esc(acc.displayName) + (isMe?' (أنت)':'') + '</div>' : '') +
      '</td>' +
      '<td>' + fmtDate(acc.subscriptionStart) + '</td>' +
      '<td>' + fmtDate(acc.subscriptionEnd) + (dl !== null ? '<div class="sub-days">' + (dl < 0 ? 'منتهي منذ ' + Math.abs(dl) + 'ي' : dl + 'ي متبقي') + '</div>' : '') + '</td>' +
      '<td><span class="status-badge' + (isActive ? ' active' : ' inactive') + '">' + (isActive ? 'مفعّل' : 'موقوف') + '</span></td>' +
      '<td class="sub-actions-cell">' +
        '<button class="chan-icon-btn" data-action="sub-edit" data-account="' + acc.id + '" title="تعديل التواريخ والرقم">' + ICONS.edit + '</button>' +
        (acc.phone ?
          '<a class="chan-icon-btn" href="https://wa.me/' + waDigits(acc.phone) + '?text=' + encodeURIComponent('تذكير بتجديد اشتراكك في نظام Lam7Track' + (acc.subscriptionEnd ? '، تاريخ الانتهاء: ' + fmtDate(acc.subscriptionEnd) : '') + '.') + '" target="_blank" rel="noreferrer" title="تذكير واتساب" style="color:#34d399">' + ICONS.send + '</a>' :
          '<span class="chan-icon-btn" style="opacity:.35" title="أضف رقم واتساب الأول">' + ICONS.send + '</span>'
        ) +
        (isMe ? '' :
          '<button class="chan-icon-btn" data-action="toggle-subscription" data-account="' + acc.id + '" data-current="' + acc.subscriptionStatus + '" title="' + (isActive?'إيقاف':'تفعيل') + '" style="color:' + (isActive?'var(--red)':'#34d399') + '">' + (isActive ? ICONS.pause : ICONS.play) + '</button>'
        ) +
      '</td>' +
    '</tr>';
  }

  function screenSubscriptions(){
    var body;
    if(!state.adminAccountsLoaded){
      body = '<p style="text-align:center;color:#8a8a92;font-size:13px;padding:40px 0">جارٍ تحميل الحسابات...</p>';
    } else if(state.adminAccounts.length === 0){
      body = '<div class="empty-state"><div class="box">' + ICONS.crown.replace('viewBox','style="width:24px;height:24px;color:#6c6c74" viewBox') + '</div>' +
        '<p class="t1">لا يوجد حسابات بعد</p></div>';
    } else {
      body = '<div class="sub-table-wrap"><table class="sub-table">' +
        '<thead><tr><th>#</th><th>الحساب</th><th>البداية</th><th>النهاية</th><th>الحالة</th><th>إجراءات</th></tr></thead>' +
        '<tbody>' + state.adminAccounts.map(function(acc,i){ return subRow(acc,i); }).join("") + '</tbody>' +
      '</table></div>';
    }
    return topbar("إدارة الاشتراكات", state.adminAccounts.length + " حساب إجمالاً") + '<div class="content">' + body + '</div>';
  }

  function migrationBanner(){
    if(!state.migrationAvailable) return '';
    return '<div class="migration-banner">' +
      '<p class="migration-text">' + (state.migrating ? 'جارٍ استيراد بياناتك القديمة...' : 'لقينا بيانات قديمة من قبل تسجيل الدخول — تحب تستوردها لحسابك؟') + '</p>' +
      (state.migrating ? '' :
        '<div class="migration-actions">' +
          '<button class="mgmt-btn" data-action="dismiss-migration">تجاهل</button>' +
          '<button class="mgmt-btn primary" data-action="run-migration">استيراد الآن</button>' +
        '</div>'
      ) +
    '</div>';
  }
