<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0a0a0c" />
<title>Lam7Track</title>
<meta name="description" content="نظام تتبع التسويق من لمح" />
<link rel="icon" type="image/png" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" id="app-manifest" href="" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<!-- تسريع فتح التطبيق أول مرة: نفتح الاتصال بسيرفرات Firebase بدري
     (قبل ما جافاسكريبت يوصل لسطر الـ import)، ونبدأ تنزيل ملفات
     الـ SDK بالتوازي مع تحليل الصفحة بدل ما ينتظروا لحد ما السكريبت
     يتنفذ. ده مبيغيرش أي سلوك، بس بيقصر وقت إنشاء الاتصال (DNS/TLS)
     والتنزيل. -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js" />
<style>
  :root{
    --ink-950:#0a0a0c; --ink-900:#0d0d0d; --ink-850:#141417; --ink-800:#1a1a1f;
    --ink-700:#232329; --ink-600:#2e2e36; --ink-500:#3f3f49;
    --text-1:#f2f1ef; --text-2:#c9c9ce; --text-3:#a9a9b0; --text-4:#8a8a92; --text-5:#6c6c74;
    --red:#E8192C; --red-dark:#B01121; --gold:#F5A623;
    --green:#34d399; --sky:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ink-900); color:var(--text-1);
    font-family:'Cairo',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none; line-height:1.5; font-size:15px;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px;}
  a{color:inherit}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--ink-600); border-radius:999px;}

  /* topbar */
  .topbar{position:sticky; top:0; z-index:20; background:rgba(13,13,13,.88); backdrop-filter:blur(14px); border-bottom:1px solid var(--ink-700);}
  .topbar-inner{max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; display:flex; align-items:center; gap:12px;}
  .logo{width:36px; height:36px; border-radius:11px; background:var(--ink-900); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); padding:4px; overflow:hidden;}
  .logo span{color:#fff; font-weight:900; font-size:14px;}
  .logo img{width:100%; height:100%; object-fit:contain;}
  .topbar h1{font-size:17px; font-weight:800; margin:0; line-height:1.2; color:#fff;}
  .topbar p{font-size:13.5px; color:var(--text-4); margin:2px 0 0;}

  .content{padding:16px;}

  /* bottom nav */
  .bottomnav{position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(13,13,13,.92); backdrop-filter:blur(14px); border-top:1px solid var(--ink-700); padding-bottom:env(safe-area-inset-bottom);}
  .bottomnav-inner{max-width:520px; margin:0 auto; display:grid; grid-template-columns:repeat(var(--tab-count,6),1fr);}
  .navbtn{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:9px 0 7px; color:var(--text-5); transition:transform .1s;}
  .navbtn:active{transform:scale(.93);}
  .navbtn.active{color:var(--red);}
  .navbtn .bar{position:absolute; top:0; width:32px; height:2px; border-radius:2px; background:var(--red);}
  .navbtn svg{width:19px; height:19px;}
  .navbtn span{font-size:11px; font-weight:700;}

  /* cards */
  .card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6); overflow:hidden;}
  .slot{margin-bottom:12px; animation:rise .28s ease-out;}
  .slot-bar{height:4px; width:100%;}
  .slot-body{padding:16px;}
  .slot-head{display:flex; align-items:center; gap:10px;}
  .platform-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
  .slot-label{font-size:14px; font-weight:700; color:var(--text-2); flex:1; min-width:0;}
  .prio-badge{font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; border:1px solid; flex-shrink:0; white-space:nowrap;}
  .car-name{font-size:19px; font-weight:800; color:#fff; margin:12px 0 0; line-height:1.35;}
  .car-notes{display:flex; gap:6px; align-items:flex-start; font-size:14px; color:var(--text-3); margin-top:5px; line-height:1.4;}
  .fresh-pill{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:800; margin-top:12px;}
  .fresh-dot{width:6px; height:6px; border-radius:999px;}
  .slot-actions{display:flex; gap:8px; margin-top:16px;}
  .btn-link{display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 15px; font-size:14px; font-weight:700; color:var(--text-2); flex-shrink:0; transition:transform .1s;}
  .btn-link:active{transform:scale(.95);}
  .btn-goto{display:flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid rgba(232,25,44,.4); background:rgba(232,25,44,.1); padding:13px 15px; font-size:14px; font-weight:800; color:var(--red); flex-shrink:0; transition:transform .1s;}
  .btn-goto:active{transform:scale(.95);}
  .btn-publish{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; background:var(--red); padding:13px 16px; font-size:15.5px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .btn-publish:active{transform:scale(.95);}
  .empty-slot{border:1.5px dashed var(--ink-600); border-radius:16px; padding:22px; text-align:center; background:rgba(20,20,23,.4); margin-bottom:12px;}
  .empty-slot .platform-icon{margin:0 auto;}
  .empty-slot p{margin:8px 0 0;}
  .empty-slot .t1{font-size:14.5px; font-weight:800; color:#fff;}
  .empty-slot .t2{font-size:13.5px; color:var(--text-4); margin-top:3px;}

  /* daily plan progress */
  .progress-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .progress-card.all-done{border-color:rgba(52,211,153,.4); background:linear-gradient(135deg, rgba(52,211,153,.08), var(--ink-850));}
  .progress-head{display:flex; align-items:center; justify-content:space-between;}
  .progress-title{font-size:15.5px; font-weight:800; color:#fff;}
  .progress-count{font-size:14px; font-weight:800; color:var(--red);}
  .num-ltr{direction:ltr; unicode-bidi:isolate; display:inline-block;}
  .all-done .progress-count{color:#34d399;}
  .progress-track{height:8px; border-radius:999px; background:var(--ink-700); margin-top:10px; overflow:hidden;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--red), var(--gold)); transition:width .4s ease;}
  .all-done .progress-fill{background:#34d399;}
  .progress-sub{font-size:13.5px; color:var(--text-4); font-weight:600; margin-top:8px;}

  /* alerts panel */
  .alerts-panel{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:14px 16px; margin-bottom:14px;}
  .alerts-head{display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:800; color:#fff; margin-bottom:8px;}
  .alerts-toggle{font-size:12.5px; font-weight:800; color:var(--red); background:none; padding:2px 4px;}
  .alert-item{display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-top:1px solid var(--ink-700);}
  .alert-item:first-of-type{border-top:none;}
  .alert-dot{width:6px; height:6px; border-radius:999px; margin-top:6px; flex-shrink:0;}
  .alert-text{font-size:13.5px; color:var(--text-2); line-height:1.6;}

  /* mini progress (car completion) */
  .mini-progress-wrap{margin-top:10px;}
  .mini-progress-label{display:flex; justify-content:space-between; font-size:12px; font-weight:700; color:var(--text-4); margin-bottom:4px;}
  .mini-progress-track{height:5px; border-radius:999px; background:var(--ink-700); overflow:hidden;}
  .mini-progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--gold), #34d399); transition:width .4s ease;}

  .done-badge{display:flex; align-items:center; gap:4px; font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; background:rgba(52,211,153,.15); color:#34d399; flex-shrink:0; white-space:nowrap;}
  .slot.slot-done{opacity:.72;}
  .slot.slot-done:hover{opacity:1;}
  .btn-publish-done{background:var(--ink-700); box-shadow:none; color:var(--text-2);}

  /* today plan sections (pending / done) */
  .section-head-row{display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px; gap:10px;}
  .section-title{font-size:14px; font-weight:800; color:var(--text-3); margin:18px 0 10px; letter-spacing:.2px;}
  .section-head-row .section-title{margin:0;}
  .section-toggle{font-size:12.5px; font-weight:800; color:var(--red); background:rgba(232,25,44,.1); border:1px solid rgba(232,25,44,.3); border-radius:999px; padding:6px 12px; flex-shrink:0; white-space:nowrap; transition:transform .1s;}
  .section-toggle:active{transform:scale(.95);}
  .section-divider{height:1px; background:var(--ink-700); margin:20px 0 4px;}

  .done-list{display:flex; flex-direction:column; gap:8px;}
  .done-item{display:flex; align-items:center; gap:10px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:14px; padding:10px 12px; opacity:.8; transition:opacity .15s;}
  .done-item:hover{opacity:1;}
  .done-item-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14.5px; flex-shrink:0;}
  .done-item-body{min-width:0; flex:1;}
  .done-item-title{font-size:14px; font-weight:700; color:#fff; margin:0; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .done-item-sub{font-size:12.5px; color:var(--text-4); margin:2px 0 0; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .done-item-check{width:20px; height:20px; border-radius:999px; background:rgba(52,211,153,.15); color:#34d399; display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(.97);} 100%{transform:scale(1);}}
  @keyframes splashFadeUp{0%{opacity:0;transform:translateY(10px);} 100%{opacity:1;transform:translateY(0);}}
  @keyframes splashShimmer{0%{background-position:200% center;} 100%{background-position:-200% center;}}
  .splash-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;gap:6px}
  .splash-logo{width:min(46vw,190px);animation:pop 2.2s ease-in-out infinite}
  .splash-title{font-size:26px;font-weight:900;color:#fff;margin:18px 0 2px;animation:splashFadeUp .7s ease-out .1s both}
  .splash-sub{font-size:14px;color:var(--text-4,#9a9aa2);margin:0 0 14px;animation:splashFadeUp .7s ease-out .25s both}
  .splash-tagline{
    font-size:13.5px; font-weight:700; margin:0;
    background:linear-gradient(90deg,#E8192C,#ffffff,#E8192C,#ffffff);
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:splashFadeUp .7s ease-out .4s both, splashShimmer 3.2s linear infinite 1.1s;
  }
  .pop{animation:pop .25s ease-out;}

  /* republish list */
  .rq-item{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:13px 14px; margin-bottom:10px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .rq-rank{width:28px; height:28px; border-radius:999px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:var(--text-4); flex-shrink:0;}
  .rq-mid{flex:1; min-width:0;}
  .rq-name-row{display:flex; align-items:center; gap:8px;}
  .rq-name{font-size:15.5px; font-weight:800; color:#fff; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .rq-days-box{flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:12px; padding:6px 10px;}
  .rq-days-num{font-size:18px; font-weight:900; line-height:1;}
  .rq-days-lbl{font-size:10.5px; font-weight:800; margin-top:2px;}
  .rq-del{flex-shrink:0; width:32px; height:32px; border-radius:10px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-5); transition:transform .1s;}
  .rq-del:active{transform:scale(.9);}
  .rq-del.confirm{width:auto; padding:0 10px; background:var(--red); color:#fff; font-size:12px; font-weight:800; white-space:nowrap;}

  /* empty state */
  .empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:70px 20px;}
  .empty-state .box{width:56px; height:56px; border-radius:16px; background:var(--ink-850); border:1px solid var(--ink-700); display:flex; align-items:center; justify-content:center; margin-bottom:12px;}
  .empty-state .t1{font-size:15.5px; font-weight:800; color:#fff;}
  .empty-state .t2{font-size:14px; color:var(--text-4); margin-top:4px;}

  /* form */
  .field{display:block; margin-bottom:16px;}
  .field label{display:block; margin-bottom:6px; font-size:14px; font-weight:700; color:var(--text-3);}
  .input{width:100%; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 14px; font-size:15.5px; font-weight:600; color:#fff; outline:none; transition:border-color .15s;}
  .input::placeholder{color:#5c5c64;}
  .input:focus{border-color:var(--red);}
  textarea.input{resize:none;}
  .prio-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .chan-select-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chan-select-chip{border-radius:20px; border:1px solid var(--ink-600); background:var(--ink-800); padding:9px 14px; font-size:13.5px; font-weight:800; color:var(--text-4); transition:all .15s;}
  .chan-select-chip.active{background:rgba(232,25,44,.15); border-color:transparent; color:var(--red); transform:scale(1.03);}

  /* ===== فاصل القنوات العامة / الخاصة ===== */
  .chan-groups{display:flex; flex-direction:column; gap:0;}
  .chan-group-head{display:flex; align-items:center; gap:8px; margin:2px 0 10px; font-size:12.5px; font-weight:900; letter-spacing:.2px;}
  .chan-group-head .cg-count{font-size:10.5px; font-weight:800; border-radius:999px; padding:1px 8px; border:1px solid currentColor; opacity:.75;}
  .chan-group-head.global{color:var(--gold);}
  .chan-group-head.private{color:var(--sky);}
  .chan-group-head svg{width:14px; height:14px;}
  .chan-divider{position:relative; display:flex; align-items:center; justify-content:center; gap:10px; margin:20px 0 16px; height:22px;}
  .chan-divider::before,.chan-divider::after{content:""; flex:1; height:2px; border-radius:2px; animation:chanGlow 2.4s ease-in-out infinite;}
  .chan-divider::before{background:linear-gradient(270deg, transparent 0%, rgba(245,166,35,.85) 45%, rgba(232,25,44,.95) 100%); box-shadow:0 0 8px rgba(232,25,44,.35);}
  .chan-divider::after{background:linear-gradient(90deg, transparent 0%, rgba(56,189,248,.85) 45%, rgba(129,140,248,.95) 100%); box-shadow:0 0 8px rgba(56,189,248,.35);}
  .chan-divider .cd-gem{width:22px; height:22px; flex-shrink:0; transform:rotate(45deg); border-radius:6px; background:linear-gradient(135deg, var(--gold), var(--red) 50%, var(--sky)); box-shadow:0 0 14px rgba(232,25,44,.55), 0 0 22px rgba(56,189,248,.35); animation:chanPulse 2.4s ease-in-out infinite; display:flex; align-items:center; justify-content:center;}
  .chan-divider .cd-gem span{transform:rotate(-45deg); display:flex; color:#0b0b0d;}
  .chan-divider .cd-gem svg{width:11px; height:11px;}
  .chan-select-grid.g-private .chan-select-chip{border-style:dashed; border-color:rgba(56,189,248,.35);}
  .chan-select-grid.g-private .chan-select-chip.active{background:rgba(56,189,248,.15); border-style:solid; color:var(--sky);}
  @keyframes chanGlow{0%,100%{opacity:.6} 50%{opacity:1}}
  @keyframes chanPulse{0%,100%{transform:rotate(45deg) scale(1)} 50%{transform:rotate(45deg) scale(1.15)}}
  @media (prefers-reduced-motion:reduce){.chan-divider::before,.chan-divider::after,.chan-divider .cd-gem{animation:none}}
  .prio-opt{border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:13px 0; font-size:14px; font-weight:800; color:var(--text-4); text-align:center; transition:all .15s;}
  .prio-opt.active{transform:scale(1.03); border-color:transparent;}
  .prio-opt.active.high{background:rgba(232,25,44,.15); color:var(--red);}
  .prio-opt.active.medium{background:rgba(245,166,35,.15); color:var(--gold);}
  .prio-opt.active.low{background:rgba(63,63,73,.4); color:#b7b7be;}
  .submit-btn{width:100%; border-radius:12px; background:var(--red); padding:15px 0; font-size:16.5px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45); transition:transform .1s;}
  .submit-btn:disabled{opacity:.3; box-shadow:none;}
  .submit-btn:active:not(:disabled){transform:scale(.97);}

  /* toast */
  .toast-wrap{position:fixed; bottom:96px; left:0; right:0; z-index:40; display:flex; justify-content:center; padding:0 16px; pointer-events:none;}
  .toast{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:999px; padding:11px 18px; box-shadow:0 8px 24px -12px rgba(0,0,0,.6); font-size:14px; font-weight:700; color:#fff; animation:rise .25s ease-out;}

  /* offline / sync status banner */
  .status-banner{text-align:center; font-size:13px; font-weight:800; padding:9px 12px;}
  .status-banner.offline{background:var(--red); color:#fff;}
  .status-banner.online{background:#34d399; color:#062b1e;}
  .offline-dot{display:inline-block; width:7px; height:7px; border-radius:999px; background:#fff; margin-left:4px; animation:pop 1.4s ease-in-out infinite;}

  /* login screen */
  .login-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; max-width:420px; margin:0 auto;}
  .login-logo{width:64px; height:64px; border-radius:18px; margin-bottom:20px;}
  .login-logo span{font-size:22px;}
  .login-title{font-size:20px; font-weight:900; color:#fff; margin:0 0 8px;}
  .login-sub{font-size:14px; color:var(--text-4); line-height:1.7; margin:0 0 28px;}
  .google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:#fff; color:#1f1f1f; border-radius:12px; padding:14px 20px; font-size:15.5px; font-weight:800; box-shadow:0 8px 24px -12px rgba(0,0,0,.5); transition:transform .1s;}
  .google-btn:active{transform:scale(.97);}
  .login-error{margin-top:16px; font-size:13.5px; color:var(--red); line-height:1.7; background:rgba(232,25,44,.1); border:1px solid rgba(232,25,44,.3); border-radius:10px; padding:12px;}

  /* pending activation screen */
  .pending-badge{display:inline-flex; align-items:center; gap:6px; background:rgba(245,166,35,.12); border:1px solid rgba(245,166,35,.35); color:var(--gold); font-size:12px; font-weight:800; border-radius:999px; padding:6px 13px; margin-bottom:16px;}
  .pending-badge svg{width:13px; height:13px;}
  .whatsapp-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:#25D366; color:#fff; border-radius:12px; padding:14px 20px; font-size:15.5px; font-weight:800; box-shadow:0 0 0 1px rgba(37,211,102,.35), 0 8px 24px -10px rgba(37,211,102,.55); transition:transform .1s;}
  .whatsapp-btn:active{transform:scale(.97);}
  .mkt-item{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; border-bottom:1px solid var(--ink-700);}
  .mkt-item:last-child{border-bottom:none;}
  .mkt-name{font-size:15px; font-weight:800; color:#fff; line-height:1.4; min-width:0; overflow-wrap:break-word;}
  .mkt-phone{font-size:12.5px; color:var(--text-4); font-weight:600; margin-top:3px; direction:ltr; display:inline-block;}
  .mkt-contact-btn{display:flex; align-items:center; justify-content:center; gap:6px; flex-shrink:0; background:#25D366; color:#fff; border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:800; white-space:nowrap; transition:transform .1s;}
  .mkt-contact-btn:active{transform:scale(.94);}
  .mkt-contact-btn svg{width:14px; height:14px;}
  .mkt-actions{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}
  .mkt-pin-badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; color:var(--gold); background:rgba(245,166,35,.12); border:1px solid rgba(245,166,35,.35); border-radius:999px; padding:3px 9px; margin-top:6px; width:fit-content;}
  .mkt-role-badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; color:#38bdf8; background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.3); border-radius:999px; padding:3px 9px; width:fit-content; text-decoration:none;}
  a.mkt-role-badge{cursor:pointer;}
  a.mkt-role-badge:active{opacity:.75;}
  .mkt-pin-badge svg{width:10px; height:10px;}
  .mkt-admin-pin-btn{display:flex; align-items:center; justify-content:center; gap:5px; flex-shrink:0; background:var(--ink-800); border:1px solid var(--ink-600); color:var(--text-3); border-radius:10px; padding:8px 12px; font-size:12px; font-weight:800; white-space:nowrap; transition:transform .1s;}
  .mkt-admin-pin-btn.is-pinned{background:rgba(245,166,35,.12); border-color:rgba(245,166,35,.4); color:var(--gold);}
  .mkt-admin-pin-btn:active{transform:scale(.94);}
  .mkt-admin-pin-btn svg{width:13px; height:13px;}
  .mkt-request-pin-btn{display:flex; align-items:center; justify-content:center; gap:5px; flex-shrink:0; background:var(--ink-800); border:1px solid var(--ink-600); color:var(--text-3); border-radius:10px; padding:8px 12px; font-size:12px; font-weight:700; white-space:nowrap; transition:transform .1s;}
  .mkt-request-pin-btn:active{transform:scale(.94);}
  .mkt-request-pin-btn svg{width:12px; height:12px;}
  .pending-signout{margin-top:22px; font-size:13px; font-weight:700; color:var(--text-5); padding:8px 4px; transition:color .15s;}
  .pending-signout:active{color:var(--text-3);}

  /* account chip + menu */
  .account-chip-wrap{position:relative; flex-shrink:0;}
  .account-chip{width:34px; height:34px; border-radius:999px; overflow:hidden; background:var(--red); display:flex; align-items:center; justify-content:center; border:2px solid var(--ink-700);}
  .account-chip img{width:100%; height:100%; object-fit:cover;}
  .account-chip span{color:#fff; font-weight:900; font-size:14px;}
  .account-menu{position:absolute; top:42px; inset-inline-end:0; z-index:40; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:14px; padding:14px; width:200px; box-shadow:0 12px 30px -10px rgba(0,0,0,.7); animation:rise .2s ease-out;}
  .account-menu-name{font-size:14px; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-email{font-size:12.5px; color:var(--text-4); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .account-menu-signout{width:100%; margin-top:12px; border-radius:10px; background:var(--ink-700); padding:9px 0; font-size:13.5px; font-weight:800; color:#fff;}

  /* install app banner */
  .install-banner{display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, rgba(232,25,44,.12), var(--ink-850)); border:1px solid rgba(232,25,44,.3); border-radius:16px; padding:14px; margin:12px 16px 0; animation:rise .25s ease-out;}
  .install-banner .logo{width:44px; height:44px; border-radius:13px;}
  .install-banner-mid{flex:1; min-width:0;}
  .install-banner-title{font-size:14px; font-weight:800; color:#fff; line-height:1.3;}
  .install-banner-sub{font-size:12.5px; color:var(--text-4); margin-top:3px; line-height:1.6;}
  .install-banner-actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
  .install-btn{border-radius:10px; background:var(--red); padding:8px 14px; font-size:13px; font-weight:800; color:#fff; white-space:nowrap; box-shadow:0 6px 18px -8px rgba(232,25,44,.5);}
  .install-btn:active{transform:scale(.95);}
  .install-dismiss{border-radius:10px; background:var(--ink-800); border:1px solid var(--ink-600); padding:7px 14px; font-size:12.5px; font-weight:700; color:var(--text-4); white-space:nowrap;}
  .install-dismiss:active{transform:scale(.95);}
  .install-ios-steps{font-size:12.5px; color:var(--text-3); margin-top:8px; line-height:1.8; padding-top:8px; border-top:1px solid var(--ink-700);}
  .install-ios-steps b{color:#fff;}

  /* migration banner */
  .migration-banner{background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.3); border-radius:14px; padding:14px; margin:12px 16px 0;}
  .migration-text{font-size:14px; font-weight:700; color:var(--gold); line-height:1.6;}
  .migration-actions{display:flex; gap:8px; margin-top:10px;}

  /* stats */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .stat-card{background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .stat-icon{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:10px; font-size:16.5px;}
  .stat-val{font-size:26px; font-weight:900; line-height:1;}
  .stat-lbl{font-size:13.5px; font-weight:700; color:var(--text-4); margin-top:6px;}
  .hl-card{display:flex; align-items:center; gap:12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 1px 0 0 rgba(255,255,255,.04) inset, 0 8px 24px -12px rgba(0,0,0,.6);}
  .hl-icon{width:44px; height:44px; border-radius:12px; background:var(--ink-800); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .hl-title{font-size:13px; font-weight:700; color:var(--text-4);}
  .hl-name{font-size:15.5px; font-weight:800; color:#fff; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .hl-detail{font-size:13.5px; font-weight:600; color:var(--text-3); margin-top:2px;}

  /* management screen */
  .mgmt-toolbar{margin-bottom:14px;}
  .mgmt-search-box{display:flex; align-items:center; gap:8px; background:var(--ink-800); border:1px solid var(--ink-600); border-radius:12px; padding:11px 14px;}
  .mgmt-search-input{flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:14.5px; font-weight:600;}
  .mgmt-search-input::placeholder{color:#5c5c64;}
  .mgmt-filters{display:flex; gap:8px; margin-top:10px;}
  .chip{border-radius:999px; border:1px solid var(--ink-600); background:var(--ink-800); padding:7px 14px; font-size:13.5px; font-weight:700; color:var(--text-4); transition:all .15s;}
  .chip.active{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-item{margin-bottom:12px; animation:rise .25s ease-out;}
  .mgmt-item-body{padding:16px;}
  .mgmt-item-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .mgmt-name{font-size:17px; font-weight:800; color:#fff; line-height:1.35; min-width:0; flex:1; overflow-wrap:break-word; word-break:break-word; white-space:normal;}
  .mgmt-badges{display:flex; flex-wrap:wrap; justify-content:flex-start; gap:5px; margin-top:7px;}
  .mgmt-badges .status-badge, .mgmt-badges .prio-badge{font-size:10.5px; padding:3px 7px;}
  .status-badge{font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .status-badge.active{background:rgba(52,211,153,.15); color:#34d399;}
  .status-badge.inactive{background:rgba(139,139,147,.18); color:#8b8b93;}
  .mgmt-meta-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:13.5px; color:var(--text-3); font-weight:600;}
  .mgmt-meta-row b{color:#fff; font-weight:800;}
  .mgmt-plats-toggle{display:flex; align-items:center; justify-content:center; gap:5px; margin-top:10px; width:100%; border-radius:9px; border:1px solid var(--ink-700); background:transparent; padding:6px 10px; font-size:11.5px; font-weight:700; color:var(--text-4); transition:all .15s;}
  .mgmt-plats-toggle:active{transform:scale(.97);}
  .mgmt-plats-toggle svg{width:11px; height:11px; flex-shrink:0;}
  .mgmt-plat-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .mgmt-plat-chip{font-size:12px; font-weight:700; background:var(--ink-800); border:1px solid var(--ink-700); border-radius:8px; padding:4px 7px; color:var(--text-3); white-space:nowrap;}
  .mgmt-actions{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;}
  .mgmt-btn{display:flex; align-items:center; justify-content:center; gap:5px; flex:1; min-width:70px; border-radius:10px; border:1px solid var(--ink-600); background:var(--ink-800); padding:7px 8px; font-size:12px; font-weight:800; color:var(--text-2); transition:all .15s;}
  .mgmt-btn:active{transform:scale(.95);}
  .mgmt-btn svg{width:12px; height:12px;}
  .mgmt-btn.primary{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-btn.danger{color:var(--red); border-color:rgba(232,25,44,.3);}
  .mgmt-btn.danger-confirm{background:var(--red); border-color:var(--red); color:#fff;}
  .mgmt-item.editing{border-color:var(--red);}

  /* channels management */
  .chan-add-card{background:var(--ink-850); border:1px dashed var(--ink-600); border-radius:16px; padding:16px; margin-bottom:14px;}
  .chan-add-row{display:flex; gap:8px;}
  .chan-emoji-input{width:56px; flex-shrink:0; text-align:center; font-size:20px; padding:13px 4px;}
  .chan-item{position:relative; display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px 12px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:16px; padding:12px 14px 12px 16px; margin-bottom:10px; overflow:hidden;}
  .chan-item.chan-item--private{border-color:rgba(56,189,248,.4); background:linear-gradient(135deg, rgba(56,189,248,.1), var(--ink-850) 55%);}
  .chan-item.chan-item--private::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--sky);}
  .chan-private-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; color:var(--sky); background:rgba(56,189,248,.14); border:1px solid rgba(56,189,248,.35); border-radius:999px; padding:2px 8px; margin-inline-start:6px; white-space:nowrap; vertical-align:middle;}
  .chan-emoji{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;}
  .chan-mid{flex:1 1 170px; min-width:0;}
  .chan-name{font-size:15.5px; font-weight:800; color:#fff; overflow-wrap:break-word; word-break:break-word; white-space:normal; line-height:1.4;}
  .chan-sub{font-size:12.5px; font-weight:700; margin-top:4px; line-height:1.7;}
  .chan-actions{display:flex; gap:6px; flex-shrink:0; margin-inline-start:auto;}
  .chan-icon-btn{width:32px; height:32px; border-radius:9px; background:var(--ink-800); border:1px solid var(--ink-600); display:flex; align-items:center; justify-content:center; color:var(--text-5); transition:transform .1s; flex-shrink:0;}
  .chan-icon-btn:active{transform:scale(.9);}
  .chan-icon-btn svg{width:14px; height:14px;}
  .chan-icon-btn.danger-confirm{width:auto; padding:0 10px; background:var(--red); color:#fff; font-size:12px; font-weight:800; white-space:nowrap;}
  .chan-editing{background:var(--ink-850); border:1px solid var(--red); border-radius:16px; padding:14px; margin-bottom:10px;}
  .cat-chan-url{font-size:12px; color:var(--text-5); direction:ltr; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;}

  /* subscriptions table */
  .sub-table-wrap{overflow-x:auto; border:1px solid var(--ink-700); border-radius:16px; background:var(--ink-850);}
  .sub-table{width:100%; border-collapse:collapse; min-width:640px; font-size:14px;}
  .sub-table thead th{position:sticky; top:0; background:var(--ink-800); color:var(--text-4); font-size:12.5px; font-weight:800; text-align:right; padding:11px 12px; border-bottom:1px solid var(--ink-700); white-space:nowrap;}
  .sub-table tbody td{padding:12px; border-bottom:1px solid var(--ink-700); color:var(--text-2); vertical-align:middle; white-space:nowrap;}
  .sub-table tbody tr:last-child td{border-bottom:none;}
  .sub-num{color:var(--text-5); font-weight:800; text-align:center; width:32px;}
  .sub-email-cell{white-space:normal; min-width:170px;}
  .sub-email{color:#fff; font-weight:700; font-size:13.5px;}
  .sub-dname{color:var(--text-4); font-size:12.5px; margin-top:2px;}
  .sub-days{font-size:12px; font-weight:800; color:var(--text-4); margin-top:2px;}
  tr.sub-near td{background:rgba(245,166,35,.07);}
  tr.sub-near .sub-days{color:var(--gold);}
  tr.sub-expired td{background:rgba(232,25,44,.07);}
  tr.sub-expired .sub-days{color:var(--red);}
  .sub-actions-cell{display:flex; gap:6px;}
  .sub-edit-row td{padding:14px; background:var(--ink-800);}
  .sub-edit-card{display:flex; flex-direction:column; gap:10px; max-width:360px;}

  /* link-per-publish button + modal */
  .btn-addlink{display:flex; align-items:center; justify-content:center; gap:5px; border-radius:12px; border:1px dashed var(--ink-600); background:transparent; padding:9px 12px; font-size:12.5px; font-weight:800; color:var(--text-4); flex-shrink:0; transition:all .15s; margin-top:8px; width:100%;}
  .btn-addlink:active{transform:scale(.97);}
  .btn-addlink.has-links{border-style:solid; border-color:rgba(56,189,248,.4); color:var(--sky); background:rgba(56,189,248,.08);}
  .links-count-badge{display:inline-flex; align-items:center; gap:3px; font-size:11.5px; font-weight:800; color:var(--sky);}
  .btn-publish:disabled, .mgmt-btn:disabled{opacity:.55; pointer-events:none;}
  .btn-publish.saving{background:var(--ink-700); box-shadow:none; color:var(--text-3);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin-dot{display:inline-block; width:14px; height:14px; border-radius:999px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; animation:spin .7s linear infinite;}

  .pm-backdrop{position:fixed; left:0; right:0; top:0; height:calc(var(--app-vh, 1vh) * 100); z-index:60; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; animation:fadein .15s ease-out;}
  .pm-sheet{max-height:88%; overflow-y:auto;}
  @media (min-width:880px){ .pm-backdrop{ align-items:center; } }
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  .pm-sheet{width:100%; max-width:480px; background:var(--ink-850); border:1px solid var(--ink-700); border-radius:20px 20px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 18px); animation:slideup .22s ease-out;}
  @media (min-width:880px){ .pm-sheet{ border-radius:20px; margin:0 16px; } }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .pm-handle{width:36px; height:4px; border-radius:999px; background:var(--ink-600); margin:0 auto 14px;}
  .pm-title{font-size:16.5px; font-weight:800; color:#fff; margin:0;}
  .pm-sub{font-size:13.5px; color:var(--text-4); margin:4px 0 14px; line-height:1.6;}
  .pm-qty-chip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800; color:var(--gold); background:rgba(245,166,35,.12); border-radius:999px; padding:4px 10px; margin-bottom:12px;}
  .pm-textarea{width:100%; min-height:92px; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:12px 13px; font-size:14.5px; font-weight:600; color:#fff; outline:none; resize:vertical; direction:ltr; text-align:left;}
  .pm-textarea::placeholder{color:#5c5c64; direction:rtl; text-align:right;}
  .pm-textarea:focus{border-color:var(--sky);}
  .pm-hint{font-size:12px; color:var(--text-5); margin-top:8px; line-height:1.6;}
  .pm-actions{display:flex; gap:8px; margin-top:16px; scroll-margin-bottom:12px;}
  .pm-skip{flex:1; border-radius:12px; border:1px solid var(--ink-600); background:var(--ink-800); padding:14px 0; font-size:14.5px; font-weight:800; color:var(--text-2);}
  .pm-skip:active{transform:scale(.97);}
  .pm-confirm{flex:1.4; border-radius:12px; background:var(--red); padding:14px 0; font-size:14.5px; font-weight:800; color:#fff; box-shadow:0 0 0 1px rgba(232,25,44,.35), 0 8px 30px -8px rgba(232,25,44,.45);}
  .pm-confirm:active{transform:scale(.97);}

  /* channel type toggle */
  .chan-type-toggle{display:flex; gap:8px; margin:10px 0;}
  .chan-type-opt{flex:1; border-radius:11px; border:1px solid var(--ink-600); background:var(--ink-800); padding:10px 6px; font-size:12.5px; font-weight:800; color:var(--text-4); text-align:center; transition:all .15s;}
  .chan-type-opt.active{border-color:var(--sky); color:var(--sky); background:rgba(56,189,248,.1);}
  .chan-type-badge{font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px; margin-right:6px; white-space:nowrap;}
  .chan-type-badge.link{background:rgba(56,189,248,.14); color:var(--sky);}
  .chan-type-badge.messaging{background:rgba(52,211,153,.14); color:#34d399;}


  /* ===== pending-approval bubble + subscriptions extras ===== */
  .navbtn .nav-ico{position:relative; display:inline-flex; font-size:inherit; font-weight:inherit;}
  .navbtn .nav-badge{position:absolute; top:-8px; right:-12px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--red); color:#fff; font-size:11px; font-weight:900; line-height:18px; text-align:center; box-shadow:0 0 0 2px var(--ink-900); animation:badgePop .45s cubic-bezier(.3,1.6,.5,1);}
  .navbtn .nav-badge::after{content:""; position:absolute; inset:-3px; border-radius:999px; border:2px solid var(--red); opacity:0; animation:ringOut 1.9s ease-out infinite;}
  .navbtn .nav-ico.has-alert > svg{animation:crownBob 3.2s ease-in-out infinite; transform-origin:50% 100%;}
  @keyframes badgePop{from{transform:scale(0);} to{transform:scale(1);}}
  @keyframes ringOut{0%{transform:scale(.85); opacity:.75;} 70%,100%{transform:scale(1.7); opacity:0;}}
  @keyframes crownBob{0%,55%,100%{transform:translateY(0) rotate(0);} 62%{transform:translateY(-2px) rotate(-8deg);} 70%{transform:translateY(-2px) rotate(8deg);} 78%{transform:translateY(-1px) rotate(-5deg);} 86%{transform:translateY(0) rotate(0);}}
  @keyframes bellRing{0%,45%,100%{transform:rotate(0);} 52%{transform:rotate(16deg);} 60%{transform:rotate(-14deg);} 68%{transform:rotate(10deg);} 76%{transform:rotate(-6deg);} 84%{transform:rotate(0);}}
  @keyframes alertGlow{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,0);} 50%{box-shadow:0 0 0 5px rgba(245,166,35,.12);}}
  @keyframes dotPulse{0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.7);}}

  .sub-alert{display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, rgba(245,166,35,.16), var(--ink-850) 70%); border:1px solid rgba(245,166,35,.42); border-radius:16px; padding:13px 14px; margin-bottom:12px; animation:alertGlow 2.6s ease-in-out infinite;}
  .sub-alert-bubble{position:relative; width:42px; height:42px; border-radius:999px; background:var(--gold); color:#1d1300; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sub-alert-bubble svg{width:21px; height:21px; transform-origin:50% 12%; animation:bellRing 3s ease-in-out infinite;}
  .sub-alert-bubble::after{content:""; position:absolute; inset:-2px; border-radius:999px; border:2px solid var(--gold); opacity:0; animation:ringOut 1.9s ease-out infinite;}

  /* نفس منطق effectiveChannels() فوق بالظبط، بس لقنوات العقارات
     المنفصلة تمامًا عن قنوات السيارات (مجموعات مختلفة في Firestore). */
  function effectivePropertyChannels(){
    var myC = state.myCountry || "egypt";
    var globals = state.propertyGlobalChannels.filter(function(g){ return state.isAdmin || effCountry(g) === myC; }).map(function(g){
      var ov = state.propertyChannelOverrides[g.id];
      if(!ov) return Object.assign({ scope:"global" }, g);
      return Object.assign({}, g, ov, { id: g.id, scope:"global", overridden:true });
    });
    var globalIds = {};
    globals.forEach(function(g){ globalIds[g.id] = true; });
    var privates = state.propertyPlatforms.filter(function(p){ return !globalIds[p.id]; }).map(function(p){ return Object.assign({ scope:"private" }, p); });
    return globals.concat(privates).sort(function(a,b){ return (a.order||0) - (b.order||0); });
  }

  /* effective list every user actually sees/uses: global channels (with their own
     personal overrides applied) merged with their own private channels.
     لو حصل تعارض وقناة خاصة عندها نفس الـ id بتاع قناة عامة (مثلاً بعد
     نقل قناة من خاص لعام، أو أي تطابق نادر في الـ id)، القناة العامة
     هي اللي بتتاخد وبنستبعد النسخة الخاصة، عشان محدش يشوف نفس القناة
     مرتين ولا يحصل تعارض في مفاتيح campaign/lastPublished. */
  function effectiveChannels(){
    /* بنعرض بس القنوات العامة الخاصة ببلد المستخدم — قنوات مصر
       (من غير حقل country، أو country="egypt") متظهرش لمستخدم
       سعودي أو أمريكي والعكس. القنوات الخاصة (platforms) أصلًا
       جوه حساب المستخدم نفسه فمش محتاجة فلترة بلد. */
    var myC = state.myCountry || "egypt";
    /* الأدمن بيدير قنوات كل البلدان، فمش بنفلتر له — العميل العادي
       بس هو اللي بيشوف قنوات بلده. */
    var globals = state.globalChannels.filter(function(g){ return state.isAdmin || effCountry(g) === myC; }).map(function(g){
      var ov = state.channelOverrides[g.id];
      if(!ov) return Object.assign({ scope:"global" }, g);
      return Object.assign({}, g, ov, { id: g.id, scope:"global", overridden:true });
    });
    var globalIds = {};
    globals.forEach(function(g){ globalIds[g.id] = true; });
    var privates = state.platforms.filter(function(p){ return !globalIds[p.id]; }).map(function(p){ return Object.assign({ scope:"private" }, p); });
    return globals.concat(privates).sort(function(a,b){ return (a.order||0) - (b.order||0); });
  }

  /* ترتيب عرض بس لصفحة "قنوات النشر" (وصفحة السيارات كمان)، بيحط
     العناصر المثبتة (pinned) في الأول من غير ما يغيّر أي حاجة في
     ترتيب دورة النشر نفسها — effectiveChannels() فوق بيفضل بيرتب
     بالـ order العادي زي ما هو، والتثبيت ده بيأثر بس على الشكل اللي
     بيظهر بيه في صفحة الإدارة. */
  function pinnedFirst(list){
    return list.slice().sort(function(a,b){
      if(!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
      return (a.order||0) - (b.order||0);
    });
  }

          /* حساب قديم من قبل دعم البلدان — نثبّته على مصر تلقائيًا

          accountCountryMigrating = true;

            accountCountryMigrating = false;

  /* ---------------- account bootstrap + one-time legacy data import ---------------- */
  var accountCountryMigrating = false;

  function ensureAccount(user){
    var accountRef = doc(db, "accounts", user.uid);
    getDoc(accountRef).then(function(snap){
      if(!snap.exists()){
        /* حساب جديد تمامًا: من غير حقل country عمدًا، عشان نعرض على
           المستخدم شاشة اختيار البلد مرة واحدة فور التسجيل، بدل ما
           نفترض بلد بالغلط. */
        state.isBrandNewAccount = true;
        var trialStart = Date.now();

  /* ---------------- helpers ---------------- */
  function globalLast(car){
    var vals = Object.keys(car.lastPublished).map(function(k){return car.lastPublished[k];}).filter(function(v){return v!==null && v!==undefined;});
    if(vals.length===0) return null;
    return Math.max.apply(null, vals);
  }
  function daysSince(ts){ if(ts===null||ts===undefined) return null; return Math.floor((Date.now()-ts)/86400000); }
  function isToday(ts){
    if(ts===null||ts===undefined) return false;
    var d = new Date(ts), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }
  function formatRelative(ts){
    if(ts===null||ts===undefined) return t("rel_never");
    var d = daysSince(ts);
    if(state.lang === "en"){
      if(d===0){ var hrsE = Math.floor((Date.now()-ts)/3600000); if(hrsE<1) return t("rel_moments"); return "" + hrsE + " " + (hrsE===1?t("rel_hour"):t("rel_hours")) + " " + t("rel_ago"); }
      if(d===1) return "1 " + t("rel_day") + " " + t("rel_ago");
      return "" + d + " " + t("rel_days") + " " + t("rel_ago");
    }
    if(d===0){ var hrs = Math.floor((Date.now()-ts)/3600000); if(hrs<1) return "منذ لحظات"; return "منذ " + hrs + " " + (hrs===1?"ساعة":"ساعات"); }
    if(d===1) return "منذ يوم واحد";
    if(d===2) return "منذ يومين";
    if(d<11) return "منذ " + d + " أيام";
    return "منذ " + d + " يومًا";
  }
  function urgencyTier(days){
    if(days===null||days===undefined) return "urgent";
    if(days<=2) return "fresh";
    if(days<=5) return "ok";
    if(days<=9) return "warn";
    return "urgent";
  }
  var URGENCY = {
    fresh: { text:"#34d399", bg:"rgba(52,211,153,.12)" },
    ok:    { text:"#38bdf8", bg:"rgba(56,189,248,.12)" },
    warn:  { text:"#F5A623", bg:"rgba(245,166,35,.12)" },
    urgent:{ text:"#E8192C", bg:"rgba(232,25,44,.12)" }
  };
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- security: URL sanitization ----------------
     Only http(s) links are ever allowed to be rendered as href/text.
     This blocks javascript:, data:, vbscript: and other schemes that
     could otherwise be injected via a car's ad link or a publish link
     and executed when the user taps it. */
  function isValidUrl(s){
    if(typeof s !== "string") return false;
    var t = s.trim();
    if(!t) return false;
    if(t.length > 2000) return false; // guard against pathological input
    return /^https?:\/\/[^\s"'<>]+$/i.test(t);
  }
  function sanitizeHref(s){
    return isValidUrl(s) ? String(s).trim() : "";
  }

  /* ---------------- queue logic ---------------- */
  function activeCars(){ return curItems().filter(function(c){ return c.active; }); }

  /**
   * Urgency = days waited * priority weight.
   * This is the fix for "same car keeps repeating": priority used to be an
   * absolute override, so a high-priority car could block others forever.
   * Now priority just accelerates how fast a car becomes urgent — every
   * active car eventually surfaces, guaranteed, while important cars still
   * come up more often on average.
   */
  function urgencyScore(car, platform){
    var ts = platform === "global" ? globalLast(car) : (car.lastPublished[platform] !== undefined ? car.lastPublished[platform] : null);
    var rawDays = (ts === null || ts === undefined) ? 30 : (Date.now() - ts) / 86400000;
    var days = Math.min(rawDays, URGENCY_DAYS_CAP);
    var weight = (PRIORITY_META[car.priority] && PRIORITY_META[car.priority].urgencyWeight) || 1;
    return days * weight;
  }

  function cmpForPlatform(a, b, platform){
    var diff = urgencyScore(b, platform) - urgencyScore(a, platform);
    if(diff !== 0) return diff;
    return a.createdAt - b.createdAt;
  }

  /* ---------------- domain accessors (car ↔ property) ----------------
     نفس منطق الطابور/النشر/الإحصائيات شغال حرفيًا لنوعين مختلفين من
     البيانات (سيارات وعقارات)، فبدل ما نكرر كل خوارزمية الطابور
     المعقّدة دي مرتين، بنخليها تقرأ "الدومين الحالي" من هنا. */
  function curItems(){ return state.domain === "property" ? state.properties : state.cars; }
  function curLog(){ return state.domain === "property" ? state.propertyLog : state.log; }
  function curLogCol(){ return state.domain === "property" ? propertyLogCol : logCol; }
  function curItemsPath(){ return state.domain === "property" ? "properties" : "cars"; }
  function curEffectiveChannels(){ return state.domain === "property" ? effectivePropertyChannels() : effectiveChannels(); }

  function campaignEntry(car, platform){
    return (car.campaign && car.campaign[platform]) ? car.campaign[platform] : null;
  }
  function campaignComplete(car, platform){
    var e = campaignEntry(car, platform);
    return !!(e && e.target > 0 && e.done >= e.target);
  }

  /* العربيات اللي "ممكن" تتنشر على القناة دي: إما مالهاش حملة خالص
     (فهي متاحة لأي قناة عادي)، أو ليها حملة شاملة القناة دي بالتحديد.
     العربية اللي ليها حملة على قنوات تانية بس، مش بتتحسب هنا. */
  function relevantCarsFor(platform){
    return activeCars().filter(function(c){
      var hasCampaign = c.campaign && Object.keys(c.campaign).length > 0;
      return !hasCampaign || !!c.campaign[platform];
    });
  }

  function suggestionFor(platform){
    var list = queueForPlatform(platform);
    return list.length ? list[0] : null;
  }

  /* طابور اليوم الكامل للقناة دي: مش عربية واحدة بس، ده أهم فرق —
     القناة اللي هدفها اليومي (dailyTarget) = 4 مفروض تطلع 4 عربيات
     مختلفة (أكتر العربيات "عطشانة" للنشر، يعني أطول مدة من غير نشر
     على القناة دي مضروبة في وزن الأولوية)، مش كارت واحد بيتحدّث كل
     مرة تنشر فيها. بعد ما تنشر لعربية، آخر نشر بتاعها بيتحدّث فيقل
     ترتيبها في الطابور، فبكرة هيظهر مكانها عربية تانية أطول انتظارًا —
     وده اللي بيعمل "دورة" (cycle) تضمن إن كل العربيات بتتغطى بالتبادل
     بدل ما عربية واحدة تتكرر أو عربية تانية تتنسى. */
  /* هل السيارة لسه "مستريحة" على القناة دي بسبب فاصل إعادة النشر
     (repostIntervalDays)؟ الفاصل بيتحسب من آخر نشر ليها هي بس على
     القناة دي (مش على أي قناة تانية)، ومفيش أي تأثير على سيارات تانية —
     كل سيارة وحسبتها لوحدها. لو النشر حصل النهارده نفسها فده بيتحسب
     في "doneTodayCars" أصلاً ومش بيدخل الفلتر ده خالص. */
  function inCooldown(car, platform, meta){
    var days = (meta && meta.repostIntervalDays > 0) ? meta.repostIntervalDays : 0;
    if(!days) return false;
    var last = car.lastPublished[platform];
    var ds = daysSince(last);
    return ds !== null && ds < days;
  }

  function queueForPlatform(platform){
    var meta = curEffectiveChannels().filter(function(p){return p.id===platform;})[0];
    var target = channelTarget(meta);
    var relevant = activeCars().filter(function(c){
      /* لو السيارة عندها حملة محددة (اختار لها قنوات معينة)، القناة دي لازم
         تكون من ضمن القنوات المختارة، وإلا متتحطش في مهام القناة دي خالص. */
      var hasCampaign = c.campaign && Object.keys(c.campaign).length > 0;
      if(hasCampaign && !c.campaign[platform]) return false;
      return !campaignComplete(c, platform);
    });
    /* العربيات اللي اتسجّل لها نشر النهارده فعلاً على القناة دي بتتحسب
       ضمن الهدف، حتى لو عددها زاد عن الهدف نفسه (المستخدم سجّل لعربيات
       أكتر من العدد المطلوب) — في الحالة دي بنعرض بس أول N منهم عشان
       عدد الكروت الظاهرة للقناة يفضل مطابق لهدفها اليومي بالظبط ومايزيدش
       عنه، زي ما هو متوقع. */
    var doneTodayCars = relevant.filter(function(c){ return isToday(c.lastPublished[platform]); })
      .sort(function(a,b){ return (b.lastPublished[platform]||0) - (a.lastPublished[platform]||0); })
      .slice(0, target);
    var pendingCars = relevant.filter(function(c){ return !isToday(c.lastPublished[platform]) && !inCooldown(c, platform, meta); })
      .slice().sort(function(a,b){ return cmpForPlatform(a,b,platform); });
    /* بنستخدم الأكبر بين اللي ظاهر دلوقتي في "relevant" واللي مسجّل
       فعلاً في السجل التاريخي، عشان عربية خلّصت حملتها أو اتشالت بعد
       ما اتنشرت النهارده تفضل تحسب من حصة القناة ومتديش كروت زيادة. */
    var realDoneCount = Math.max(doneTodayCars.length, channelDoneCarsToday(platform));
    var neededPending = Math.max(0, target - realDoneCount);
    return doneTodayCars.concat(pendingCars.slice(0, neededPending));
  }

  function startOfToday(){
    var now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  }
  function linksTodayCount(carId, platform){
    var sod = startOfToday();
    var count = 0;
    curLog().forEach(function(l){
      if(l.carId === carId && l.platform === platform && l.timestamp >= sod && l.links) count += l.links.length;
    });
    return count;
  }
  /* هل حصل نشر (لأي عربية) على القناة دي النهارده؟ بنعتمد على سجل النشر
     نفسه بدل ما نتابع "آخر نشر" لعربية واحدة بس، لأن العربية المقترحة
     للقناة بتتغيّر فورًا بعد النشر (تبقى العربية اللي لسه محتاجة نشر)،
     فلو اتابعنا عربية واحدة هيفضل يظهر إن القناة "لسه" حتى لو فعلاً
     اتنشر فيها حاجة النهارده لعربية تانية.
     كمان بقت "quota-aware": بعض القنوات ممكن تحتاج أكتر من نشرة واحدة
     في اليوم (channel.dailyTarget)، فمش بس بنشوف "حصل نشر ولا لأ"،
     بنقارن عدد مرات النشر النهارده بالهدف المطلوب. */
  function channelTarget(meta){
    return (meta && meta.dailyTarget > 0) ? meta.dailyTarget : 1;
  }
  /* مفيش id ثابت لقناة "مجموعات فيس بوك" لأنها قناة مخصّصة بيضيفها
     المستخدم/الأدمن بنفسه (مش من القنوات الافتراضية)، فبنتعرف عليها
     من اسمها بدل الـ id. */
  function isFacebookGroupsChannel(meta){
    if(!meta || !meta.label) return false;
    var label = meta.label;
    return /فيس/.test(label) && /(مجموع|جروب)/.test(label);
  }
  function platformPublishCountToday(platform){
    var sod = startOfToday();
    var count = 0;
    curLog().forEach(function(l){ if(l.platform === platform && l.timestamp >= sod) count++; });
    return count;
  }
  /* عدد العربيات (مش عدد سجلات النشر) اللي فعلاً استهلكت حصة القناة
     دي النهارده، مبني على سجل النشر (state.log) بدل قايمة "relevant"
     الحية. الفرق مهم: عربية ممكن تتنشر النهارده وتخلّص حملتها أو
     تتوقف/تتشال بعد كده — لحظتها بتختفي من "relevant" فمتتحسبش ضمن
     doneTodayCars جوه queueForPlatform، فالحساب هناك كان بيفتكر إن
     القناة لسه محتاجة نفس العدد الأصلي تاني ويطلع كروت مهام جديدة
     زيادة عن هدف اليوم الحقيقي. السجل التاريخي مبيتغيرش زي حالة
     العربية، فده المرجع الثابت لعدد العربيات اللي استحقت من حصة اليوم. */
  function channelDoneCarsToday(platform){
    var sod = startOfToday();
    var seen = {};
    curLog().forEach(function(l){
      if(l.platform === platform && l.timestamp >= sod) seen[l.carId] = true;
    });
    return Object.keys(seen).length;
  }
  function platformDoneToday(platform){
    var meta = curEffectiveChannels().find(function(c){ return c.id === platform; });
    return platformPublishCountToday(platform) >= channelTarget(meta);
  }

  function computeStats(){
    var now = new Date();
    var startOfDay = startOfToday();
    var daysSinceSat = (now.getDay() + 1) % 7;
    var startOfWeek = startOfDay - daysSinceSat * 86400000;

    var postsToday = curLog().filter(function(l){ return l.timestamp >= startOfDay; }).length;
    var postsThisWeek = curLog().filter(function(l){ return l.timestamp >= startOfWeek; }).length;

    var mostPublished = null;
    curItems().forEach(function(c){
      if(!mostPublished || c.totalPublishes > mostPublished.totalPublishes) mostPublished = c;
    });
    if(mostPublished && mostPublished.totalPublishes === 0) mostPublished = null;

    var staleCar = null, staleDays = -1;
    activeCars().forEach(function(c){
      var last = globalLast(c);
      var d = last===null ? Infinity : Math.floor((Date.now()-last)/86400000);
      if(d > staleDays){ staleDays = d; staleCar = c; }
    });

    return {
      activeCount: activeCars().length,
      postsToday: postsToday,
      postsThisWeek: postsThisWeek,
      mostPublished: mostPublished,
      staleCar: staleCar,
      staleDays: staleDays===Infinity ? null : staleDays
    };
  }

  /* ---------------- actions (write to Firestore; onSnapshot re-renders) ---------------- */
  function addCar(name, adLink, notes, priority, campaign){
    addDoc(carsCol, {
      name: name.trim(), adLink: adLink.trim(), notes: notes.trim(),
      priority: priority, createdAt: Date.now(), active: true,
      lastPublished: {}, totalPublishes: 0,
      campaign: campaign || {}
    }).then(function(){
      showToast(state.lang==="en" ? "Car added to the queue" : "تمت إضافة السيارة للطابور");
    }).catch(function(err){
      console.error("addCar error:", err);
      showToast(state.lang==="en" ? "Failed to add — check your connection" : "فشلت الإضافة — تحقق من الاتصال");
    });
  }

  function removeCar(id){
    state.confirmDeleteId = null;
    var removedCar = state.cars.find(function(c){ return c.id === id; });
    deleteDoc(doc(db, "accounts", currentUser.uid, "cars", id)).catch(function(err){
      console.error("removeCar error:", err);
      showToast(state.lang==="en" ? "Delete failed — check your connection" : "فشل الحذف — تحقق من الاتصال");
    });
    /* عربية اتمسحت وكانت معروضة في معرض البيع — لازم تتشال من هناك
       كمان، وإلا هتفضل ظاهرة لباقي المشتركين رغم إنها اتحذفت خالص. */
    if(removedCar && removedCar.listedForSale){
      deleteDoc(doc(db, "marketplace", id)).catch(function(err){
        console.error("removeCar marketplace unlist error:", err);
      });
    }
    render();
  }

  function pendingKey(carId, platform){ return carId + "::" + platform; }
  function isPending(carId, platform){ return !!state.pendingWrites[pendingKey(carId, platform)]; }

  function markPublished(carId, platform, links){
    var now = Date.now();
    var car = curItems().find(function(c){ return c.id === carId; });
    if(!car) return;
    if(isPending(carId, platform)) return; // guard against double-tap while a write is in flight

    var safeLinks = (links || []).filter(isValidUrl);
    var prevTs = car.lastPublished ? car.lastPublished[platform] : undefined;
    var key = pendingKey(carId, platform);

    /* optimistic local update — reflect instantly, don't wait on the network */
    car.lastPublished = Object.assign({}, car.lastPublished);
    car.lastPublished[platform] = now;
    car.totalPublishes += 1;
    state.justPublished = platform;
    state.pendingWrites[key] = true;
    render();
    setTimeout(function(){ state.justPublished = null; render(); }, 500);

    var update = {};
    update["lastPublished." + platform] = now;
    update.totalPublishes = increment(1);

    updateDoc(doc(db, "accounts", currentUser.uid, curItemsPath(), carId), update).then(function(){
      delete state.pendingWrites[key];
      render();
    }).catch(function(err){
      console.error("markPublished error:", err);
      /* roll back the optimistic update so the UI matches reality */
      delete state.pendingWrites[key];
      car.lastPublished = Object.assign({}, car.lastPublished);
      car.lastPublished[platform] = prevTs;
      car.totalPublishes -= 1;
      showToast(state.lang==="en" ? "⚠️ Not saved to the server — try again" : "⚠️ لم يُحفظ على السيرفر — حاول تاني");
      render();
    });

    addDoc(curLogCol(), { carId: carId, carName: car.name, platform: platform, timestamp: now, quantity: 1, links: safeLinks }).catch(function(err){
      console.error("log write error:", err);
    });
  }

  function registerCampaignProgress(carId, platform, qty, links){
    var now = Date.now();
    var car = curItems().find(function(c){ return c.id === carId; });
    if(!car) return;
    var entry = campaignEntry(car, platform);
    if(!entry) return;
    if(isPending(carId, platform)) return; // guard against double-tap while a write is in flight

    var safeLinks = (links || []).filter(isValidUrl);
    var newDone = Math.min(entry.target, entry.done + qty);
    var platMeta = curEffectiveChannels().find(function(p){ return p.id === platform; });
    var prevDone = entry.done;
    var prevTs = car.lastPublished ? car.lastPublished[platform] : undefined;
    var key = pendingKey(carId, platform);

    /* optimistic local update */
    car.campaign = Object.assign({}, car.campaign);
    car.campaign[platform] = Object.assign({}, entry, { done: newDone });
    car.lastPublished = Object.assign({}, car.lastPublished);
    car.lastPublished[platform] = now;
    car.totalPublishes += qty;
    state.justPublished = platform;
    state.pendingWrites[key] = true;
    render();
    setTimeout(function(){ state.justPublished = null; render(); }, 500);

    var update = {};
    update["campaign." + platform + ".done"] = newDone;
    update["lastPublished." + platform] = now;
    update.totalPublishes = increment(qty);

    updateDoc(doc(db, "accounts", currentUser.uid, curItemsPath(), carId), update).then(function(){
      delete state.pendingWrites[key];
      if(newDone >= entry.target){
        showToast(state.lang==="en"
          ? "🎉 Finished the " + (platMeta ? platMeta.label : platform) + " campaign for " + car.name
          : "🎉 خلصت حملة " + (platMeta ? platMeta.label : platform) + " لعربية " + car.name);
      } else {
        showToast(state.lang==="en"
          ? "Registered " + qty + " — " + (entry.target - newDone) + " left"
          : "تم تسجيل " + qty + " — الباقي " + (entry.target - newDone));
      }
      render();
    }).catch(function(err){
      console.error("registerCampaignProgress error:", err);
      /* roll back the optimistic update so the UI matches reality */
      delete state.pendingWrites[key];
      car.campaign = Object.assign({}, car.campaign);
      car.campaign[platform] = Object.assign({}, entry, { done: prevDone });
      car.lastPublished = Object.assign({}, car.lastPublished);
      car.lastPublished[platform] = prevTs;
      car.totalPublishes -= qty;
      showToast(state.lang==="en" ? "⚠️ Not saved to the server — try again" : "⚠️ لم يُحفظ على السيرفر — حاول تاني");
      render();
    });

    addDoc(curLogCol(), { carId: carId, carName: car.name, platform: platform, timestamp: now, quantity: qty, links: safeLinks }).catch(function(err){
      console.error("log write error:", err);
    });
  }

  /* ---------------- publish modal (optional links per publish action) ---------------- */
  function openPublishModal(carId, platform, qty){
    state.publishModal = { carId: carId, platform: platform, qty: qty || null };
    render();
    /* ملاحظة: قصدًا مش بنعمل focus() على خانة الروابط هنا. الخطوة دي
       اختيارية بالكامل، ولو ركّزنا الخانة تلقائيًا، الكيبورد بيفتح
       فورًا ويغطي زراري "تخطي"/"تم النشر" قبل ما المستخدم يقرر أصلاً
       هل عايز يكتب رابط ولا لأ. سيبنا التركيز يحصل بس لو المستخدم
       دوس على الخانة بنفسه. */
  }
  function closePublishModal(){
    state.publishModal = null;
    render();
  }
  function finalizePublishModal(withLinks){
    var pm = state.publishModal;
    if(!pm) return;
    var links = [];
    if(withLinks){
      var ta = document.getElementById("pm-links");
      var raw = ta ? ta.value : "";
      var rawLines = raw.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
      links = rawLines.filter(isValidUrl);
      if(links.length < rawLines.length){
        showToast(state.lang==="en"
          ? "Ignored " + (rawLines.length - links.length) + " invalid link(s)"
          : "تم تجاهل " + (rawLines.length - links.length) + " رابط غير صالح");
      }
    }
    state.publishModal = null;
    if(pm.qty){
      registerCampaignProgress(pm.carId, pm.platform, pm.qty, links);
    } else {
      markPublished(pm.carId, pm.platform, links);
    }
  }

  function slotCard(platform, car){
    var meta = curEffectiveChannels().filter(function(p){return p.id===platform;})[0];
    if(!meta) return "";
    if(car === undefined) car = suggestionFor(platform);
    if(!car){
      var totalActiveCars = activeCars().length;
      var relevantCars = relevantCarsFor(platform);
      var allCampaignDone = relevantCars.length > 0 && relevantCars.every(function(c){ return campaignComplete(c, platform); });
      /* في الأصل كانت الرسالة الافتراضية دايمًا "لا توجد سيارات نشطة"
         حتى لو فيه عربيات نشطة فعلاً، بس مستبعدة من القناة دي لأن
         عندها حملة مخصصة بقناة تانية — ده كان مضلّل. دلوقتي بنفرّق
         بين ٣ حالات مختلفة توضح السبب الحقيقي. */
      var emptyMsg;
      if(totalActiveCars === 0){
        emptyMsg = t("empty_no_active_cars");
      } else if(allCampaignDone){
        emptyMsg = t("empty_campaign_all_done");
      } else if(relevantCars.length === 0){
        emptyMsg = t("empty_relevant_none");
      } else {
        emptyMsg = t("empty_no_active_cars");
      }
      return '<div class="empty-slot">' +
        '<div class="platform-icon" style="background:' + meta.bg + '">' + meta.emoji + '</div>' +
        '<p class="t1">' + esc(meta.label) + (meta.scope==="private" ? privateTag() : '') + '</p>' +
        '<p class="t2">' + emptyMsg + '</p>' +
      '</div>';
    }
    var ts = car.lastPublished[platform];
    var days = daysSince(ts);
    var tier = urgencyTier(days);
    var u = URGENCY[tier];
    var prio = PRIORITY_META[car.priority];
    var justPub = state.justPublished === platform;
    /* doneToday هنا خاص بالعربية المعروضة في الكارت نفسها (هل هي اتنشرت
       النهارده على القناة دي؟) — ده اللي بيتحكم في لون/زرار الكارت،
       عشان الزرار يفضل معبّر عن العربية اللي فعلاً هيتسجل نشر ليها.
       channelMet بيتابع القناة ككل (هل وصلت لهدفها اليومي؟ ولو الهدف
       أكتر من مرة، هيوضح كام من كام). الاتنين منفصلين عشان محدش يتلخبط
       بين "خلصت مهمة العربية دي" و"القناة خلصت هدفها اليوم" — خصوصًا
       إن العربية المقترحة للقناة بتتغيّر كل ما حد ينشر عليها. */
    var doneToday = isToday(ts);
    var channelTargetVal = channelTarget(meta);
    var channelCountToday = platformPublishCountToday(platform);
    var channelMet = channelCountToday >= channelTargetVal;
    var camp = campaignEntry(car, platform);
    var safeAdLink = sanitizeHref(car.adLink);
    var linkHtml = car.adLink ? (
      meta.messaging
        ? '<span class="btn-link" dir="ltr">' + ICONS.link.replace('viewBox','style="width:16px;height:16px" viewBox') + esc(car.adLink) + '</span>'
        : (safeAdLink
            ? '<a class="btn-link" href="' + esc(safeAdLink) + '" target="_blank" rel="noopener noreferrer">' + ICONS.link.replace('viewBox','style="width:16px;height:16px" viewBox') + esc(t("ad_link_word")) + '</a>'
            : '<span class="btn-link" dir="ltr">' + ICONS.link.replace('viewBox','style="width:16px;height:16px" viewBox') + esc(car.adLink) + '</span>')
    ) : '';
    var pending = isPending(car.id, platform);
    var isMessaging = !!meta.messaging;
    var safeChanUrl = !isMessaging ? sanitizeHref(meta.url) : "";
    var gotoHtml = safeChanUrl ? '<a class="btn-goto" href="' + esc(safeChanUrl) + '" target="_blank" rel="noopener noreferrer">' + ICONS.send.replace('viewBox','style="width:15px;height:15px" viewBox') + esc(t("run_task_btn")) + '</a>' : '';
    var linksToday = linksTodayCount(car.id, platform);
    var campaignHtml = '';
    var actionsHtml;
    if(camp){
      var pct = Math.min(100, Math.round((camp.done / camp.target) * 100));
      campaignHtml =
        '<div class="mini-progress-wrap" style="margin-top:12px">' +
          '<div class="mini-progress-label"><span>' + esc(t("campaign_progress_label")) + '</span><span class="num-ltr">' + camp.done + ' / ' + camp.target + '</span></div>' +
          '<div class="mini-progress-track"><div class="mini-progress-fill" style="width:' + pct + '%"></div></div>' +
        '</div>';
      var campAction = isMessaging ? "register-campaign" : "register-campaign-with-link";
      actionsHtml =
        '<div class="slot-actions">' + gotoHtml + linkHtml +
          '<input class="input" type="number" min="1" id="camp-qty-' + platform + '-' + car.id + '"' + (pending?' disabled':'') + ' placeholder="' + (isFacebookGroupsChannel(meta) ? esc(t("qty_required")) : esc(t("qty_default"))) + '" style="width:78px;flex-shrink:0;text-align:center;padding:13px 8px" />' +
          '<button class="btn-publish' + (pending?' saving':'') + '" data-action="' + campAction + '" data-car="' + car.id + '" data-platform="' + platform + '"' + (pending?' disabled':'') + '>' + (pending ? '<span class="spin-dot"></span>' : esc(t("register_btn"))) + '</button>' +
        '</div>';
    } else {
      var pubAction = isMessaging ? "publish" : "publish-with-link";
      actionsHtml =
        '<div class="slot-actions">' + gotoHtml + linkHtml +
          '<button class="btn-publish' + (doneToday?' btn-publish-done':'') + (pending?' saving':'') + '" data-action="' + pubAction + '" data-car="' + car.id + '" data-platform="' + platform + '"' + (pending?' disabled':'') + '>' + (pending ? '<span class="spin-dot"></span>' : (ICONS.check.replace('viewBox','style="width:18px;height:18px" viewBox') + (doneToday ? esc(t("publish_again_btn")) : esc(t("published_btn"))))) + '</button>' +
        '</div>';
    }
    return '<div class="card slot' + (justPub?' pop':'') + (doneToday?' slot-done':'') + '">' +
      '<div class="slot-bar" style="background:' + (doneToday ? '#34d399' : u.text) + '"></div>' +
      '<div class="slot-body">' +
        '<div class="slot-head">' +
          '<div class="platform-icon" style="background:' + meta.bg + '">' + meta.emoji + '</div>' +
          '<div class="slot-label">' + esc(meta.label) + (meta.scope==="private" ? privateTag() : '') + '</div>' +
          (doneToday ?
            '<span class="done-badge">' + ICONS.check.replace('viewBox','style="width:11px;height:11px" viewBox') + esc(t("done_today_badge")) + (linksToday>0 ? ' <span class="links-count-badge">· 🔗' + linksToday + '</span>' : '') + '</span>' :
            '<span class="prio-badge" style="' + prio.chip + '">' + priorityLabel(car.priority) + '</span>'
          ) +
        '</div>' +
        '<p class="car-name">' + (state.domain==="property"?'🏠':'🚗') + ' ' + esc(car.name) + '</p>' +
        '<div class="fresh-pill" style="background:' + u.bg + ';color:' + u.text + '">' +
          '<span class="fresh-dot" style="background:' + u.text + '"></span>' + formatRelative(ts) +
        '</div>' +
        (channelTargetVal > 1 || (channelMet && !doneToday) ?
          '<p style="margin:8px 0 0;font-size:11.5px;font-weight:700;color:' + (channelMet ? '#34d399' : '#8a8a92') + '">' +
            (channelMet
              ? (esc(t("channel_target_met")) + '<span class="num-ltr">' + channelCountToday + '/' + channelTargetVal + '</span>)' + (doneToday ? '' : esc(t("channel_target_met_other"))))
              : (esc(t("channel_target_label2")) + '<span class="num-ltr">' + channelCountToday + ' / ' + channelTargetVal + '</span>')) +
          '</p>' : ''
        ) +
        campaignHtml +
        actionsHtml +
      '</div>' +
    '</div>';
  }
